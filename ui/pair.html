<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<title>配对 · Clamicro</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --fg:#12151a; --dim:#6b7280; --line:#e4e7ec;
    --monobg:#f0f2f5; --accent:#1570ef; --ok:#0a7d34;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d10; --card:#14181d; --fg:#e8eaed; --dim:#8b93a1; --line:#242a32;
      --monobg:#0f1318; --accent:#60a5fa; --ok:#4ade80;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* iOS Safari 从 10 起就忽略 user-scalable=no，双击放大只能靠 touch-action 挡。
     manipulation = 保留滚动和捏合，去掉双击缩放那 300ms 的等待。 */
  html{touch-action:manipulation; -webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    padding:calc(48px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
  }
  h1{font-size:22px; margin:0 0 10px}
  p{color:var(--dim); font-size:14.5px; margin:0 0 22px}
  button{
    width:100%; padding:16px; border-radius:12px; cursor:pointer;
    font:600 16px -apple-system,"PingFang SC",sans-serif;
    background:var(--card); border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);
    color:var(--accent);
  }
  button:disabled{opacity:.5}
  button.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent); color:var(--ok)}
  .alt{margin-top:30px; padding-top:22px; border-top:1px solid var(--line)}
  .alt h2{font-size:13px; color:var(--dim); font-weight:600; margin:0 0 8px}
  /* 之前这里没做换行，长路径直接被裁掉，等于什么都没说 */
  pre{
    margin:0; padding:13px; border-radius:9px; background:var(--monobg);
    border:1px solid var(--line); color:var(--fg);
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap; word-break:normal; overflow-wrap:anywhere;
  }
  .note{font-size:13px; color:var(--dim); margin-top:12px}
</style>
</head>
<body>
<h1>需要配对</h1>
<p>这台设备还没有访问口令。点下面的按钮，<b>你的 Mac 上会弹出一个二维码</b>，用相机扫一下就好。</p>

<button id="pair">在 Mac 上显示二维码</button>
<p class="note" id="msg"></p>

<div class="alt">
  <h2>或者在 Mac 终端里执行</h2>
  <pre id="cmd">…</pre>
</div>

<script>
const $ = (id) => document.getElementById(id);
fetch('/api/pair/hint').then((r) => r.json()).then((d) => ($('cmd').textContent = d.command));

$('pair').onclick = async function () {
  this.disabled = true;
  $('msg').textContent = '正在通知 Mac…';
  try {
    const r = await fetch('/api/pair', { method: 'POST', headers: { 'X-CCM': '1' } }).then((r) => r.json());
    if (r.ok) {
      this.textContent = '✓ 已在 Mac 上显示';
      this.classList.add('done');
      $('msg').textContent = '去看你的 Mac 屏幕，用相机扫那个二维码。';
    } else {
      $('msg').textContent = r.error || '失败了，试试下面的命令';
      this.disabled = false;
    }
  } catch {
    $('msg').textContent = '连不上服务，确认它还在运行';
    this.disabled = false;
  }
};
</script>
</body>
</html>
