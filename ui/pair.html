<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<title>配对 · Clamicro</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --fg:#12151a; --dim:#6b7280; --line:#e4e7ec;
    --monobg:#f0f2f5; --accent:#1570ef; --ok:#0a7d34;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d10; --card:#14181d; --fg:#e8eaed; --dim:#8b93a1; --line:#242a32;
      --monobg:#0f1318; --accent:#60a5fa; --ok:#4ade80;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* iOS Safari 从 10 起就忽略 user-scalable=no，双击放大只能靠 touch-action 挡。
     manipulation = 保留滚动和捏合，去掉双击缩放那 300ms 的等待。 */
  html{touch-action:manipulation; -webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg); min-height:100vh;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    padding:calc(48px + env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom));
  }
  h1{font-size:22px; margin:0 0 10px}
  p{color:var(--dim); font-size:14.5px; margin:0 0 22px}
  button{
    width:100%; padding:16px; border-radius:12px; cursor:pointer;
    font:600 16px -apple-system,"PingFang SC",sans-serif;
    background:var(--card); border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);
    color:var(--accent);
  }
  button:disabled{opacity:.5}
  button.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent); color:var(--ok)}
  .alt{margin-top:30px; padding-top:22px; border-top:1px solid var(--line)}
  .alt h2{font-size:13px; color:var(--dim); font-weight:600; margin:0 0 8px}
  /* 之前这里没做换行，长路径直接被裁掉，等于什么都没说 */
  pre{
    margin:0; padding:13px; border-radius:9px; background:var(--monobg);
    border:1px solid var(--line); color:var(--fg);
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-wrap; word-break:normal; overflow-wrap:anywhere;
  }
  .note{font-size:13px; color:var(--dim); margin-top:12px}
  /* 比 .note 再淡一档：它是「你需要知道的事」，不是「刚发生的事」 */
  .hint{font-size:12.5px; line-height:1.55; color:var(--dim); opacity:.72; margin:12px 0 0}
  .hint b{color:var(--fg); font-weight:600; opacity:.85}
  .steps{
    margin:0 0 22px; padding:14px 16px 14px 34px; border-radius:10px;
    background:var(--monobg); border:1px solid var(--line);
    font-size:14px; line-height:1.7; color:var(--dim);
  }
  .steps b{color:var(--fg); font-weight:600}
  .steps li + li{margin-top:2px}
  /* 加到主屏幕的提示。放在最下面：它是「以后更方便」，不是「现在要做」，
     排在配对步骤前面会抢掉主线 */
  .a2hs{
    margin-top:26px; padding:14px 16px; border-radius:10px;
    background:var(--monobg); border:1px dashed var(--line);
    font-size:13.5px; line-height:1.6; color:var(--dim); text-align:left;
  }
  .a2hs b{color:var(--fg); font-weight:600}
  .a2hs .k{
    display:inline-block; padding:1px 6px; margin:0 1px; border-radius:5px;
    background:var(--card); border:1px solid var(--line); color:var(--fg);
    font-size:12.5px;
  }
  /* 按钮必须独占一行。inline 流下来会被挤在警告文字的末尾，
     看着像句子的一部分而不是一个可点的东西 */
  .a2hs button{
    display:block; width:auto; margin:12px 0 0; padding:9px 16px;
    font-size:14px; border-radius:9px;
  }
  .a2hs .warn{display:block; margin-top:6px; opacity:.8}
</style>
<link rel="manifest" href="/ui/manifest.webmanifest">
<link rel="apple-touch-icon" href="/ui/icons/icon-180.png">
<!-- 加到主屏幕后全屏打开，不显示 Safari 的地址栏——这是「像个 App」和
     「像个网页快捷方式」之间唯一肉眼可见的差别 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clamicro">
</head>
<body>
<h1>需要配对</h1>
<p>这台设备还没有访问口令。三步，都在一分钟内。</p>

<!--
  三步必须**一次说完**。配对现在多了一道 Mac 上的确认框，而扫完码之后手机
  会停在一个空白的加载页上等它——最长 60 秒。不预先说清楚的话，人会以为
  「扫了没反应」，然后返回、重扫，把券一张张烧掉。

  写成有序列表而不是一段话：它是**过程**，人需要知道自己走到哪一步了。
-->
<ol class="steps">
  <li>点下面的按钮，<b>Mac 屏幕上</b>会弹出二维码</li>
  <li>用手机<b>相机 App</b> 对着 Mac 屏幕扫</li>
  <li>回到 Mac，在确认框上点<b>「允许」</b></li>
</ol>

<button id="pair">在 Mac 上显示二维码</button>
<!--
  这行小字代替了「页面内扫码」。做不了：getUserMedia 需要 secure context，
  而服务跑在 http://<局域网IP> 上；退一步说 Safari 也没有 BarcodeDetector，
  解码得自带库，和本项目零依赖的约定冲突。
  而且原生相机本来就是更好的路径——实时取景、自动对焦、扫完直接开 Safari。
  所以要解决的其实不是「没有扫码入口」，是「用户不知道该拿什么扫」。
-->
<!--
  这句解释的是「为什么不能在这个页面里直接扫」。答案不是做不到，是**故意的**：
  这个页面未登录就能打开，所以它一旦能拿到二维码或配对券，那张券就等于公开了。
  凭证只出现在 Mac 屏幕上——你得能看见那块屏，才拿得到。
-->
<p class="hint">二维码<b>不会</b>显示在这个页面上，只出现在 Mac 屏幕上。
这个页面谁都能打开，所以它本身不含任何口令。</p>
<p class="note" id="msg"></p>

<div class="alt">
  <h2>或者在 Mac 终端里执行</h2>
  <pre id="cmd">…</pre>
</div>

<!--
  「加到主屏幕」解决的是**第二次以后**的问题：这个地址带端口，没人记得住，
  而且它不在任何 App 列表里——下次想打开只能翻浏览器历史。加成图标之后
  它就是一个能点的东西。

  默认藏起来，由 JS 决定要不要显示：
    · 已经是独立窗口打开的（standalone）→ 已经装过了，再提示就是噪音
    · Android/Chrome 会给 beforeinstallprompt，可以直接弹系统安装框
    · iOS 没有那个事件，只能给操作说明——但它是这个产品的主力平台
-->
<div class="a2hs" id="a2hs" hidden>
  <b>装到主屏幕，下次一点就开</b><br>
  <span id="a2hsHow"></span>
  <button id="a2hsBtn" hidden>添加到主屏幕</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
fetch('/api/pair/hint').then((r) => r.json()).then((d) => ($('cmd').textContent = d.command));

/**
 * 加到主屏幕。
 *
 * 这个地址带端口（`:8765`），没人记得住，而且它不出现在任何 App 列表里——
 * 下次想打开只能翻浏览器历史。加成图标之后它就是一个能点的东西。
 *
 * 一个真实的坑要说出来：图标记住的是**你当时打开的那个地址**。用 IP 加的话，
 * 路由器重新分配 IP 之后那个图标就打不开了；用 `.local` 主机名加的话，
 * 换 Wi-Fi、换 IP 都还有效。所以提示里明确让人用 .local 那个地址。
 */
(function initA2HS() {
  const box = $('a2hs');
  // 已经是从主屏幕图标打开的 → 装过了，再提示就是噪音
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  if (standalone) return;

  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isLocal = location.hostname.endsWith('.local');
  // 用 IP 加的图标会在路由器重新分配 IP 之后失效，这一句必须说
  const warn = isLocal ? '' :
    '<span class="warn">这个地址是 IP，换网或重启路由器后可能失效；'
    + '用 <b>.local</b> 那个地址添加更稳。</span>';

  box.hidden = false;
  $('a2hsHow').innerHTML = iOS
    ? '在 Safari 里点底部的<span class="k">分享</span>，选<span class="k">添加到主屏幕</span>。' + warn
    : '在浏览器菜单里选<span class="k">添加到主屏幕</span>（或「安装应用」）。' + warn;

  // Android/Chrome 能直接弹系统安装框；iOS 没有这个事件，只能给说明
  let deferred = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    $('a2hsBtn').hidden = false;
  });
  $('a2hsBtn').onclick = async () => {
    if (!deferred) return;
    $('a2hsBtn').hidden = true;
    deferred.prompt();
    await deferred.userChoice;
    deferred = null;
  };
})();

$('pair').onclick = async function () {
  this.disabled = true;
  $('msg').textContent = '正在通知 Mac…';
  try {
    const r = await fetch('/api/pair', { method: 'POST', headers: { 'X-CCM': '1' } }).then((r) => r.json());
    if (r.ok) {
      this.textContent = '✓ 已在 Mac 上显示';
      this.classList.add('done');
      // 扫完之后手机会停在加载页上等 Mac 的确认框，这句先把它说出来
      $('msg').innerHTML = '去看你的 Mac 屏幕，用相机扫那个二维码。<br>'
        + '扫完手机会停一下 —— 那是在等你回 Mac 点「允许」。';
    } else {
      $('msg').textContent = r.error || '失败了，试试下面的命令';
      this.disabled = false;
    }
  } catch {
    $('msg').textContent = '连不上服务，确认它还在运行';
    this.disabled = false;
  }
};
</script>
</body>
</html>
