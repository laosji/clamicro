<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>审批 · Clamicro</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --fg:#12151a; --dim:#6b7280; --line:#e4e7ec;
    --mono:#0f1115; --monobg:#f0f2f5;
    --ok:#0a7d34; --no:#b42318; --warn:#b54708; --warnbg:#fef3e2; --calm:#475467;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d10; --card:#14181d; --fg:#e8eaed; --dim:#8b93a1; --line:#242a32;
      --mono:#d7dbe0; --monobg:#0f1318;
      --ok:#4ade80; --no:#f87171; --warn:#fbbf24; --warnbg:#2a1f0a; --calm:#9aa3b0;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* iOS Safari 从 10 起就忽略 user-scalable=no，双击放大只能靠 touch-action 挡。
     manipulation = 保留滚动和捏合，去掉双击缩放那 300ms 的等待。 */
  html{touch-action:manipulation; -webkit-text-size-adjust:100%}
  /* 卡片飞出时会把布局撑宽，产生横向滚动条；加上 iOS 的橡皮筋回弹，
     整页会跟着晃。只有卡片该动，页面不该动。 */
  html,body{margin:0;height:100%;overflow-x:hidden;overscroll-behavior:none}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  header{padding:12px 18px 10px; border-bottom:1px solid var(--line); flex:0 0 auto}
  .crumb{
    font-size:13px; color:var(--dim); display:flex; gap:8px; align-items:baseline;
    white-space:nowrap; overflow:hidden;
  }
  .crumb b{color:var(--fg); font-weight:600; flex:0 0 auto}
  /* 顶栏的模型图标。审批页是**做决定**的那一屏，「这是谁要跑的」必须在
     第一屏第一行就能认出来——文字标签放在 tag 行里会被 Bash、影响项、
     规则一起淹没（那正是它之前认不出来的原因），图标不会。 */
  .crumb .alogo{flex:0 0 auto; display:inline-flex; align-items:center}
  /* 曾用 direction:rtl 做左截断，副作用是把开头的 "/" 甩到末尾，
     开头的斜杠会跑到末尾。改为在 JS 里取末尾几段。 */
  .crumb span{overflow:hidden; text-overflow:ellipsis; min-width:0}

  /* ── 风险披露 ──
     原来只有高风险时冒一行红字。设计稿要的是**分级可见**：任何风险等级
     都给出等级、强度条和影响项，让「普通」也是一个明确的判断而不是空白。 */
  .rk{margin:14px 0 16px}
  .rk-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
  .rk-label{font:600 10.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.08em;
    color:var(--dim); text-transform:uppercase}
  .rk-val{font:700 11px/1 ui-monospace,Menlo,monospace; padding:4px 9px; border-radius:5px}
  .rk-val.high{color:var(--no); background:color-mix(in srgb,var(--no) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--no) 32%,transparent)}
  .rk-val.medium{color:var(--warn); background:color-mix(in srgb,var(--warn) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
  .rk-val.low{color:var(--dim); background:var(--monobg); border:1px solid var(--line)}
  /* **三格不是五格**：risk.level 只有 high/medium/low 三档，
     画五格等于假装有五档精度，那是在编数据 */
  .rk-meter{display:flex; gap:4px; margin-bottom:12px}
  .rk-meter i{flex:1; height:4px; border-radius:2px; background:var(--monobg)}
  .rk-meter i.on{background:var(--warn)}
  .rk-meter.high i.on{background:var(--no)}
  .rk-why{display:flex; flex-wrap:wrap; gap:7px}
  .rk-why span{font-size:12px; padding:7px 10px; border-radius:8px; line-height:1.35;
    background:color-mix(in srgb,var(--no) 5%,transparent);
    border:1px solid color-mix(in srgb,var(--no) 16%,transparent); color:var(--fg)}
  .rk-why.medium span{background:color-mix(in srgb,var(--warn) 6%,transparent);
    border-color:color-mix(in srgb,var(--warn) 18%,transparent)}
  .rk-why.low span{background:var(--monobg); border-color:var(--line); color:var(--dim)}
  .desc-label{display:block; font:600 10.5px/1 ui-monospace,Menlo,monospace;
    letter-spacing:.1em; color:var(--dim); text-transform:uppercase; margin-bottom:7px}

  /* ── 决策条 ──
     取代整卡片左右滑。整卡滑有两个毛病：起点在哪都行，所以**滚动阅读命令
     原文时容易蹭出一次决策**；行程也没有可见参照物，不知道还差多远。
     中心把手把决策收进一个明确控件：起点固定、行程可见、**阅读区不再是操作区**。 */
  .db{position:relative; height:54px; border-radius:27px; margin:20px 0 8px;
    background:var(--monobg); border:1px solid var(--line); overflow:hidden;
    touch-action:none; --p:0}
  .db .db-side{position:absolute; top:0; bottom:0; display:flex; align-items:center;
    font:700 12.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.04em; pointer-events:none}
  .db .db-deny{left:0; right:50%; justify-content:flex-start; padding-left:18px; color:var(--no)}
  .db .db-allow{right:0; left:50%; justify-content:flex-end; padding-right:18px; color:var(--ok)}
  /* 拖近阈值时那一侧亮起来——行程反馈，不是装饰 */
  .db.to-deny .db-deny{background:linear-gradient(90deg,
    color-mix(in srgb,var(--no) calc(var(--p)*26%),transparent), transparent)}
  .db.to-allow .db-allow{background:linear-gradient(270deg,
    color-mix(in srgb,var(--ok) calc(var(--p)*26%),transparent), transparent)}
  .db-knob{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%; background:var(--card);
    border:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.18);
    display:flex; align-items:center; justify-content:center; cursor:grab;
    touch-action:none; z-index:2}
  .db-knob:active{cursor:grabbing}

  /* 雪佛龙波浪：三个箭头依次亮，指向该滑的方向。
     静止的「‹‹‹」只是排版，会动的才是指示——第一次用的人不必去读那行提示 */
  .db .chev{display:inline-flex; letter-spacing:-1px; opacity:.7}
  .db .chev span{display:inline-block}
  .db-deny .chev span{animation:chev-l 1.4s ease-in-out infinite}
  .db-deny .chev span:nth-child(1){animation-delay:.28s}
  .db-deny .chev span:nth-child(2){animation-delay:.14s}
  .db-allow .chev span{animation:chev-r 1.4s ease-in-out infinite}
  .db-allow .chev span:nth-child(2){animation-delay:.14s}
  .db-allow .chev span:nth-child(3){animation-delay:.28s}
  @keyframes chev-l{0%,100%{opacity:.25; transform:translateX(0)}50%{opacity:1; transform:translateX(-3px)}}
  @keyframes chev-r{0%,100%{opacity:.25; transform:translateX(0)}50%{opacity:1; transform:translateX(3px)}}

  /* 幽灵拖影：从中心同时向两端窜出去，把「可以往两边拖」演一遍。
     碰过控件就停——它是教学不是装饰，学会了还在动就成了干扰 */
  .db .ghost{position:absolute; left:50%; top:50%; width:36px; height:36px;
    margin:-18px 0 0 -18px; border-radius:50%; pointer-events:none; opacity:0; z-index:1}
  .db .g-l{background:radial-gradient(circle, color-mix(in srgb,var(--no) 50%,transparent), transparent 70%);
    animation:ghost-l 3.2s ease-out infinite}
  .db .g-r{background:radial-gradient(circle, color-mix(in srgb,var(--ok) 50%,transparent), transparent 70%);
    animation:ghost-r 3.2s ease-out infinite}
  @keyframes ghost-l{0%{opacity:0; transform:translateX(0)}18%{opacity:.9}
    62%,100%{opacity:0; transform:translateX(-96px)}}
  @keyframes ghost-r{0%{opacity:0; transform:translateX(0)}18%{opacity:.9}
    62%,100%{opacity:0; transform:translateX(96px)}}
  .db.touched .ghost{animation:none; opacity:0}
  .db.touched .chev span{animation:none}

  /* 把手：虚线环（可以抓）+ 倒计时环（还剩多久）+ 锁形（得使点劲）。
     三个意思叠在拇指正下方，不用抬眼去别处找 */
  .db-knob .grip{position:absolute; inset:-7px; border-radius:50%;
    border:1px dashed color-mix(in srgb,var(--warn) 34%,transparent);
    animation:grip-spin 10s linear infinite}
  .db-knob .kr{position:absolute; inset:0; transform:rotate(-90deg)}
  .db-knob .kr-bg{stroke:var(--monobg)}
  .db-knob .kr-fg{stroke:var(--warn); stroke-linecap:round;
    filter:drop-shadow(0 0 4px color-mix(in srgb,var(--warn) 70%,transparent));
    transition:stroke-dashoffset .3s linear}
  .db-knob .kin{position:relative; z-index:1; display:flex; flex-direction:column; align-items:center}
  .db-knob .kic{font-size:10px; margin-top:1px; opacity:.6; line-height:1}
  @keyframes grip-spin{to{transform:rotate(360deg)}}
  .db.committed .grip{animation:none}

  .db-hint .hand{display:inline-block; animation:hand-wag 1.6s ease-in-out infinite}
  @keyframes hand-wag{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}

  @media (prefers-reduced-motion: reduce){
    .db .chev span, .db .ghost, .db-knob .grip, .db-hint .hand{animation:none}
    .db .ghost{opacity:0}
  }
  .db-knob b{font:700 15px/1 ui-monospace,Menlo,monospace; color:var(--warn);
    font-variant-numeric:tabular-nums}
  .db.committed{opacity:.5; pointer-events:none}
  .db-hint{text-align:center; font-size:11.5px; color:var(--dim); margin-bottom:2px}

  main{
    flex:1 1 auto; overflow-y:auto; overflow-x:hidden; padding:14px;
    -webkit-overflow-scrolling:touch;
    /* contain：滚到头时不把回弹传给外层，页面不会整体上下漂 */
    overscroll-behavior:contain;
    display:flex; flex-direction:column;
  }

  /* ── 卡片滑动手势：左滑拒绝，右滑批准 ── */
  .swipe{
    position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:18px; padding:18px; overflow:hidden;
    /* margin:auto 让内容短时垂直居中、内容长时正常从顶部滚动
       （justify-content:center 会在溢出时把顶部裁掉） */
    width:100%; max-width:560px; margin:auto;
    /* pan-y 把纵向滚动交给浏览器，横向留给我们，不用手动 preventDefault */
    touch-action:pan-y; will-change:transform;
  }
  .swipe.armed{cursor:grab}
  .swipehint{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:12px; color:var(--dim); margin-top:14px; opacity:.75;
  }
  .swipehint b{font-weight:500}

  /* ── 底部操作坞 ──
     决策条从卡片里搬出来钉在这儿。命令原文可以很长，而操作只有一个，
     不该跟着内容一起被推下去。半透明磨砂：底下还透得出内容，说明页面
     还能继续滚，不是弹出了一层遮罩。 */
  #dock{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:10px 18px calc(8px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:saturate(1.6) blur(14px);
    -webkit-backdrop-filter:saturate(1.6) blur(14px);
    border-top:1px solid var(--line);
  }
  #dock > *{width:100%; max-width:560px; margin:0 auto}
  #dock .db{margin:14px 0 4px}
  /* 卡片要留出坞的高度，否则最后几行命令永远压在坞底下读不到。
     具体数值由 JS 实测写进 --dock——提示文案换行会改变它，写死迟早对不上 */
  #detail{padding-bottom:calc(var(--dock, 132px) + 14px)}

  /* 「到点会怎样」，不带数字——倒计时只在把手那一处 */
  .deadline{
    display:flex; align-items:center; justify-content:center; margin-top:8px;
    font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim);
  }
  #dlText{flex:0 0 auto; font-variant-numeric:tabular-nums}
  .deadline.urgent{color:var(--no)}
  .deadline.auto{color:var(--ok)}

  /* ── 撤销窗口：手势比按钮更容易误触发，批准给一个反悔窗口。
     沿用结果页的赛博朋克语汇，让「批准中 → 已批准」是一条连续的视觉线。 ── */
  #undo{
    position:fixed; inset:0; z-index:9;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#05060a; color:#e8eaed; overflow:hidden;
    padding:24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    --neon:#39ff14; --neon2:#00f0ff;
  }
  #undo::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.18;
    background:
      linear-gradient(transparent 0 calc(100% - 1px), color-mix(in srgb,var(--neon2) 60%,transparent) 100%) 0 0/100% 34px,
      linear-gradient(90deg, transparent 0 calc(100% - 1px), color-mix(in srgb,var(--neon2) 60%,transparent) 100%) 0 0/34px 100%;
    mask-image:radial-gradient(120% 80% at 50% 45%, #000 20%, transparent 72%);
  }
  #undo::after{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px);
  }
  #undo > *{position:relative; z-index:1}

  /* 倒计时环：把「还剩多久」做成可看得见的进度，而不是一个数字 */
  .ring{
    width:200px; height:200px; border-radius:50%; display:grid; place-items:center;
    background:conic-gradient(var(--neon) var(--p,100%), rgba(255,255,255,.07) 0);
    filter:drop-shadow(0 0 16px color-mix(in srgb,var(--neon) 55%,transparent));
    transition:background .1s linear;
  }
  .ring > div{
    width:188px; height:188px; border-radius:50%; background:#05060a;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  }
  .ring b{
    font:700 56px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--neon);
    text-shadow:0 0 20px var(--neon); font-variant-numeric:tabular-nums;
  }
  .ring i{font:500 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.22em; color:#6b7280; font-style:normal}

  #undoText{
    margin-top:26px; font:700 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.32em; text-transform:uppercase; color:var(--neon);
    text-shadow:0 0 10px color-mix(in srgb,var(--neon) 70%,transparent);
  }
  #undoSub{margin:10px 0 0; font-size:13.5px; color:#8b93a1; text-align:center; max-width:280px}
  #undoBtn{
    margin-top:32px; padding:15px 40px; border-radius:4px; cursor:pointer;
    background:transparent; border:1px solid color-mix(in srgb,var(--neon2) 55%,transparent);
    color:var(--neon2);
    font:600 13px/1 ui-monospace,Menlo,monospace; letter-spacing:.2em; text-transform:uppercase;
    text-shadow:0 0 10px color-mix(in srgb,var(--neon2) 70%,transparent);
  }
  #undoBtn:active{background:color-mix(in srgb,var(--neon2) 14%,transparent)}
  @media (prefers-reduced-motion:reduce){
    .swipe{transition:opacity .2s !important}
  }

  .tags{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:12px}
  /* ── 选择题 ──
     AskUserQuestion 不是一次「操作」，是一道问给人的选择题。用允许/拒绝那套
     手势去表达「选哪一项」是表达不了的，所以它有自己的一套控件：
     题干 + 可点的选项 + 一个提交按钮。 */
  .qs{margin-top:14px}
  .q{margin-bottom:20px}
  .q:last-child{margin-bottom:0}
  .q-head{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--dim); font-weight:700; margin-bottom:6px;
  }
  .q-text{font-size:15.5px; line-height:1.5; font-weight:600; margin:0 0 12px}
  .opt{
    display:block; width:100%; text-align:left; cursor:pointer;
    border:1.5px solid var(--line); background:var(--card); color:var(--fg);
    border-radius:13px; padding:13px 14px; margin-bottom:9px;
    font:inherit; transition:border-color .15s, background .15s;
  }
  .opt:last-child{margin-bottom:0}
  .opt .lb{font-size:14.5px; font-weight:600; display:flex; align-items:center; gap:9px}
  /* 选中标记用一个占位的圆圈，不是选中才出现的对勾——否则每次选择
     文字都会横向跳一下 */
  .opt .mk{
    width:18px; height:18px; border-radius:50%; flex:0 0 auto;
    border:1.5px solid var(--line); display:flex; align-items:center;
    justify-content:center; font-size:11px; color:transparent;
  }
  .opt .ds{font-size:12.5px; color:var(--dim); line-height:1.5; margin-top:5px; padding-left:27px}
  .opt.on{border-color:var(--ok); background:color-mix(in srgb, var(--ok) 8%, var(--card))}
  .opt.on .mk{border-color:var(--ok); background:var(--ok); color:var(--card)}
  @media (prefers-reduced-motion: reduce){ .opt{transition:none} }

  #answerBtn{
    width:100%; padding:16px; border-radius:14px; border:none; cursor:pointer;
    font:600 16px -apple-system,"PingFang SC",sans-serif;
    background:var(--ok); color:var(--card);
  }
  #answerBtn:disabled{opacity:.4; cursor:default}
  #answerBtn:active:not(:disabled){opacity:.85}

  .tag{font-size:12px; padding:4px 9px; border-radius:20px; background:var(--monobg); color:var(--dim)}
  .tag.tool{font-family:ui-monospace,Menlo,monospace; color:var(--fg); font-weight:600}
  /* 模型 chip 带 logo，描边用品牌色。
     原来是 transparent + var(--line)：整行里最淡的一个，紧挨着加粗的
     工具名，读起来像又一个普通标签，扫一眼根本注意不到是「哪个模型」。 */
  .tag.agent{
    background:transparent; box-shadow:inset 0 0 0 1px var(--line); color:var(--fg);
    display:inline-flex; align-items:center;
  }
  .tag.agent[data-agent="claude-code"]{box-shadow:inset 0 0 0 1px rgba(217,119,87,.55)}
  .tag.agent[data-agent="dsh"]{box-shadow:inset 0 0 0 1px rgba(77,107,254,.55)}
  .tag.warn{background:var(--warnbg); color:var(--warn)}
  .tag.danger{background:var(--warnbg); color:var(--no); font-weight:600}
  .tag.calm{color:var(--calm)}

  /* 模型写的那句话。它在命令**下面**且明显更轻——
     description 由被审查方生成，不该占据主视觉。 */
  .says{
    margin:12px 0 4px; font-size:14px; line-height:1.5; color:var(--dim);
    overflow-wrap:anywhere;
  }


  /* 容器的颜色必须跟着等级走。写死成警告色的话，「没有命中任何风险规则」
     会被装进一个琥珀色警告框里——框在喊危险，字在说没事，人只会信框。
     这跟之前修过的「影响面标签说反话」是同一类错误。 */
  .risk{
    background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:11px 13px; margin-bottom:14px; font-size:14px;
  }
  .risk.lv-medium{
    background:var(--warnbg); border-color:color-mix(in srgb,var(--warn) 35%,transparent);
  }
  .risk.lv-high{
    background:color-mix(in srgb,var(--no) 6%,transparent);
    border-color:color-mix(in srgb,var(--no) 32%,transparent);
  }
  .risk b{display:block; margin-bottom:3px}

  /* 描述与命令不符——比高风险更值得警惕，因为它意味着那句人话在骗你 */
  .mismatch{
    background:color-mix(in srgb,var(--no) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--no) 45%,transparent);
    color:var(--no); border-radius:10px; padding:11px 13px; margin-bottom:14px;
    font-size:14px; line-height:1.5;
  }
  .mismatch b{display:block; margin-bottom:3px}

  /* 命令里命中风险规则的片段 */
  mark{
    background:color-mix(in srgb,var(--no) 26%,transparent);
    color:inherit; border-radius:3px; padding:1px 2px;
    box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--no) 60%,transparent);
  }

  details{margin-bottom:8px}
  summary{
    font-size:14px; color:var(--dim); cursor:pointer; padding:9px 0;
    list-style:none; display:flex; align-items:center; gap:6px;
  }
  summary::-webkit-details-marker{display:none}
  summary::before{content:'▸'; transition:transform .15s}
  details[open] summary::before{transform:rotate(90deg)}
  /* 改动预览。+ 绿 − 红是所有 diff 工具的共识，别自创一套 */
  .diff{
    margin:0; border-radius:10px; overflow:auto; max-height:46vh;
    background:var(--monobg); border:1px solid var(--line);
    font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .diff .dl{display:flex; gap:8px; padding:1px 12px; white-space:pre-wrap; overflow-wrap:anywhere}
  .diff .dm{flex:0 0 auto; opacity:.7; user-select:none}
  /* 用主题变量而不是写死的绿/红：这一页有浅色和深色两套，GitHub 那套
     深色 diff 配色放到浅色背景上基本读不出来 */
  .diff .add{background:color-mix(in srgb,var(--ok) 12%,transparent); color:var(--ok)}
  .diff .del{background:color-mix(in srgb,var(--no) 12%,transparent); color:var(--no)}
  .diff .cut{padding:6px 12px; color:var(--dim); font-style:italic}
  .chgnote{margin:6px 2px 0; font-size:12px; color:var(--dim)}

  .codewrap{position:relative}
  .codewrap::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:34px; pointer-events:none;
    background:linear-gradient(transparent,var(--monobg)); border-radius:0 0 10px 10px;
  }
  .codewrap.short::after{display:none}
  pre{
    margin:0; padding:14px; border-radius:10px;
    background:var(--monobg); color:var(--mono); border:1px solid var(--line);
    font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    /* break-all 会把 clamicro 从中间劈开；anywhere 优先在分隔符处断 */
    white-space:pre-wrap; word-break:normal; overflow-wrap:anywhere;
    max-height:46vh; overflow:auto;
  }

  /* ── 结果态：赛博朋克。这是一个「时刻」而不是一个界面，
     所以不跟随系统深浅色，固定深色 + 霓虹。 ── */
  #result{
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); text-align:center; overflow:hidden;
    padding:24px calc(24px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom));
    /* 单一色相跟着状态走，用主题变量而不是写死的霓虹色——原来这一屏在
       浅色模式下也是一整块 #05060a 的黑，跟前后两屏对不上 */
    --neon:var(--ok);
  }
  #result[data-s="auto_allowed"]{ --neon:var(--ok) }
  #result[data-s="answered"]{ --neon:var(--ok) }
  #result[data-s="denied"]   { --neon:var(--no) }
  #result[data-s="expired"]  { --neon:var(--warn) }
  #result[data-s="abandoned"]{ --neon:var(--calm) }
  #result[data-s="superseded"]{ --neon:var(--calm) }

  /* 网格地平线和扫描线删掉了。这一屏确实是整个流程唯一的仪式感时刻，但
     仪式感来自**留白和一个干净的图形**，不是往背景里堆特效。其余各屏都是
     克制的终端语气，这里独自喧哗会像换了个应用。 */
  #result > *{position:relative; z-index:1}
  #result .txt{display:flex; flex-direction:column; align-items:center}

  /* 设计稿 .done-inline 的对勾圈放大成主视觉：淡底 + 一圈描边 + 居中符号。
     外发光只留很轻的一层，够把视线钉住就行 */
  .glyph{
    width:82px; height:82px; border-radius:50%; margin-bottom:20px;
    display:flex; align-items:center; justify-content:center;
    font-size:34px; line-height:1; color:var(--neon);
    background:color-mix(in srgb,var(--neon) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--neon) 40%,transparent);
    box-shadow:0 0 34px -12px color-mix(in srgb,var(--neon) 70%,transparent);
    animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

  /* 状态码回到「小标签」的量级。原来它是个会抖的霓虹灯箱，抢在标题前面
     喊了一句英文——而真正要读的是下面那句中文 */
  .code{
    font:600 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.18em; text-transform:uppercase; color:var(--neon); opacity:.85;
  }
  @keyframes flicker{
    0%,94%,100%{opacity:1} 95%{opacity:.55} 96%{opacity:1} 97%{opacity:.7} 98%{opacity:1}
  }

  #rtitle{margin:12px 0 6px; font-size:22px; font-weight:600; letter-spacing:.02em}
  #rdesc{margin:0; color:var(--dim); font-size:13.5px; line-height:1.55; max-width:300px}

  /* 扫过一道光 */
  .sweep{display:none}
  @keyframes sweep{from{top:0;opacity:0}20%{opacity:1}to{top:100%;opacity:0}}

  #back{
    display:inline-block; margin-top:28px; padding:12px 26px; border-radius:8px;
    background:var(--monobg); border:1px solid var(--line); color:var(--dim);
    text-decoration:none; font:600 12.5px/1 ui-monospace,Menlo,monospace; letter-spacing:.1em;
  }
  @media (prefers-reduced-motion:reduce){
    .glyph,.code,.sweep{animation:none}
    .sweep{display:none}
  }

  /* ── 横屏：高度骤减，垂直方向的一切都要压缩 ── */
  @media (orientation:landscape) and (max-height:520px){
    main{padding:10px 12px}
    .swipe{padding:14px; border-radius:14px}
    h1{font-size:18px; margin-bottom:10px}
    .tags{margin-bottom:8px}
    /* 46vh 在横屏只剩 ~150px，改用固定值 */
    pre{max-height:min(40vh, 180px); font-size:12.5px}
    .risk{padding:9px 11px; margin-bottom:10px; font-size:13px}
    .swipehint{margin-top:10px}
    .stamp{font-size:22px; top:14px; padding:6px 11px; border-width:2px}
    header{padding:8px 18px 7px}

    /* 结果页竖向空间不够，改横向布局 */
    #result{flex-direction:row; flex-wrap:wrap; gap:0 26px; align-content:center; padding:16px 24px}
    #result .glyph{font-size:46px; margin:0}
    #result .code{font-size:11px; letter-spacing:.26em}
    #rtitle{font-size:19px; margin:8px 0 4px}
    #rdesc{font-size:12.5px}
    #result .txt{align-items:flex-start; text-align:left}
    #back{margin-top:14px}
    #undo{bottom:calc(16px + env(safe-area-inset-bottom))}
  }
  .hidden{display:none !important}

<script>
const BOOT = __BOOTSTRAP__;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ticker = null;

function show(view) {
  $('detail').classList.toggle('hidden', view !== 'detail');
  $('result').classList.toggle('hidden', view !== 'result');
  $('dock').classList.toggle('hidden', view !== 'detail');
}

// 只留末尾两段：完整路径在手机上放不下，而项目名已经单独显示了
function shortPath(p) {
  const parts = (p || '').split('/').filter(Boolean);
  return parts.length <= 2 ? '/' + parts.join('/') : '…/' + parts.slice(-2).join('/');
}

function render(a) {
  const dir = (a.cwd || '').split('/').filter(Boolean).pop() || a.session_id.slice(0, 8);
  $('proj').textContent = a.session_name || dir;
  $('path').textContent = shortPath(a.cwd);

  if (a.status !== 'pending') return renderResult(a);

  /**
   * 选择题是另一种页面，不是「多了个控件的审批页」。
   *
   * 第一版只是在原页面底下挂了选项，渲染出来才发现题干出现了**三遍**：
   * #cmdbox 一遍（detail 就是题干）、「模型的描述」一遍（headline 是 header）、
   * 选项区的 header + question 又一遍。加上一个「风险等级 普通 / 没有命中
   * 任何风险规则」的模块——对一道选择题，那整块都是噪音。
   *
   * 光看代码看不出来，跑起来截一张图就一目了然。
   */
  /* 和 home.html 是同一份 SVG——改一处要同步另一处。 */
  const AGENT_LOGOS = {
    'claude-code': '<svg viewBox="0 0 100 100" width="15" height="15" aria-hidden="true" style="vertical-align:-2px;margin-right:5px"><path fill="#D97757" d="m19.6 66.5 19.7-11 .3-1-.3-.5h-1l-3.3-.2-11.2-.3L14 53l-9.5-.5-2.4-.5L0 49l.2-1.5 2-1.3 2.9.2 6.3.5 9.5.6 6.9.4L38 49.1h1.6l.2-.7-.5-.4-.4-.4L29 41l-10.6-7-5.6-4.1-3-2-1.5-2-.6-4.2 2.7-3 3.7.3.9.2 3.7 2.9 8 6.1L37 36l1.5 1.2.6-.4.1-.3-.7-1.1L33 25l-6-10.4-2.7-4.3-.7-2.6c-.3-1-.4-2-.4-3l3-4.2L28 0l4.2.6L33.8 2l2.6 6 4.1 9.3L47 29.9l2 3.8 1 3.4.3 1h.7v-.5l.5-7.2 1-8.7 1-11.2.3-3.2 1.6-3.8 3-2L61 2.6l2 2.9-.3 1.8-1.1 7.7L59 27.1l-1.5 8.2h.9l1-1.1 4.1-5.4 6.9-8.6 3-3.5L77 13l2.3-1.8h4.3l3.1 4.7-1.4 4.9-4.4 5.6-3.7 4.7-5.3 7.1-3.2 5.7.3.4h.7l12-2.6 6.4-1.1 7.6-1.3 3.5 1.6.4 1.6-1.4 3.4-8.2 2-9.6 2-14.3 3.3-.2.1.2.3 6.4.6 2.8.2h6.8l12.6 1 3.3 2 1.9 2.7-.3 2-5.1 2.6-6.8-1.6-16-3.8-5.4-1.3h-.8v.4l4.6 4.5 8.3 7.5L89 80.1l.5 2.4-1.3 2-1.4-.2-9.2-7-3.6-3-8-6.8h-.5v.7l1.8 2.7 9.8 14.7.5 4.5-.7 1.4-2.6 1-2.7-.6-5.8-8-6-9-4.7-8.2-.5.4-2.9 30.2-1.3 1.5-3 1.2-2.5-2-1.4-3 1.4-6.2 1.6-8 1.3-6.4 1.2-7.9.7-2.6v-.2H49L43 72l-9 12.3-7.2 7.6-1.7.7-3-1.5.3-2.8L24 86l10-12.8 6-7.9 4-4.6-.1-.5h-.3L17.2 77.4l-4.7.6-2-2 .2-3 1-1 8-5.5Z"/></svg>',
    'dsh': '<svg viewBox="0 0 50 50" width="16" height="16" aria-hidden="true" style="vertical-align:-3px;margin-right:5px"><path fill="#4D6BFE" d="M48.8354 10.0479C48.3232 9.79199 48.1025 10.2798 47.8032 10.5278C47.7007 10.6079 47.6143 10.7119 47.5273 10.8076C46.7793 11.624 45.9048 12.1597 44.7622 12.0957C43.0923 12 41.666 12.5356 40.4058 13.8398C40.1377 12.2319 39.2476 11.272 37.8926 10.6558C37.1836 10.3359 36.4668 10.0156 35.9702 9.31982C35.6235 8.82373 35.5293 8.27197 35.356 7.72754C35.2456 7.3999 35.1353 7.06396 34.7651 7.00781C34.3633 6.94385 34.2056 7.2876 34.0479 7.57568C33.418 8.75195 33.1733 10.0479 33.1973 11.3599C33.2524 14.312 34.4736 16.6641 36.8999 18.3359C37.1758 18.5278 37.2466 18.7197 37.1597 19C36.9946 19.5757 36.7974 20.1357 36.624 20.7119C36.5137 21.0801 36.3486 21.1597 35.9624 21C34.6309 20.4321 33.481 19.5918 32.4644 18.5757C30.7393 16.8721 29.1792 14.9917 27.2334 13.52C26.7764 13.1758 26.3193 12.856 25.8467 12.5518C23.8618 10.584 26.1069 8.96777 26.627 8.77588C27.1704 8.57568 26.8159 7.8877 25.0591 7.896C23.3022 7.90381 21.6953 8.50391 19.647 9.30371C19.3477 9.42383 19.0322 9.51172 18.7095 9.58398C16.8501 9.22363 14.9199 9.14355 12.9033 9.37598C9.10596 9.80762 6.07275 11.6396 3.84326 14.7681C1.16455 18.5278 0.53418 22.7998 1.30664 27.2559C2.11768 31.9521 4.46582 35.8398 8.07373 38.8799C11.8159 42.0322 16.1255 43.5762 21.041 43.2803C24.0269 43.104 27.3516 42.6963 31.1016 39.4561C32.0469 39.936 33.0396 40.1279 34.686 40.272C35.9546 40.3921 37.1758 40.208 38.1211 40.0078C39.6021 39.688 39.4995 38.2881 38.9639 38.0322C34.623 35.9678 35.5762 36.8081 34.71 36.1279C36.9155 33.4639 40.2402 30.6958 41.54 21.728C41.6426 21.0161 41.5557 20.5679 41.54 19.9917C41.5322 19.6396 41.6108 19.5039 42.0049 19.4639C43.0923 19.3359 44.1479 19.0317 45.1167 18.4878C47.9292 16.9199 49.064 14.3438 49.3315 11.2559C49.3711 10.7837 49.3237 10.2959 48.8354 10.0479Z"/></svg>',
  };
  const agentLogo = (agent) => AGENT_LOGOS[agent] || '';

  // 顶栏：模型图标排在会话名之前，第一眼就答「这是谁要跑的」
  $('alogo').innerHTML = agentLogo(a.agent);
  if (a.agent_label) $('alogo').setAttribute('aria-label', a.agent_label);

  const isAsk = !!(a.choices && a.choices.length);

  $('tags').innerHTML =
    // 后端出身放在最前：一眼看出「这条是哪个 harness 问的」，再读工具和影响
    (a.agent_label ? `<span class="tag agent" data-agent="${esc(a.agent || '')}">${agentLogo(a.agent)}${esc(a.agent_label)}</span>` : '') +
    // 工具名对人零信息量，选择题连这个标签都不必要——影响项那个「等你回答」
    // 已经把它是什么说清楚了
    (isAsk ? '' : `<span class="tag tool">${esc(a.tool_name)}</span>`) +
    (a.impact || []).map((i) => `<span class="tag ${esc(i.tone)}">${esc(i.label)}</span>`).join('') +
    (a.rule ? `<span class="tag">规则 ${esc(a.rule)}</span>` : '');

  // 明说这句是「模型写的」——它是链路里唯一由被审查方生成的文本，
  // 不该看起来像系统的判断。选择题不显示：它的 headline 就是题目的 header，
  // 而 header 和题干都会在选项区完整出现
  if (isAsk) $('headline').classList.add('hidden');
  else $('headline').innerHTML = `<span class="desc-label">模型的描述</span>${esc(a.headline || a.summary)}`;

  // 限制只加在「批准」上，不加在「拒绝」上：
  // 拒绝永远是左滑这个轻动作，批准的重量随风险升级。
  // 选择题不评风险：它不执行任何东西，「风险等级 普通」只是一行占地方的废话
  if (isAsk) renderChoices(a);
  else { renderRisk(a); armSwipe(a.risk.level === 'high' ? 'high' : 'normal'); }

  // 描述声称无害而命令并非如此。这条比「高风险」更需要显眼——
  // 高风险只是说这事危险，不符是说那句人话在骗你。
  if (a.mismatch) {
    $('mismatch').innerHTML = `<b>⚠️ 描述与命令不符</b>${esc(a.mismatch)}<br><small>以下面的命令原文为准。</small>`;
    $('mismatch').classList.remove('hidden');
    armSwipe('high'); // 不符一律按高风险的手势重量处理
  }

  // 选择题的 detail 就是题干本身，而题干已经在选项区完整显示过了。
  // 再画一遍 #cmdbox 等于同一句话连着出现两次
  if (!isAsk) { renderCommand(a); renderChange(a); }
  tick();
  ticker = setInterval(tick, 1000);
  syncTimer = setInterval(sync, 3000);
  // 切回前台立刻对一次状态，别等下一个轮询周期
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { tick(); sync(); }
  });
  show('detail');
}

/**
 * 按 detail_spans 给命令里命中风险规则的片段套 <mark>。
 *
 * 服务端给的是**下标区间**而不是要高亮的字符串。必须如此：先转义再按字符串
 * 替换的话，`>` 已经变成 `&gt;`，下标和内容都对不上；先替换再转义则会把
 * 自己插入的标签一起转义掉。按区间切片、逐段转义、再拼装，是唯一不会
 * 把用户数据当标记解释的顺序。
 */
function highlight(text, spans) {
  if (!spans || !spans.length) return esc(text);
  let out = '';
  let at = 0;
  for (const { start, end, why } of spans) {
    if (start < at || start > text.length) continue; // 越界或重叠的区间直接跳过
    out += esc(text.slice(at, start));
    out += `<mark title="${esc(why || '')}">${esc(text.slice(start, Math.min(end, text.length)))}</mark>`;
    at = Math.min(end, text.length);
  }
  return out + esc(text.slice(at));
}

/**
 * 命令是主视觉，默认摊开。
 *
 * 以前长命令是折叠的（<details>），配合「description 当标题」，等于让人
 * 对着模型自己写的一句话做决定，而真正要批的东西藏在一次点击之后。
 * 现在只有超长脚本才折叠，且折叠标题会写明命中了什么风险。
 */
/**
 * 风险披露。
 *
 * 原来只在高风险时冒一行红字，其余等级一片空白——而「没有警告」和
 * 「判过了，是普通风险」在用户眼里长得一模一样。**沉默不是信息。**
 * 现在任何等级都给出：等级、强度条、以及**为什么**。
 *
 * 强度条是**三格**不是设计稿的五格：risk.level 只有 high/medium/low 三档，
 * 画五格等于假装有五档精度。设计稿里的「12 个文件 · 45.2 MB」同理——
 * impact 只有标签没有数量，编一个数字出来是这个工具最不能犯的错。
 */
function renderRisk(a) {
  const lv = a.risk?.level || 'low';
  const on = lv === 'high' ? 3 : lv === 'medium' ? 2 : 1;
  const name = lv === 'high' ? '高风险' : lv === 'medium' ? '中等风险' : '普通';
  const why = (a.risk?.reasons || []);

  $('risk').innerHTML = `<div class="rk">
    <div class="rk-row"><span class="rk-label">风险等级</span><span class="rk-val ${lv}">${name}</span></div>
    <div class="rk-meter ${lv}">${[0,1,2].map((i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</div>
    ${why.length
      ? `<div class="rk-why ${lv}">${why.map((r) => `<span>${esc(r)}</span>`).join('')}</div>`
      : `<div class="rk-why low"><span>没有命中任何风险规则</span></div>`}
  </div>`;
  // className 整体重写：同一个元素会被反复渲染（sync 轮询），只 add 不 remove
  // 的话上一条的等级色会留在下一条上
  $('risk').className = `risk lv-${lv}`;
}

function renderCommand(a) {
  const d = a.detail || '';
  if (!d) return;
  const lines = a.detail_lines || 1;
  const body = highlight(d, a.detail_spans);
  const veryLong = lines > 24;
  const code = `<div class="codewrap${veryLong ? '' : ' short'}"><pre>${body}</pre></div>`;
  if (!veryLong) { $('cmdbox').innerHTML = code; return; }
  const flagged = (a.detail_spans || []).length;
  const note = flagged ? `，其中 ${flagged} 处命中风险规则` : '';
  $('cmdbox').innerHTML =
    `<details open><summary>完整命令（${lines} 行${note}）</summary>${code}</details>`;
}

/**
 * 画「要写进去的内容」。
 *
 * 在这之前，写文件类操作在这一页上只有一个文件路径——你被要求批准一件
 * 看不见的事，唯一的依据是模型自己写的那句话，而这一页别处到处都在提醒
 * 那句话不可信。
 *
 * 服务端给的是逐行的 {t,s}，前端只按 t 上色、对 s 做转义，不解析内容。
 * 跟 detail_spans 是同一个理由：结构由服务端定，前端只做「切片 + 转义」
 * 这一件不会把用户数据当标记解释的事。
 */
function renderChange(a) {
  const c = a.change;
  if (!c || !c.lines || !c.lines.length) return;

  const rows = c.lines.map((l) => {
    const cls = l.t === '+' ? 'add' : 'del';
    return `<div class="dl ${cls}"><span class="dm">${l.t === '+' ? '+' : '−'}</span><span>${esc(l.s)}</span></div>`;
  }).join('');

  // 掐掉的是两侧逐字相同的行，没有内容因此被藏起来 —— 但掐了多少必须说，
  // 否则用户没法判断自己看到的是不是全部
  const cut = c.trimmed
    ? `<div class="cut">上下各 ${c.trimmed} 行前后一致，未显示</div>`
    : '';

  const notes = [];
  if (c.truncated?.lines) notes.push(`还有 ${c.truncated.lines} 行未显示`);
  if (c.truncated?.chars) notes.push(`另有 ${c.truncated.chars} 个字符被截断`);
  const note = notes.length ? `<p class="chgnote">${esc(notes.join('，'))}</p>` : '';

  const tally = [c.added ? `+${c.added}` : '', c.removed ? `−${c.removed}` : ''].filter(Boolean).join(' ');
  const head = c.kind === 'write' ? '将写入的内容' : c.kind === 'notebook' ? '将改动的单元格' : '将做的改动';
  const body = `<div class="diff">${cut}${rows}</div>${note}`;

  // 短的直接摊开；长的折起来但**默认展开** —— 跟命令原文一个规矩：
  // 要看的人不用多点一下，不想看的人滑过去就是了
  $('changebox').innerHTML = c.lines.length > 24
    ? `<details open><summary>${head}（${esc(tally)}）</summary>${body}</details>`
    : body;
}

function tick() {
  const total = BOOT.expires_at - BOOT.created_at;
  /**
   * **剩余时间要钳在 [0, total] 里。**
   *
   * `expires_at` 是 **Mac 的**时钟，`Date.now()` 是**手机的**。两台设备的
   * 时钟差哪怕几毫秒，left 就会超过整个时限，然后被两层向上取整放大成
   * 一整分钟：
   *
   *   left = 180000ms → ceil(180/60) = 3m   ← 对
   *   left = 180001ms → ceil(181/60) = 4m   ← 一个 3 分钟的窗口显示成 4 分钟
   *
   * 实际表现就是「刚打开显示 4m，过一秒变 3m」——用户报的正是这个。
   * 环也一样：`1 - left/total` 会算出负数，描边跑过头。
   *
   * 钳住是对的，因为它陈述的是一个事实：**剩下的时间不可能比总时长还长。**
   * 在这里修，比在每个读数上各自防一次更靠得住。
   */
  const left = Math.max(0, Math.min(total, BOOT.expires_at - Date.now()));
  const s = Math.ceil(left / 1000);
  const urgent = left <= 60_000;

  // 倒计时**只有一处**：把手上那圈。原来还有顶部细线、页眉时钟、卡片底部
  // 进度条，四个地方说同一件事——每多一处就多一个要对照的读数，而它们
  // 只会一起变，谁都没多说什么。留在拇指正下方的那个。
  const autoAllow = BOOT.auto_decision === 'allow';
  // 这一行说的不是「还剩多久」而是「到点会怎样」，是另一件事，所以留着，
  // 但不带数字——数字归环。
  //
  // 选择题必须单独说：它的 auto_decision 确实是 allow，但「通过」在这里
  // 不是好事——放行 AskUserQuestion 等于把这道题弹回 Mac 终端，手机白等一场。
  // 照搬「将自动通过」会让人以为不管也没关系，而且那行还是绿的
  $('dlText').textContent = (BOOT.choices && BOOT.choices.length)
    ? '超时未回答将退回 Mac 终端'
    : autoAllow ? '无人处理将自动通过' : '无人处理将自动拒绝';
  // 把剩余秒数放进把手里：你的手指正按在那儿，倒计时该长在你看的地方。
  // 分秒都显示放不下，超过一分钟只给分钟数
  // 注意用 s 不是 left —— left 是**毫秒**，直接拿来判断会一直走「分钟」分支，
  // 把手里显示成 173420。差一点就这么发出去了
  const dn = $('dbNum');
  if (dn) dn.textContent = s >= 60 ? `${Math.ceil(s / 60)}m` : String(s);
  // 环走的是整段时限的剩余比例，跟数字同源；数字过一分钟就退化成「3m」，
  // 那之后环是唯一还在连续变化的量
  const dr = $('dbRing');
  if (dr) dr.setAttribute('stroke-dashoffset', String(150.8 * (1 - left / total)));
  // 到点是「放行」时不该显示成红色警告 —— 语义不同，颜色也要跟着变
  $('deadline').classList.toggle('auto', autoAllow);
  $('deadline').classList.toggle('urgent', !autoAllow && urgent);

  // 本地计时到点不自己下结论——以服务端为准，避免时钟漂移造成状态不一致
  if (left <= 0) { clearInterval(ticker); sync(true); }
}

/* 审批页原本没有任何实时同步：终端那边批了、或服务端 570s 超时了，
   手机页面完全不知道。这里做轮询（?k= 只授权单条审批，用不了全局 SSE）。 */
let syncTimer = null;
async function sync(force = false) {
  try {
    const r = await fetch(`/api/approvals/${BOOT.id}?k=${encodeURIComponent(BOOT.key)}`);
    if (!r.ok) return;
    const { approval } = await r.json();
    if (approval.status !== 'pending') {
      clearInterval(syncTimer);
      renderResult(approval);
    } else if (force) {
      // 服务端还没判超时，稍后再确认一次
      setTimeout(() => sync(true), 1500);
    }
  } catch {
    /* 断网时保持现状，下次轮询再说 */
  }
}

/**
 * 图形要能一眼读出「成了 / 没成」，不需要先解码。
 * 原来清一色是几何菱形（◈ ◇ ◐），四个状态长得几乎一样，全靠颜色区分——
 * 而颜色恰恰是色觉差异下最先丢的那一维。
 */
const RESULTS = {
  allowed:      ['✓', 'access granted', '已批准', '操作正在执行'],
  auto_allowed: ['✓', 'auto-approved', '已自动通过', '无人操作，按预授权规则放行'],
  answered:  ['✓', 'answer sent',    '已回答', '你的选择已经送回 Claude'],
  denied:    ['✕', 'access denied',  '已拒绝', 'Claude Code 已收到拒绝'],
  expired:   ['◷', 'session expired', '已超时', '超时未决策，已自动拒绝'],
  abandoned:  ['↗', 'handled elsewhere', '已在别处处理', '这条请求已由终端处理或会话已结束'],
  superseded: ['↗', 'already granted', '已在别处放行', '这个操作已经由终端或权限规则批准并执行了'],
};

function renderResult(a) {
  clearInterval(ticker);
  clearInterval(syncTimer);
  let [icon, code, title, desc] = RESULTS[a.status] || ['◌', 'unknown', '状态未知', ''];
  // 回显选了什么。只说「已回答」的话，人过一会儿回来看根本想不起来自己选了哪项，
  // 而这条记录会一直留在历史里
  if (a.status === 'answered' && a.answer?.length) {
    desc = `你的选择：${a.answer.map((x) => `「${x}」`).join('、')}`;
  }
  // 服务重启导致的中断，说清楚是重启而不是「别处处理了」
  if (a.status === 'abandoned' && a.decided_by === 'restart') {
    code = 'interrupted'; title = '服务重启时中断';
    desc = 'Clamicro 重启了，这条请求已随之失效。Claude Code 那边已按超时处理。';
  }
  /**
   * 决定没能送到执行点。
   *
   * 这一条比 status 本身更要紧：status 说的是「人怎么决定的」，而用户真正
   * 关心的是「那个决定生效了吗」。连接在答复之前就断了的话（对面被 Ctrl-C、
   * 终端关掉），记录写着「已拒绝」，而拒绝这件事哪儿也没到达。
   * 不说出来，这一页就在替一个从没生效的决定作证。
   */
  if (a.delivered === false) {
    code = 'undelivered';
    title = '这个决定没能送达';
    desc = `你选了「${a.status === 'denied' ? '拒绝' : '批准'}」，但请求方在收到之前就断开了`
      + `（多半是那边被 Ctrl-C 或终端被关掉）。那次操作按它自己的规则走了，不受这个决定影响。`;
  }
  $('result').dataset.s = a.status;
  $('ricon').textContent = icon;
  $('rcode').textContent = code;
  $('rtitle').textContent = title;
  $('rdesc').textContent = desc;
  show('result');

  if (!BOOT.hasSession) return;
  $('back').classList.remove('hidden');
  let n = 2;
  const label = () => ($('back').textContent = `← return  ${n}`);
  label();
  const t = setInterval(() => {
    if (--n <= 0) { clearInterval(t); location.href = '/ui'; } else label();
  }, 1000);
  $('back').addEventListener('click', () => clearInterval(t), { once: true });
}

let submitting = false;
async function decide(decision) {
  if (submitting) return;
  submitting = true;
  try {
    const res = await fetch(`/api/approvals/${BOOT.id}/decide?k=${encodeURIComponent(BOOT.key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision }),
    });
    const data = await res.json();
    renderResult(data.approval || { status: decision === 'allow' ? 'allowed' : 'denied' });
  } catch {
    submitting = false;
    swipeHandle?.restore();
    // 报错写进提示行，**不能覆盖 #swipehint 的 innerHTML**——决策条就在
    // 那个容器里。原来这一句会把整条控件从 DOM 里抹掉，然后显示「请重试」，
    // 而人已经没有任何东西可以重试了
    $('dbHint').innerHTML = '<b style="color:var(--no)">网络错误，请重新拖动</b>';
    $('swipehint').classList.remove('hidden');
  }
}

/**
 * 选择题：题干 + 可点的选项 + 一次显式提交。
 *
 * ## 为什么不复用滑动条
 *
 * 「允许 / 拒绝」这套手势表达不了「选第 2 项」。在这之前 AskUserQuestion 走的
 * 就是通用分支：屏幕上一坨十几行的原始 JSON，底下两个毫无意义的按钮——
 * 允许只是把问题弹回 Mac 终端，手机白看一场。
 *
 * ## 为什么要一次显式提交，不是点中即发
 *
 * 误触发出去的是一个**错误的答案**，它会直接进模型的上下文并被照着执行。
 * 比起多按一下，那个代价高得多。多选和多题也需要一个「都选完了」的时刻。
 */
const picked = new Map(); // 题号 -> Set(选项文本)

function renderChoices(a) {
  $('qs').innerHTML = a.choices.map((q) => `
    <div class="q">
      ${q.header ? `<div class="q-head">${esc(q.header)}</div>` : ''}
      <p class="q-text">${esc(q.question)}</p>
      ${q.options.map((o, oi) => `
        <button class="opt" data-q="${q.idx}" data-o="${oi}" data-label="${esc(o.label)}">
          <span class="lb"><span class="mk">✓</span>${esc(o.label)}</span>
          ${o.description ? `<span class="ds">${esc(o.description)}</span>` : ''}
        </button>`).join('')}
    </div>`).join('');
  $('qs').classList.remove('hidden');

  const multi = new Map(a.choices.map((q) => [String(q.idx), q.multiSelect]));

  $('qs').addEventListener('click', (e) => {
    const btn = e.target.closest('.opt');
    if (!btn) return;
    const q = btn.dataset.q;
    const set = picked.get(q) ?? new Set();
    if (multi.get(q)) {
      // 多选：点一下切换
      set.has(btn.dataset.label) ? set.delete(btn.dataset.label) : set.add(btn.dataset.label);
    } else {
      // 单选：换掉之前那个
      set.clear();
      set.add(btn.dataset.label);
    }
    picked.set(q, set);
    // 重画这一题的选中态。只动 class，不重建 DOM——重建会把滚动位置弹回顶部
    for (const el of $('qs').querySelectorAll(`.opt[data-q="${q}"]`)) {
      el.classList.toggle('on', set.has(el.dataset.label));
    }
    // 每道题都至少选了一项才让提交。少一题就发出去的话，模型收到的是
    // 一份残缺的答案，而它没办法知道缺的是哪一道
    const done = a.choices.every((x) => (picked.get(String(x.idx))?.size ?? 0) > 0);
    $('answerBtn').disabled = !done;
  });

  $('answerBtn').classList.remove('hidden');
  $('answerBtn').onclick = () => answer(a);

  // 坞的高度写回 CSS 变量，理由同 armSwipe：写死一个数会把正文最后几行
  // 压在坞底下，而这里的坞比滑动条那套矮
  const dock = $('dock');
  const fit = () => document.documentElement.style.setProperty('--dock', dock.offsetHeight + 'px');
  fit();
  new ResizeObserver(fit).observe(dock);
}

async function answer(a) {
  if (submitting) return;
  submitting = true;
  const btn = $('answerBtn');
  btn.disabled = true;
  btn.textContent = '正在提交…';
  // 按题目顺序展平，保证送回去的顺序和屏幕上一致
  const choices = a.choices.flatMap((q) => [...(picked.get(String(q.idx)) ?? [])]);
  try {
    const res = await fetch(`/api/approvals/${BOOT.id}/decide?k=${encodeURIComponent(BOOT.key)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ choices }),
    });
    const data = await res.json();
    renderResult(data.approval || { status: 'answered', answer: choices });
  } catch {
    submitting = false;
    btn.disabled = false;
    btn.textContent = '提交回答';
    $('dbHint').innerHTML = '<b style="color:var(--no)">网络错误，请重试</b>';
    $('swipehint').classList.remove('hidden');
  }
}

/* 卡片滑动手势：与首页列表共用 ui/swipe.js，不再各留一份。 */
let swipeHandle = null;
function armSwipe(mode) {
  // 提示文案必须说清**不对称**：拒绝永远是轻动作，批准的重量随风险升级。
  // 不说的话用户会以为两边一样，然后在高危上反复失败而不知道为什么。
  const hand = '<span class="hand">👆</span> ';
  $('dbHint').innerHTML = hand + (mode === 'high'
    ? '拖动圆环 · <b style="color:var(--no)">左=拒绝</b> · 高风险，<b style="color:var(--ok)">右=允许</b>要拖得更远'
    : '拖动圆环 · <b style="color:var(--no)">左=拒绝</b> · <b style="color:var(--ok)">右=允许</b>');
  $('swipehint').classList.remove('hidden');
  // 幽灵拖影和摆手是**教学**：手指一碰就说明已经学会了，继续演下去只会
  // 在真正要瞄准的时候干扰视线。once 让它自己摘掉，不留监听器
  $('db').addEventListener('pointerdown', () => $('db').classList.add('touched'), { once: true });
  // 坞的实际高度写回 CSS 变量。提示文案在高风险时会换行、字号跟随系统
  // 无障碍设置，写死一个数早晚把命令最后几行压在坞底下
  const dock = $('dock');
  const fit = () => document.documentElement.style.setProperty('--dock', dock.offsetHeight + 'px');
  fit();
  new ResizeObserver(fit).observe(dock);
  swipeHandle = attachDecisionBar($('db'), {
    mode,
    onCommit: (dir) => (dir === 'deny' ? decide('deny') : showUndo()),
  });
}

// 3 秒而不是 2 秒：手势误触发后你得先意识到发生了什么，再决定要不要拦。
const UNDO_MS = 3000;
let undoRaf, undoDone = false;

function showUndo() {
  undoDone = false;
  $('undo').classList.remove('hidden');
  const t0 = performance.now();
  const step = () => {
    if (undoDone) return;
    const left = Math.max(0, UNDO_MS - (performance.now() - t0));
    $('undoRing').style.setProperty('--p', (left / UNDO_MS) * 100 + '%');
    $('undoNum').textContent = Math.ceil(left / 1000);
    if (left <= 0) {
      undoDone = true;
      window.ccHaptic?.(24);   // 真正执行的那一刻，给一下确认反馈
      $('undo').classList.add('hidden');
      decide('allow');
      return;
    }
    undoRaf = requestAnimationFrame(step);
  };
  step();
}

$('undoBtn').onclick = () => {
  undoDone = true;
  cancelAnimationFrame(undoRaf);
  $('undo').classList.add('hidden');
  swipeHandle?.restore();
};

render(BOOT);
</script>
</body>
</html>
