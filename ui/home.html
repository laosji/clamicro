<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Clamicro</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --fg:#12151a; --dim:#6b7280; --line:#e4e7ec; --monobg:#f0f2f5;
    --ok:#0a7d34; --no:#b42318; --warn:#b54708; --run:#0a7d34;
    --tabbg:rgba(255,255,255,.82);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d10; --card:#14181d; --fg:#e8eaed; --dim:#8b93a1; --line:#242a32; --monobg:#0f1318;
      --ok:#4ade80; --no:#f87171; --warn:#fbbf24; --run:#39ff8a;
      --tabbg:rgba(14,18,23,.82);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* iOS Safari 从 10 起就忽略 user-scalable=no，双击放大只能靠 touch-action 挡。
     manipulation = 保留滚动和捏合，去掉双击缩放那 300ms 的等待。 */
  html{touch-action:manipulation; -webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%;overflow-x:hidden;overscroll-behavior:none}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 0;
  }
  /* 页面是按手机设计的。桌面上不限宽会被拉成又宽又空的一条。
     限宽要加在**容器**上——加在 main > * 上会和子元素自己的
     margin 打架（h2 有 margin:20px 2px，会覆盖掉 margin:auto，
     结果标题贴左、卡片居中）。 */
  header, main{width:100%; max-width:592px; margin-left:auto; margin-right:auto}
  header{
    display:flex; align-items:center; gap:8px; padding:16px 18px 10px; flex:0 0 auto;
  }
  header h1{font-size:19px; margin:0; font-weight:600}
  header a{
    margin-left:auto; color:var(--dim); text-decoration:none;
    /* 44×44 是拇指可靠命中的最小面积。图形本身 24px——用内联 SVG 而不是
       ⚙ 字形：字形的实际大小随字体族和平台走，同一个 font-size 在 iOS 和
       Android 上能差一大截，而这里要的是一个确定的视觉尺寸 */
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; margin-right:-10px;
  }
  header a svg{width:24px; height:24px; display:block}
  header a:active{color:var(--fg)}

  /* ── 状态主控台 ──
     把「用量 / 运行状态 / 待审批」合成一个组件。它们本来就是同一个问题的
     不同侧面：此刻值不值得我看一眼手机。分成三张卡片时，眼睛要扫三个地方
     才能拼出答案。 */
  .console{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px; position:relative; overflow:hidden;
    transition:border-color .3s, box-shadow .3s;
  }
  .console .ctop{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px}
  .console .cleft{display:flex; align-items:center; gap:9px}
  .console .clabel{font-size:15px; font-weight:600}
  .console .cmeta{font-size:11.5px; color:var(--dim); margin-top:10px; font-variant-numeric:tabular-nums}
  .cdot{width:8px; height:8px; border-radius:50%; background:var(--run); box-shadow:0 0 10px var(--run); flex:0 0 auto}
  /* 呼吸：只在「有事在发生」时动。静止的界面上一个动的东西 = 注意力锚点，
     所以空闲态不能动，否则它就不再是信号 */
  .console.is-run .cdot,
  .console.is-wait .cdot{animation:breathe 2s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}

  /* ── 运行态的呼吸光晕 ──
     只在**运行中**出现。它是这一屏唯一持续动的东西，所以它就是「有事正在
     发生」这句话本身——空闲/完成/出错都不给，否则它退化成装饰。

     实现上动的是一个固定光晕伪元素的 opacity，不是 box-shadow 本身：
     动 box-shadow 每帧都要重新计算模糊并重绘，手机上很费电；动 opacity
     可以交给合成器。 */
  .console.is-run{border-color:color-mix(in srgb,var(--run) 38%,transparent)}
  /* 呼吸光晕必须画在**卡片自己身上**，不能画在 ::after 上。
     .console 有 overflow:hidden（滚动履历要靠它裁），而 ::after 是它的子元素——
     外扩的 box-shadow 会被容器整个裁掉，只剩 inset 那一层透出来。
     这就是「光晕加了多少都看不明显」的真正原因：它一直在被裁。
     元素自身的 box-shadow 不受自己的 overflow 影响，所以搬上来就出来了。 */
  .console.is-run{animation:card-breathe 3.6s ease-in-out infinite}
  @keyframes card-breathe{
    0%,100%{
      border-color:color-mix(in srgb,var(--run) 24%,transparent);
      box-shadow:0 0 0 1px color-mix(in srgb,var(--run) 6%,transparent),
                 0 0 22px -14px color-mix(in srgb,var(--run) 40%,transparent);
    }
    50%{
      border-color:color-mix(in srgb,var(--run) 55%,transparent);
      box-shadow:0 0 0 1px color-mix(in srgb,var(--run) 16%,transparent),
                 0 0 38px -8px color-mix(in srgb,var(--run) 75%,transparent);
    }
  }

  /* ── 状态点的涟漪 ──
     设计稿里「神经网络感」的来源其实是这个，不是光球：两圈描边从点上向外
     扩散并淡出，错开半个周期，看起来像一次次发出的信号。光球是环境光，
     涟漪才是**心跳**——有节拍，能数得出来。 */
  .console.is-run .cdot{position:relative; animation:dot-breathe 1s ease-in-out infinite}
  /* 涟漪铺满整张卡片，但**锚点仍在状态点上**。
     换成从卡片中心发散的话，「这圈波是那个绿点发出来的」这层因果就断了，
     它会退化成一个背景装饰；留在点上，卡片才像是被那个信号点亮的。

     用径向渐变而不是 border：1px 描边放大 16 倍就是 16px 的硬边圆环——那是
     个膨胀的甜甜圈，不是涟漪。软边在扩散中自然变淡变宽，才像波。

     周期取 5.2s：和光环的 9s、卡片呼吸的 3.6s 都不成整数比，三层不会周期性
     地撞在一起。撞上了就会被看成「一段循环动画」，而不是「它在思考」。
     卡片自身的 overflow:hidden 顺手把涟漪裁在卡片里——正是它读起来像
     「卡片背景」而不是一团飘出来的光的原因。 */
  .console.is-run .cdot::before,
  .console.is-run .cdot::after{
    content:""; position:absolute; left:50%; top:50%;
    width:40px; height:40px; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle,
      transparent 44%,
      color-mix(in srgb,var(--run) 50%,transparent) 60%,
      transparent 74%);
    transform:translate(-50%,-50%) scale(.2);
    animation:pulse-ring 5.2s cubic-bezier(.2,.6,.4,1) infinite;
  }
  .console.is-run .cdot::after{animation-delay:2.6s}
  @keyframes pulse-ring{
    0%{transform:translate(-50%,-50%) scale(.2); opacity:.6}
    100%{transform:translate(-50%,-50%) scale(16); opacity:0}
  }
  @keyframes dot-breathe{
    0%,100%{opacity:1; transform:scale(1)}
    50%{opacity:.45; transform:scale(.78)}
  }


  /* ── 流动光环 ──
     Apple Intelligence 那种观感来自**沿着边界流动的极光**，不是一圈静止的
     辉光：亮部绕着卡片走，永远不停在同一处。

     动的是**渐变自己的角度**，不是元素。先试过给整个 ::before 加 rotate——
     宽卡片一转对角线远大于高，绿雾直接甩出去半屏。改用 @property 让 conic
     的 from 角连续插值：几何完全不动，只有亮部在转。没有 @property 的浏览器
     退化成一圈静止极光，下面那层明暗呼吸还在，不会变成死图。

     色相只在 绿→薄荷→青→天蓝 这一段里走。产品的语汇是单色终端，整条彩虹
     会变成另一个产品；相邻色相已经足够让人看出「它在流动」。 */
  @property --aura{ syntax:'<angle>'; initial-value:0deg; inherits:false }
  .glow{position:relative; isolation:isolate}
  .glow::before{
    content:""; position:absolute; inset:-14px; border-radius:28px;
    z-index:0; pointer-events:none;
    background:conic-gradient(from var(--aura),
      #39ff8a, #4affc8, #35d9ff, #6ad0ff, #57ffb0, #39ff8a);
    filter:blur(24px); opacity:.36;
    animation:aura-spin 9s linear infinite;
  }
  /* 明暗呼吸叠在自转之上。两个周期互质（9s / 3.6s），合成节奏不重复——
     重复的节奏会被看成「一段循环动画」，而不是「它在思考」 */
  .glow::after{
    content:""; position:absolute; inset:-14px; border-radius:28px;
    z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,
      color-mix(in srgb,var(--run) 26%,transparent), transparent 70%);
    filter:blur(18px);
    animation:aura-pulse 3.6s ease-in-out infinite;
  }
  @keyframes aura-spin{to{--aura:360deg}}
  @keyframes aura-pulse{0%,100%{opacity:.18}50%{opacity:.5}}
  .glow > .console{position:relative; z-index:1}
  /* 浅色底上加光会糊成灰白，压低就行 */
  @media (prefers-color-scheme:light){
    .glow::before{opacity:.24; filter:blur(28px)}
    .glow::after{opacity:.16}
  }
  /* 主控台内部元素要浮在光晕之上 */
  .console > *{position:relative; z-index:1}

  /* 圆点向外扩散的涟漪——「神经网络」那种感觉来自这一层，
     两个环错开半个周期，看起来是连续在往外推 */
  .console.is-run .cdot{position:relative}

  /* 呼吸和涟漪正是 prefers-reduced-motion 要关掉的东西。
     关掉之后光晕**保持在中等亮度**而不是消失——它承载的是「在运行」
     这个信息，不能因为用户不想看动画就把信息一起拿走 */
  /**
   * 「减弱动态效果」要停的是**位移和缩放**，不是全部动效。
   *
   * 之前这里一刀切 animation:none。实测（CDP 模拟 prefers-reduced-motion）：
   * 开关一开，光标 blink、卡片 card-breathe、状态点 dot-breathe 三个动画
   * 全部消失，运行态变成一张完全静止的卡片——而「有东西在动」正是这一屏
   * 唯一在说「它还活着」的信号，恰恰是最不该被抹掉的那个。
   *
   * 停：涟漪向外扩张（scale 到 6.5 倍）、光环绕圈、履历横向滚动。
   * 留：原地明暗呼吸。它不改变任何东西的位置和大小，那个开关针对的是会
   *     引起前庭不适的大幅运动，不是所有会变化的像素。
   */
  @media (prefers-reduced-motion: reduce){
    .console.is-run .cdot::before, .console.is-run .cdot::after{display:none}
    .glow::before{animation:none; opacity:.28}
  }
  .console.is-wait{border-color:color-mix(in srgb,var(--warn) 45%,transparent);
    box-shadow:0 0 26px -12px color-mix(in srgb,var(--warn) 70%,transparent)}
  .console.is-wait .cdot{background:var(--warn); box-shadow:0 0 10px var(--warn)}
  .console.is-wait .clabel{color:var(--warn)}
  .console.is-err{border-color:color-mix(in srgb,var(--no) 45%,transparent)}
  .console.is-err .cdot{background:var(--no); box-shadow:0 0 10px var(--no)}
  .console.is-err .clabel{color:var(--no)}
  .console.is-done .cdot{animation:none}
  /* 断线用灰：它**不是 Claude 的状态**，是连接问题。混进红/黄会让人
     以为任务出事了，实际是手机自己联系不上 Mac */
  .console.is-off{opacity:.9}
  .console.is-off .cdot{background:transparent; border:1.5px solid var(--dim); box-shadow:none; animation:none}
  .console.is-off .clabel{color:var(--dim)}

  /* 「知道了」：位置和其它状态的 ctag 一致（右上角），但它是可点的，
     所以给足 44px 的命中高度，视觉上仍然轻 */
  .cdismiss{
    font:600 12px/1 -apple-system,"PingFang SC",sans-serif;
    color:var(--dim); background:var(--monobg); border:1px solid var(--line);
    border-radius:20px; padding:0 12px; height:28px; cursor:pointer;
    position:relative; z-index:2;
  }
  .cdismiss:active{color:var(--fg)}
  .ctag{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--monobg);
    color:var(--dim); border:1px solid var(--line); font-variant-numeric:tabular-nums}
  .ctag.warn{color:var(--warn); border-color:color-mix(in srgb,var(--warn) 35%,transparent);
    background:color-mix(in srgb,var(--warn) 10%,transparent)}

  /* 空闲态：用量是此刻唯一值得看的信息，所以它折进主控台而不是单独占一屏 */
  .cusage .uline{display:flex; align-items:center; gap:10px}
  .cusage .uline + .uline{margin-top:8px}
  .cusage .um{flex:1; min-width:0}
  .cusage .ur{font-size:11px; color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums}
  .cusage .u7{opacity:.62}
  .cusage .u7 .meter{font-size:11px}
  .cusage .u7 .bar{height:4px}

  /* 运行态：显示 Claude 此刻在做什么。数据来自 sub_state，不编造 */
  .crun{display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:2px}
  .crun .cf{color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tdots{display:inline-flex; gap:3px; flex:0 0 auto}
  .tdots i{width:4px; height:4px; border-radius:50%; background:var(--run); animation:td 1.2s ease-in-out infinite}
  .tdots i:nth-child(2){animation-delay:.15s} .tdots i:nth-child(3){animation-delay:.3s}
  @keyframes td{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .cdone{display:flex; align-items:center; gap:10px}
  .cdone .ck{width:28px; height:28px; border-radius:50%; flex:0 0 auto;
    background:color-mix(in srgb,var(--run) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--run) 40%,transparent);
    display:flex; align-items:center; justify-content:center; color:var(--run); font-size:14px}
  .cdone .ct{font-size:13.5px; color:var(--dim); line-height:1.5}
  .cdone .ct b{color:var(--fg); font-weight:600}

  /* 断线态的动作区。「重新连接」是这一屏唯一的主动作，所以给实心按钮——
     旁边的自动重试倒计时是说明，不是第二个按钮，用弱化的文字 */
  .coff .oact{display:flex; align-items:center; gap:12px; margin:12px 0 4px}
  .coff .oretry{
    appearance:none; border:0; border-radius:10px; padding:11px 18px;
    background:var(--accent); color:#000; font:600 15px -apple-system,"PingFang SC",sans-serif;
    min-height:44px; cursor:pointer;
  }
  .coff .oretry:disabled{opacity:.5}
  .coff .oauto{font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums}
  .coff .oalt{font-size:12.5px; color:var(--dim); line-height:1.6; margin-top:6px}
  .coff .oalt a{color:var(--accent); text-decoration:none}
  /* 排查清单收进折叠：它服务的是「按了还是不行」的少数人，
     默认展开会把唯一的动作挤到屏幕下方 */
  .coff .ohd{margin-top:10px}
  .coff .ohd summary{font-size:12.5px; color:var(--dim); cursor:pointer; list-style:none}
  .coff .ohd summary::-webkit-details-marker{display:none}
  .coff .ohd summary::before{content:'▸ '}
  .coff .ohd[open] summary::before{content:'▾ '}
  .coff .om{font-size:13px; color:var(--dim); line-height:1.55; margin-bottom:8px}
  .coff .oh{font-size:11.5px; color:var(--dim); border-top:1px solid var(--line);
    padding-top:9px; line-height:1.7; opacity:.85}

  /* ── 「你不在时替你做了决定」──
     走开二十分钟，高危操作等到超时被拒、那一轮任务因此失败。回到手机上
     以前是**一片干净**，什么痕迹都没有。藏起来等于假装它没发生。 */
  .autodeny{display:flex; align-items:flex-start; gap:10px; margin-bottom:14px;
    background:color-mix(in srgb,var(--warn) 7%,transparent);
    border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);
    border-radius:12px; padding:12px 13px}
  .autodeny .ai{font-size:15px; flex:0 0 auto; line-height:1.2}
  .autodeny .ab{flex:1; min-width:0}
  .autodeny .at{font-size:13px; font-weight:600; margin-bottom:3px}
  .autodeny .at b{color:var(--warn)}
  .autodeny .am{font-size:11px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .autodeny .ax{font-size:15px; color:var(--dim); background:none; border:0; padding:2px 4px; cursor:pointer}

  /* 队列：底下垫两张卡，一眼看出「后面还有」 */
  .console.queued{margin-bottom:26px}
  .console.queued::before, .console.queued::after{
    content:""; position:absolute; left:50%; transform:translateX(-50%);
    border:1px solid color-mix(in srgb,var(--warn) 22%,transparent);
    border-radius:16px; background:var(--card); z-index:-1;
  }
  .console.queued::before{width:calc(100% - 14px); bottom:-7px; height:22px; opacity:.75}
  .console.queued::after{width:calc(100% - 30px); bottom:-14px; height:22px; opacity:.45}
  .qdots{display:flex; gap:5px; justify-content:center; margin-top:11px}
  .qdots i{width:5px; height:5px; border-radius:50%; background:var(--line)}
  .qdots i.on{background:var(--warn)}
  .cbar{height:3px; background:var(--monobg); border-radius:2px; overflow:hidden; margin-top:11px}
  .cbar i{display:block; height:100%; background:var(--warn); transition:width 1s linear}

  /* ── 活动履历 ──
     「最近几步」和「这一刻」是不同的信息：一行当前动作只说得出它在做什么，
     履历能看出它是在推进还是在原地打转。
     只在运行态出现，且**只有放不下时才滚动**——手机上一个持续移动的东西
     是很强的注意力磁铁，没必要时让它静止。 */
  /* 竖排：一行一条，卡片自己长高。不再横向滚动——见 activityTicker 的注释 */
  .ctick{margin-top:9px; display:flex; flex-direction:column; gap:3px}
  .ctick .tr{
    font-size:11.5px; color:var(--dim); line-height:1.45;
    /* 单条太长时省略尾部而不是撑破卡片。路径靠尾部区分，所以用 direction
       翻转让省略号出现在**开头**，保留更有辨识度的那一头 */
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    direction:rtl; text-align:left;
  }
  /* direction:rtl 会把行尾的标点甩到前面，用 bdi 隔离方向 */
  .ctick .tr>bdi{direction:ltr}
  .ctick .tr.now{color:var(--run)}
  /* 新的一条滑进来。只给最上面那条，且只在它真的变了的时候——
     整列都动会让人以为四条全是新的，而「在动」在这个界面里是有含义的 */
  .ctick .tr.fresh{animation:tick-in .34s cubic-bezier(.2,.9,.3,1) both}
  @keyframes tick-in{
    from{opacity:0; transform:translateY(-7px)}
    to{opacity:1; transform:translateY(0)}
  }
  /* 关掉动效偏好时不动 —— 它是提示，不是必需信息，信息本身在文字里 */
  @media (prefers-reduced-motion: reduce){ .ctick .tr.fresh{animation:none} }

  /* 非空闲时的用量条：安静、贴着 header、不抢注意力 */
  /* ── 终端路径行 ── */
  .pathbar{
    flex:0 0 auto; display:flex; align-items:center;
    width:100%; max-width:592px; margin:0 auto; padding:2px 18px 10px;
    font:13px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim);
  }
  .pathbar .seg{color:var(--fg)}
  .pathbar .sep{opacity:.45; margin:0 6px}
  .pathbar .seg2{color:var(--dim)}
  .pathbar .conn{
    margin-left:auto; display:flex; align-items:center; gap:5px;
    font-size:10.5px; letter-spacing:.04em; color:var(--run);
  }
  .pathbar .conn::before{
    content:""; width:5px; height:5px; border-radius:50%;
    background:var(--run); box-shadow:0 0 5px var(--run);
  }
  /**
   * 光标 = 连接状态。
   *
   * 做成会闪的方块是因为**闪烁本身就是活着的证据**：一个静止的绿点可以是
   * 上一秒画完就冻住的画面，而一直在闪的光标只要停下来你立刻会发现。
   * 三档各自不同，不靠颜色单独承担（色觉差异下也分得开）：
   *   连上   → 绿色，稳定闪烁
   *   重连中 → 琥珀色，快闪（明显更急）
   *   断开   → 空心描边，不闪（死掉的样子）
   */
  .pathbar .cursor{
    display:inline-block; width:7px; height:15px; margin-left:7px;
    background:var(--run); box-shadow:0 0 8px var(--run);
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  .pathbar.is-retry .cursor{background:var(--warn); box-shadow:0 0 8px var(--warn); animation-duration:.45s}
  .pathbar.is-retry .conn{color:var(--warn)}
  .pathbar.is-retry .conn::before{background:var(--warn); box-shadow:0 0 5px var(--warn)}
  .pathbar.is-off .cursor{
    background:transparent; box-shadow:none; animation:none;
    border:1px solid var(--dim); opacity:.5;
  }
  .pathbar.is-off .conn{color:var(--dim)}
  .pathbar.is-off .conn::before{background:transparent; box-shadow:none; border:1px solid var(--dim)}
  /* 光标**不**跟着「减弱动态效果」停。
     iOS 自己的文本插入符在开着那个开关时照样闪；一个 7px 方块原地明暗
     交替不会引起前庭不适。更要紧的是这里闪烁**就是信息**——页面还活着。
     停掉它等于把状态指示器变成一张静态图，而那正是它要否定的东西。 */

  #topusage{
    flex:0 0 auto; width:100%; max-width:592px; margin:0 auto;
    padding:0 18px 12px; font-size:11px; color:var(--dim);
    font-variant-numeric:tabular-nums;
  }
  /* 头部区（标题 / 路径 / 用量）到此为止。没有这条界，运行中卡片直接怼在
     7d 那行下面，光环还会往上糊到用量条上——两块无关的信息看着像连在一起 */
  /* ── 加到主屏幕：底部弹层 ──
     做成从底部升起的 sheet 而不是列表里的一张卡：它是一次性的建议，不属于
     首页的常驻内容。内联卡片会把主控台和待审批往下挤，而这个建议**任何时候
     都没有它们重要**；弹层浮在上面，关掉之后首页一个像素都没变过。 */
  .a2hs-scrim{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45);
    animation:scrim-in .22s ease-out both;
  }
  .a2hs{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--card); border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:22px 20px calc(20px + env(safe-area-inset-bottom));
    animation:sheet-up .26s cubic-bezier(.2,.9,.3,1) both;
    /* 小屏上内容可能顶到屏幕外，最后那个安装按钮就点不着了。
       留 15vh 给背景，超出的部分自己滚 */
    max-height:85vh; overflow-y:auto;
  }
  /* 宽屏上别拉成一整条：手机是主场，但桌面浏览器打开时一条横贯全屏的
     弹层会显得莫名其妙 */
  @media (min-width:600px){
    .a2hs{
      left:50%; right:auto; transform:translateX(-50%);
      width:min(520px, 92vw); border-radius:20px; bottom:24px;
      border:1px solid var(--line);
    }
    @keyframes sheet-up{from{transform:translate(-50%,18px); opacity:0}
                        to{transform:translate(-50%,0); opacity:1}}
  }
  @keyframes sheet-up{from{transform:translateY(100%)} to{transform:translateY(0)}}
  @keyframes scrim-in{from{opacity:0} to{opacity:1}}
  @media (prefers-reduced-motion: reduce){
    .a2hs, .a2hs-scrim{animation:none}
  }
  /* 抓握条：告诉人这是一层可以关掉的东西，不是页面的一部分 */
  .a2hs .grip{
    width:36px; height:4px; border-radius:2px; background:var(--line);
    margin:-8px auto 16px;
  }
  .a2hs .close{
    position:absolute; top:10px; right:10px; width:36px; height:36px;
    font-size:15px; color:var(--dim); background:none; border:none; cursor:pointer;
  }
  .a2hs .icon-row{display:flex; align-items:center; gap:12px; margin-bottom:4px}
  /* 这里放的是**你要去按的那个键**，不是我们自己的 App 图标。
     App 图标在这一刻不提供信息——你已经在这个应用里了；而「哪个键」正是
     这条提示唯一要回答的问题。 */
  .a2hs .appicon{
    width:52px; height:52px; border-radius:13px; flex:0 0 auto;
    background:var(--monobg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--run);
  }
  .a2hs .appicon svg{width:26px; height:26px}
  .a2hs h2{font-size:16.5px; margin:0 0 2px}
  .a2hs .sub{font-size:12.5px; color:var(--dim); line-height:1.45}
  .a2hs .steps{margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
  .a2hs .step{display:flex; align-items:center; gap:11px; margin-bottom:12px; font-size:13.5px}
  .a2hs .step:last-child{margin-bottom:0}
  .a2hs .step .num{
    width:20px; height:20px; border-radius:50%; background:var(--monobg); color:var(--dim);
    display:flex; align-items:center; justify-content:center;
    font:600 11px ui-monospace,Menlo,monospace; flex:0 0 auto;
  }
  .a2hs .step .ic{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px;
    border-radius:7px; background:var(--monobg); flex:0 0 auto; color:var(--dim);

  /* 箭头指向 Safari 底部工具栏里的分享按钮。网页够不到系统 UI，只能这样引导

  .a2hs .point{
    display:flex; flex-direction:column; align-items:center;
    margin-top:16px; padding-top:14px; border-top:1px dashed var(--line);

  .a2hs button.install{
    width:100%; margin-top:14px; padding:13px; border-radius:11px; cursor:pointer;

  #topusage .tu{display:flex; align-items:center; gap:8px}

  #topusage.stale{opacity:.55}

  /* 按模型分区：标题 + 它自己的状态卡。只在多后端时出现，见 renderHome */
  .agroup{margin-top:16px}

  .ahead .an{font-weight:600; font-size:13.5px}
  /* 用量跟在模型名后面：它是这个模型的属性，不该跑到别处去 */
  .ahead .au{margin-left:auto; font-size:11.5px; color:var(--dim);
    font-variant-numeric:tabular-nums}
  /* 过期的数字要看得出来是过期的 —— 人先看数字，光在旁边写小字不够 */
  .ahead .au.stale{opacity:.55; text-decoration:line-through dotted}

  /* 会话列表的后端筛选片。触摸目标 40px 起，手机上再小就开始误点 */
  .afilter{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:2px}
  .afilter button{
    appearance:none; border:0; border-radius:20px; padding:9px 14px; min-height:40px;
    background:var(--monobg); color:var(--dim);
    font:500 13px -apple-system,"PingFang SC",sans-serif; cursor:pointer;
  }
  .afilter button.on{background:var(--run); color:#000}
  /* 被筛掉多少必须说出来，否则收窄过的列表和「就这么多」长得一样 */
  .ahidden{margin-top:14px; font-size:12.5px; color:var(--dim); text-align:center}

  .meters{margin-top:12px; display:grid; gap:8px}

  .empty{color:var(--dim); font-size:14px; text-align:center; padding:44px 20px; line-height:1.8}
  .empty b{display:block; color:var(--fg); font-size:15px; font-weight:500; margin-bottom:4px}

  /* 底部 tab bar */
  nav{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    display:flex; border-top:1px solid var(--line);

  .qitem button{

    font-size:12.5px; line-height:1.6; color:var(--warn); margin:10px 2px 0;

  /* ── 等待态主控台的内容 ── */

  .cwsub{font-size:12.5px; color:var(--dim); margin-bottom:2px}

  .cdl{flex-direction:column; align-items:stretch; gap:7px}

<link rel="stylesheet" href="/ui/swipe.css">
<script>
/**
 * 没做过引导就送去引导，**在任何东西被渲染之前**。
 *
 * 放在 <head> 里、用 location.replace：晚一步的话首页会先闪一帧再跳走，
 * 而 replace 不留历史记录——否则用户在引导里按返回会掉回一个空首页。
 *
 * 用 try/catch 包住：隐私模式下 localStorage 可能直接抛，那时宁可**不拦**
 * 也不能白屏——引导没做成是小事，进不去首页是大事。
 */
(function () {
  try {
    if (localStorage.getItem('ccm-onboarded')) return;
    const step = Number(localStorage.getItem('ccm-onboard-step')) || 1;
    location.replace('/ui/onboarding/' + Math.min(3, Math.max(1, step)));
  } catch { /* 拿不到 localStorage 就当已经引导过 */ }
})();
</script>

};
function agentLogo(agent) { return AGENT_LOGOS[agent] || ''; }

let tab = sessionStorage.getItem('ccm-tab') || 'home';
let sessions = [], pending = [], cfg = null, quota = null, inbox = {}, slSeen = null, recentlyExpired = [], recentTools = [], doneTimer = null;
// agent -> 最后一次上报时间。用来区分「这个后端没有会话」和「这个后端不上报了」
let agentsSeen = {};
/** agent -> 首次上报时间。首页分区的顺序按它排，见 agentKinds */
let agentsFirstSeen = {};
/**
 * 会话列表的后端筛选。null = 全部。
 *
 * **故意不持久化**：一个记住了的筛选就退化成了模式——你下次打开时
 * 看到的是一个被收窄过的世界，却不记得是自己收窄的。
 */
let agentFilter = null;
// 最近一次拉取状态是不是失败了。见 refresh()：主数据拉不到时要显式说，
// 不能留白——留白看起来像功能没做完，而不是连不上
let fetchFailed = false;
/**
 * 手动收掉的「已完成」。只在内存里，不落 localStorage——
 * 它标的是「这一条我看过了」，刷新页面之后那件事本来就该重新判断一次。
 */
const dismissedDone = new Set();

function meter(label, pct) {
  const v = Math.min(100, Math.max(0, pct ?? 0));
  const cls = v >= 90 ? 'hot' : v >= 70 ? 'mid' : '';
  return `<div class="meter"><b>${label}</b><div class="bar"><i class="${cls}" style="width:${v}%"></i></div><span class="pct">${Math.round(v)}%</span></div>`;
}

/**
 * 状态主控台：一个组件回答「此刻值不值得我看一眼手机」。
 *
 * 用量、运行状态、待审批本来就是同一个问题的不同侧面，分成三张卡片时
 * 眼睛要扫三个地方才能拼出答案。合成一个之后，**颜色和那一个圆点就是答案**。
 *
 * 优先级是有讲究的：
 *   断线 > 待审批 > 出错 > 运行中 > 刚完成 > 空闲
 *
 * 断线排第一，因为**断线时下面显示的一切都是旧的**——先说清这一点，
 * 否则用户会盯着一个早就结束的待审批以为系统卡死。它也刻意用灰色而不是
 * 红黄：那不是 Claude 的状态，是手机联系不上 Mac。
 */
/**
 * 最近几步做了什么。
 *
 * 数据是**服务端真实的工具调用事件**（`Edit: src/foo.ts`、`Bash: npm test`），
 * 不是客户端自己攒的 sub_state——后者刷新页面就空了，而且 `Editing` 远不如
 * `Edit: src/api/handler.ts` 有信息量。
 *
 * 只取当前会话的、只留最近 4 条、去掉连续重复的。空的时候整块不出现，
 * 不留一条空轨道占位。
 */
/** sid -> 上一次渲染时最新的那条。用来判断「这次是不是真的有新东西」 */
const tickerTop = new Map();

function activityTicker(sid) {
  const rows = [];
  for (let i = recentTools.length - 1; i >= 0 && rows.length < 4; i--) {
    const e = recentTools[i];
    if (sid && e.sid !== sid) continue;
    if (rows.length && rows[rows.length - 1] === e.text) continue; // 连续重复的合成一条
    rows.push(e.text);
  }
  if (!rows.length) return '';
  /**
   * 履历是**竖着一行一条**，不是横着滚。
   *
   * 原来是跑马灯：一行装不下就横向循环滚动。三个问题——
   *   · 想读第三条得等它滚过来，信息的可读时机由动画决定，不由人决定
   *   · 长路径（`Downloads/clamicro/ui/home.htm…`）被从中间截断，
   *     而路径恰恰是靠尾部区分的
   *   · 横向滚动在手机上不是人熟悉的手势，静止截图里还会被误读成排版错位
   *
   * 竖排让卡片自己长高。多出来的那点高度远比"省下来但读不到"划算，
   * 最多 4 条本来就有上限，不会长到失控。
   */
  /**
   * **有新的一条进来时才动**，不做持续滚动。
   *
   * 「感觉是静止的」这个观感是真的：两次工具调用之间它确实不动。但解法
   * 不是让它一直滚——那就退回跑马灯那三个问题（读的时机被动画决定、
   * 长路径被截断、手机上不熟悉的横向手势）。
   *
   * 这个项目对动效的一贯立场是「**有东西在动本身应该是个信号，不是装饰**」
   * （原来那句注释就写在滚动判定旁边）。所以只在最新一条**变了**的时候，
   * 给它一个入场动画：动一下 = 刚才真的跑了一个新工具。
   *
   * 只认最上面那条：整列都动会让人以为四条全是新的。
   */
  const key = sid || '*';
  const fresh = tickerTop.get(key) !== rows[0];
  tickerTop.set(key, rows[0]);

  return `<div class="ctick">${rows
    .map((t, i) => `<div class="tr${i === 0 ? ' now' : ''}${i === 0 && fresh ? ' fresh' : ''}"><bdi>${esc(t)}</bdi></div>`)
    .join('')}</div>`;
}

/**
 * 非空闲时把用量收到 header 下面。
 *
 * 空闲态用量是主控台的主体；一旦有事在发生，主控台要让给「正在发生的事」。
 * 但用量不该因此消失——「还能不能再跑一轮」这个问题在任务运行中反而更常问。
 * 所以它降级成一条细线，安静地待在标题下方。
 *
 * **断线时不显示**：那时所有数字都是断开前的旧值，把它摆在顶部等于
 * 拿旧数据冒充当前状态，而这正是这个项目反复强调不能做的事。
 */
function renderTopUsage() {
  const el = $('topusage');
  const off = isDisconnected();
  const idle = !off && !pending.length
    && !sessions.some((s) => s.state === 'Error')
    && !sessions.some((s) => s.state === 'Running' || s.state === 'Waiting Approval')
    && !sessions.some((s) => s.state === 'Done' && Date.now() - s.updated_at < 60_000);

  /**
   * 三种情况不显示这条：
   *
   *   idle  —— 空闲时主控台里已经有完整的两行用量，这里再来一条就是重复
   *   多后端 —— 状态条里每个后端各带自己的用量，比这条通栏更准确（这条
   *            只可能显示 Claude Code 的窗口配额）。两个都画的话，同一份
   *            数字在一屏里出现两次，而其中一条还归属不明
   *   刷不出来的旧数据 —— 这个界面不调 statusLine，数字永远停在那儿。
   *            把一个看起来确定、其实早已不成立的百分比摆在最顶上，
   *            比不显示更容易误导。主控台那边会整段说清是怎么回事
   */
  const multi = agentKinds().size > 1;
  const unrefreshable = quotaStale() && quotaWhy() === 'hooks-only';
  if (!quota || off || idle || multi || unrefreshable) { el.hidden = true; return; }
  el.hidden = false;

  const row = (label, w, dim) => {
    const v = Math.min(100, Math.max(0, w?.pct ?? 0));
    const cls = v >= 90 ? 'hot' : v >= 70 ? 'mid' : '';
    return `<div class="tu${dim ? ' d7' : ''}"><b>${label}</b>
      <span class="tb"><i class="${cls}" style="width:${v}%"></i></span>
      <span class="pc">${Math.round(v)}%</span>
      <span class="rs">${resetCell(w)}</span></div>`;
  };
  el.innerHTML = row('5h', quota.five_hour, false) + row('7d', quota.seven_day, true);
  // 过期的数字要看得出来是过期的。只在右边写一行小字不够——人是先看条和
  // 百分比的，那两样看着永远像当前值
  el.classList.toggle('stale', quotaStale());
}

const fmtLeft = (s) => (s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s}s`);

/**
 * 「你不在时，有东西被替你拒了」。
 *
 * 高危操作等到超时会被自动拒绝，那一轮任务因此失败。以前回到手机上
 * **一片干净**——界面看不出发生过任何事，你只会觉得「Claude 怎么没干活」。
 * 在你不在时替你做了决定，是这个工具最该说出口的事。
 *
 * 可以关掉：关的是**这一批**（按最新一条的时间戳记），再有新的还会出现。
 * 一关永久静音就又变成了「悄悄替你决定」。
 */
function autoDenyBanner() {
  const list = (recentlyExpired || []);
  if (!list.length) return '';
  const newest = Math.max(...list.map((a) => a.decided_at || 0));
  if (Number(localStorage.getItem('ccm-ad-seen') || 0) >= newest) return '';
  const a = list[0];
  return `<div class="autodeny" data-seen="${newest}">
    <div class="ai">⏱</div>
    <div class="ab">
      <div class="at"><b>${list.length} 条审批</b>因超时被自动拒绝</div>
      <div class="am">${esc(a.headline || a.summary)} · ${ago(a.decided_at)}</div>
    </div>
    <button class="ax" aria-label="知道了">×</button>
  </div>`;
}

/** 断线判定的**唯一**出处。轮询失败和 SSE 断开是同一件事的两种察觉方式。 */
function isDisconnected() {
  return fetchFailed || (offlineSince !== null && Date.now() - offlineSince > 5000);
}

/** 「N 秒后自动重试」。人知道不用管它，才不会一直盯着按钮。 */
function autoRetryHint() {
  if (!autoRetryAt) return '正在重试…';
  const left = Math.max(0, Math.round((autoRetryAt - Date.now()) / 1000));
  return left ? `${left} 秒后自动重试` : '正在重试…';
}

/**
 * 备用地址。
 *
 * 换 IP 是断线的头号原因，而这恰恰是**重连按钮救不了**的一种——地址本身
 * 就错了，再连一百次还是错的。上一次连上时把服务报的几个地址存下来，
 * 断线时把「和当前不一样的那个」摆出来，一点就过去。
 *
 * 这比「去 Mac 上重新扫码」强在：人拿着手机就能做完。
 */
function altAddressHtml() {
  let alts = [];
  try { alts = JSON.parse(localStorage.getItem('ccm-alt-urls') || '[]'); } catch { /* 存坏了就当没有 */ }
  const here = location.origin;
  const other = alts.filter((u) => typeof u === 'string' && u && u !== here);
  if (!other.length) return '';
  return `<div class="oalt">换过网络？试试另一个地址：${other
    .map((u) => `<a href="${esc(u)}/ui">${esc(u.replace(/^https?:\/\//, ''))}</a>`)
    .join('　')}</div>`;
}

/**
 * 主控台。`only` 传后端 key 时只看那个后端的会话（按模型分区时用）。
 *
 * **待审批不受 only 影响**：它有倒计时，被分进某个区块就意味着你得先
 * 找到那个区块才看得见——漏看一条等于一次静默的自动决策。所以审批态
 * 始终读全局 pending，跟这张卡挂在谁名下无关。
 */
function statusConsole(only) {
  const off = isDisconnected();
  const mine = only ? sessions.filter((s) => (s.agent || 'claude-code') === only) : sessions;
  const busy = mine.filter((s) => s.state === 'Running' || s.state === 'Waiting Approval');
  const err = mine.find((s) => s.state === 'Error');
  /**
   * 「已完成」是**一闪而过的状态**，不是一个可以停住的状态。
   *
   * 会话的 state 会一直停在 Done 直到下一轮开始，所以不加时间窗的话
   * 卡片就永远显示「已完成」，再也回不到用量——而任务早就结束了，
   * 那条信息也早就没用了，却一直占着屏幕上最显眼的位置。
   *
   * 窗口取 60 秒而不是设计稿的 3 秒：通知响了你才掏手机，3 秒到手时
   * 早就切走了，那这个状态等于没做。60 秒覆盖「听见→拿起→解锁→看一眼」，
   * 过了就该让位给用量。
   */
  const DONE_WINDOW = 60_000;
  const done = mine.find((s) =>
    s.state === 'Done'
    && Date.now() - s.updated_at < DONE_WINDOW
    // 手动关掉的那一条不再顶着。键里带 updated_at：**同一个会话下一次跑完
    // 是一条新消息**，不该被上一次的「知道了」连带压住
    && !dismissedDone.has(`${s.session_id}:${s.updated_at}`));

  let cls = '', dotLabel = '空闲', right = '', body = '', meta = '';

  if (off) {
    cls = 'is-off'; dotLabel = '连接已断开';
    /**
     * 断线态**只有一张卡**。
     *
     * 之前这一屏会同时叠三张：「拉取状态失败」「与服务失去连接」「连接已断开」——
     * 三段话说同一件事，三次都让你去 Mac 上扫码。重复不会让信息更清楚，
     * 只会让人以为这页面坏了；而且真正该做的动作（再连一次）一次都没出现。
     *
     * 顺序也换了：**先给出路，再给排查**。
     * 原来第一屏就是三行排查清单，可绝大多数断线是抖一下——切了 Wi-Fi、
     * 息屏回来、服务刚重启，按一下就好。把最可能奏效、代价最小的动作放最前，
     * 排查清单收进折叠里，只给那些真的按了还不行的人。
     */
    const secs = Math.round((Date.now() - offlineSince) / 1000);
    body = `<div class="coff">
      <div class="om">已经 ${secs} 秒没有收到 Mac 的消息了。<b>下面显示的是断开前的旧状态。</b></div>
      <div class="oact">
        <button class="oretry" id="oretry" type="button">重新连接</button>
        <span class="oauto" id="oauto">${autoRetryHint()}</span>
      </div>
      ${altAddressHtml()}
      <details class="ohd"><summary>按了还是连不上？</summary>
        <div class="oh">1. Mac 是否还开着、Clamicro 是否还在运行<br>
          2. 手机和 Mac 是否仍在同一网络<br>
          3. Mac 的局域网 IP 变了的话，这个页面连的是旧地址 ——
             在 Mac 上跑 <code>npx clamicro qr</code> 重新扫码</div>
      </details>
    </div>`;
  } else if (pending.length && undoing.has(pending[0].id)) {
    /**
     * 主控台这条**刚被滑批准**，正在 3 秒撤销窗口里。
     *
     * 这一档原来整个不存在：撤销条只渲染在下方列表（rest）里，而主控台
     * 展示的那条恰好被 rest 过滤掉了。于是**只有一条待审批时**——也就是
     * 最常见的情况——滑一下批准后，卡片还照常显示「等待批准」，
     * 既没有「已批准」的反馈，也没有撤销按钮，3 秒后静悄悄地提交。
     *
     * 撤销窗口的全部意义是「手滑了还能收回」。它在最常见的路径上不出现，
     * 等于没有。
     */
    const a = pending[0];
    cls = 'is-wait'; dotLabel = '已批准';
    body = `<div class="undoline" style="margin-top:10px">
      <span>已批准 · <b id="undo-${a.id}">3</b> 秒后执行</span>
      <button onclick="cancelUndo('${a.id}')">撤销</button>
    </div>`;
  } else if (pending.length) {
    // 有事等你做决定 —— 这是整个产品存在的理由，压过其他一切状态
    const a = pending[0];
    cls = 'is-wait' + (pending.length > 1 ? ' queued' : ''); dotLabel = '等待批准';
    const span = Math.max(1, a.expires_at - a.created_at);
    // 同样钳住：跨设备时钟差会让「剩余」超过「总时长」，读数多跳一秒、
    // 进度条超过 100%
    const left = Math.max(0, Math.round(Math.min(span, a.expires_at - Date.now()) / 1000));
    const pctLeft = Math.max(0, Math.min(100, ((a.expires_at - Date.now()) / span) * 100));
    /**
     * 等待态是**完整且可操作**的那一份，不是一个摘要。
     *
     * 中间踩过两个坑，都记在这儿：
     *
     * 1. 一开始主控台和列表各画一遍同一条，屏幕上出现两个各自倒数的进度条
     *    （秒数还会因为渲染时机差一秒），读的人只会怀疑这是不是两条。
     * 2. 于是把它从列表里摘掉——结果**只有一条待审批时列表整个空掉**，而
     *    当时的主控台既不能滑也没有链接、`.dl` 元素为 0 所以 tickDeadlines
     *    无事可做，倒计时看着是冻住的。一条恰恰是最常见的情况。
     *
     * 结论：要么两边都完整（重复），要么主控台完整且能操作、列表不再重复。
     * 取后者——这也正是设计稿的做法（合并成一个组件）。所以这里必须同时
     * 满足三件事，缺一件就退回坑里：
     *   · 倒计时走 `.dl` 那套 data 属性，由 tickDeadlines 每秒驱动
     *   · 带 swipecard/data-ap/data-risk，让 attachListSwipes 接上手势
     *   · 留一个「详情 →」，因为高危不给右滑批准，必须有路进详情页
     */
    const impact = (a.impact || []).map((i) => i.label).filter(Boolean).slice(0, 2).join(' · ');
    // 右上角**不放倒计时**。它由 render() 画，30 秒才刷一次，而下面那行由
    // tickDeadlines 每秒走——同一个数、两条代码路径，必然会被看到对不上。
    // 一个数只能有一个来源。这里只留「第几条 / 共几条」，那是队列信息。
    right = pending.length > 1 ? `<span class="ctag warn">1 / ${pending.length}</span>` : '';
    body = `<div class="cwtitle">${a.risk.level === 'high' ? '⚠️ ' : '🔒 '}${esc(a.headline || a.summary)}</div>
      ${a.mismatch ? `<div class="cwmis">⚠️ 这句描述与命令不符，点进去看原文</div>` : ''}
      <div class="cwsub">${esc(a.tool_name)}${impact ? ` · ${esc(impact)}` : ''}${
        a.risk.level === 'high' ? ' · <b style="color:var(--no)">高风险</b>' : ''}</div>
      <div class="dl cdl" data-exp="${a.expires_at}" data-born="${a.created_at}" data-auto="${a.auto_decision}">
        <span class="dltext">—</span><span class="dlbar"><i></i></span>
      </div>
      ${pending.length > 1 ? `<div class="qdots">${pending.slice(0, 6).map((_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</div>` : ''}`;
    meta = `${pending.length > 1 ? '处理完一条自动显示下一条 · ' : ''}<a class="cwmore" href="/ui/a/${a.id}">详情 →</a>`;
  } else if (err) {
    cls = 'is-err'; dotLabel = '出错';
    body = `<div style="font-size:13.5px;color:var(--dim);line-height:1.5">${esc(err.last_message || '会话异常终止')}</div>`;
    meta = esc(dirOf(err));
  } else if (busy.length) {
    cls = 'is-run'; dotLabel = '运行中';
    const s0 = busy[0];
    right = s0.turn_started_at ? `<span class="ctag">${elapsed(s0.turn_started_at)}</span>` : '';
    // sub_state 是从 tool_name 推导的（Thinking / Editing / Running Command…），
    // 不是编的；没有就只说「进行中」，不假装知道细节
    body = `<div class="crun">
      <span class="cf">${esc(dirOf(s0))}${s0.sub_state ? ' · ' + esc(s0.sub_state) : ''}</span>
      <span class="tdots"><i></i><i></i><i></i></span>
    </div>${activityTicker(s0.session_id)}`;
    meta = busy.length > 1 ? `另有 ${busy.length - 1} 个会话在跑` : '';
  } else if (done) {
    cls = 'is-done'; dotLabel = '已完成';
    /**
     * 给一个「知道了」。
     *
     * 60 秒的窗口是为「听见提示音→掏手机→解锁→看一眼」留的，对**没在等**的
     * 人来说太长了：你只是想看一眼用量，却要盯着一条早已读完的完成消息一分钟。
     * 读完了就该能自己把它收掉——时间窗是兜底，不该是唯一的出路。
     */
    right = `<button class="cdismiss" data-done="${esc(done.session_id)}:${done.updated_at}">知道了</button>`;
    body = `<div class="cdone"><div class="ck">✓</div>
      <div class="ct"><b>${esc(dirOf(done))}</b> 已完成${done.last_message ? ' · ' + esc(done.last_message.slice(0, 40)) : ''}</div></div>`;
  } else {
    // 空闲：没有更多要处理的事，用量是此刻唯一值得看的信息
    right = `<span class="ctag">${mine.length} 个会话</span>`;
    body = quotaBody();
    meta = quotaMeta();
  }

  // 窗口到点时主动重画一次。不然要等下一个 30 秒轮询，
  // 「已完成」会多赖 30 秒——用户看到的是它没按说好的时间走
  if (done) {
    const leftMs = DONE_WINDOW - (Date.now() - done.updated_at);
    clearTimeout(doneTimer);
    doneTimer = setTimeout(() => { if (tab === 'home') render(); }, Math.max(500, leftMs + 200));
  }

  // 等待态的主控台**就是那张待办卡片**，所以带上 attachListSwipes 认的标记。
  // 高危给 denyOnly：密集界面里滑一下就批准 rm -rf 太容易了，批准得进详情页。
  // 选择题一律不接手势——滑一下等于「允许」，而允许它只会把问题弹回 Mac 终端
  const askOnly = pending.length && pending[0].choices && pending[0].choices.length;
  // 已经在撤销窗口里的那条不再接手势：它已经被批准了，再滑一次只会
  // 触发第二轮 startUndo（那条路现在会先拆掉上一轮，但界面语义仍然是乱的）
  const undoingNow = pending.length && undoing.has(pending[0].id);
  const swipeAttr = cls.startsWith('is-wait') && pending.length && !askOnly && !undoingNow
    ? ` swipecard" data-ap="${pending[0].id}" data-risk="${esc(pending[0].risk.level)}`
    : '';
  const card = `<div class="console ${cls}${swipeAttr}">
    <div class="ctop"><div class="cleft"><div class="cdot"></div><div class="clabel">${dotLabel}</div></div>${right}</div>
    ${body}
    ${meta ? `<div class="cmeta">${meta}</div>` : ''}
  </div>`;

  // 光球只给运行态：它是这一屏唯一持续动的东西，代表「有事正在发生」。
  // 给了别的状态就退化成装饰，那时它反而在稀释这个信号
  return cls === 'is-run'
    ? `<div class="glow">${card}</div>`
    : card;
}

function elapsed(from) {
  const s = Math.max(0, Math.round((Date.now() - from) / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = (n) => String(n).padStart(2, '0');
  return h ? `${p(h)}:${p(m)}:${p(ss)}` : `${p(m)}:${p(ss)}`;
}

/**
 * 为什么没有新鲜的额度数据。
 *
 * 四种情况，**该做的事完全不同**，所以必须分开说：
 *
 *   no-cc      当前跑的全是别的后端 —— 5h/7d 是 Claude Code 账户的属性
 *   hooks-only hooks 在报，statusLine 一次都没到过
 *   nothing    什么都没收到 —— 服务刚装上，或者 hooks 掉了
 *   no-field   statusLine 在报，但载荷里没有额度字段
 *
 * `hooks-only` 是新加的，也是这次真踩到的：原来这一档跟 `nothing` 合并成
 * 一句「下次新开会话时这里会出现数字」。可如果这个界面根本不调用 statusLine
 * （见下），那句话就是在让人反复做一件永远不会成功的事——他会一直新开会话、
 * 一直等不到，然后以为 Clamicro 坏了。
 *
 * 判据是**观察到的事实**，不是猜的界面类型：hooks 送到了（所以有会话），
 * statusLine 一次都没送到（slSeen 为空）。这两件事同时成立，只可能是
 * 「这个 Claude Code 不调 statusLine」。
 */
function quotaWhy() {
  const anyWindow = sessions.some((s) => capOf(s).quota === 'window');
  if (sessions.length && !anyWindow) return 'no-cc';
  if (!slSeen) return sessions.length ? 'hooks-only' : 'nothing';
  return 'no-field';
}

const QUOTA_WHY_TEXT = {
  'no-cc': '5 小时 / 7 天窗口是 <b>Claude Code 账户</b>的额度。当前没有 Claude Code 会话在跑，所以这里没有数字。',
  'hooks-only': 'hooks 在正常上报（会话状态是活的），但 statusLine <b>一次都没到过</b>。'
    + 'statusLine 是<b>终端状态栏</b>的东西：桌面版和 IDE 插件不画状态栏，也就不会调用它，'
    + '这里不会出现数字。想看额度，在终端里跑 <code>claude</code>。',
  nothing: 'Claude Code 只在会话<b>启动时</b>读取 statusLine，装 Clamicro 之前就开着的会话不会上报。下次新开会话时这里会出现数字。',
  'no-field': '暂无额度数据 —— 已收到上报，但这次没有额度字段',
};

/** 空闲态里的用量两行。没数据就说清为什么没有，而不是留一片空白 */
function quotaBody() {
  if (!quota) {
    return `<div style="font-size:12.5px;color:var(--dim);line-height:1.55">${QUOTA_WHY_TEXT[quotaWhy()]}</div>`;
  }

  /**
   * **刷不出来的旧数据不该当主角。**
   *
   * 这个界面（桌面版 / IDE 插件）不调用 statusLine，所以额度一旦过期就
   * 永远停在那儿。而空闲态的整张卡片以前是两条粗量表 + 一行小字警告——
   * 人先看到的是两个醒目的百分比，「这是 11 小时前的」得读完才知道。
   * 一个看起来确定、其实早已不成立的数字，比没有数字更容易误导。
   *
   * 所以这一档反过来：先说清它是什么（一行），再把旧数字缩成一行细字
   * 放在后面。想看还看得到，但不再是这一屏最抢眼的东西。
   *
   * 只对**刷不出来**的那种过期这么做。普通过期（有 statusLine、只是暂时
   * 没有会话在报）保持原样——那种再开一个会话就刷新了，量表仍然有用。
   */
  const unrefreshable = quotaStale() && quotaWhy() === 'hooks-only';
  if (unrefreshable) {
    const five = Math.round(quota.five_hour?.pct ?? 0);
    const seven = Math.round(quota.seven_day?.pct ?? 0);
    return `<div style="font-size:12.5px;color:var(--dim);line-height:1.6">
      这个界面不调用 statusLine，额度停在 ${esc(ago(quota.at))}前，不会再刷新。<br>
      想看当前额度，在终端里跑 <code>claude</code>。
      <div style="margin-top:7px;opacity:.6">当时是 5h ${five}%　·　7d ${seven}%</div>
    </div>`;
  }

  return `<div class="cusage${quotaStale() ? ' stale' : ''}">
    <div class="uline"><div class="um">${meter('5h', quota.five_hour?.pct)}</div>
      <span class="ur">${resetCell(quota.five_hour)}</span></div>
    <div class="uline u7"><div class="um">${meter('7d', quota.seven_day?.pct)}</div>
      <span class="ur">${resetCell(quota.seven_day)}</span></div>
  </div>`;
}

/**
 * 额度陈旧提示。
 *
 * statusLine 在活跃会话里每次响应都上报，秒级新鲜；超过 10 分钟没动静
 * 就说明没有会话在报——**这时候把旧数字当当前值展示是在骗人**。
 */
function quotaMeta() {
  if (!quota) return '';
  if (Date.now() - quota.at <= 600000) return '';
  /**
   * 「刷不出来」那一档由 quotaBody 自己整段说清了，这里再来一条就是
   * 同一句话说两遍。一屏里重复的警告不会让人更重视，只会让人开始忽略警告。
   */
  if (quotaWhy() === 'hooks-only') return '';
  // 「怎么才能刷新」的答案跟 quotaBody 是同一套判据。原来这里无条件说
  // 「新开一个 Claude Code 会话才会刷新」——对一个根本不调 statusLine 的
  // 界面来说，那是一句让人白忙的话
  const why = quotaWhy();
  const how = why === 'hooks-only'
    ? '这个界面不调用 statusLine，只有终端里的 claude 会刷新它。'
    : why === 'no-cc'
      ? '当前没有 Claude Code 会话在跑。'
      : '新开一个 Claude Code 会话才会刷新。';
  return `⚠️ 这是 ${ago(quota.at)}的旧数据。${how}`;
}

/**
 * 这份用量是不是已经过期了。
 *
 * statusLine 在活跃会话里每次响应都上报，秒级新鲜；超过 10 分钟没动静就说明
 * 没有会话在报。判据和 quotaMeta 同源，不能各判各的。
 */
function quotaStale() {
  return !!quota && Date.now() - quota.at > 600_000;
}

/**
 * 右侧那一格：**新鲜时说「还有多久重置」，过期时说「这是多久以前的数据」。**
 *
 * 不这么分的话会出现一句彻头彻尾的假话：数据是四天前的，resets_at 早就过去了，
 * until() 于是显示「即将重置」——它在说一件马上要发生的事，而真相是那个窗口
 * 几天前就滚过去了，屏幕上那个百分比也早已不是当前值。
 * 拿不准的时候要说「我不知道」，不能说一个听起来确定的错答案。
 */
function resetCell(w) {
  if (quotaStale()) return `${ago(quota.at)}的数据`;
  return until(w?.resets_at);
}

function until(ts) {
  if (!ts) return '';
  const ms = ts * 1000 - Date.now();
  if (ms <= 0) return '即将重置';
  const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return h >= 24 ? `${Math.floor(h / 24)} 天后重置` : h ? `${h} 小时 ${m} 分后重置` : `${m} 分后重置`;
}

function ago(ts) {
  if (!ts) return '未知';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return `${s} 秒前`;
  if (s < 3600) return `${Math.round(s / 60)} 分钟前`;
  if (s < 86400) return `${Math.round(s / 3600)} 小时前`;
  // 到小时就封顶的话，四天前的数据会写成「96 小时前」——那个数字要在脑子里
  // 除一下才知道有多久，而这一行的全部作用就是让人一眼判断「还能不能信」
  return `${Math.round(s / 86400)} 天前`;
}

const dirOf = (s) => (s.cwd || '').split('/').filter(Boolean).pop() || s.session_id.slice(0, 8);

/**
 * 路径行：左边「你在哪」，右边「连得上吗」。
 *
 * 第一段用**当前正在跑的那个项目**，不是写死的产品名——你打开这一屏
 * 十有八九是想知道某个项目怎么样了，那它就该出现在最上面一行。没有活跃
 * 会话时才退回产品名。
 *
 * 光标的三档由 offlineSince 决定，和主控台的离线判定同源：
 * 抖一下（EventSource 自己会重连）显示「重连中」，超过 5 秒才算真断。
 * 两处不能各判各的，否则会出现光标说断了、卡片说好着的自相矛盾。
 */
function renderPathBar() {
  const bar = $('pathbar');
  if (!bar) return;
  const busy = sessions.find((x) => x.state === 'Running' || x.state === 'Waiting Approval');
  const active = busy || sessions.find((x) => x.state !== 'Idle') || sessions[0];
  $('pseg').textContent = (active && dirOf(active)) || 'clamicro';
  $('pseg2').textContent = { home: 'overview', sess: 'sessions', say: 'message' }[tab];

  const off = offlineSince !== null && Date.now() - offlineSince > 5000;
  const retry = offlineSince !== null && !off;
  bar.classList.toggle('is-off', off);
  bar.classList.toggle('is-retry', retry);
  $('conn').textContent = off ? '已断开' : retry ? '重连中' : '本地连接';
}

/**
 * 引导的收尾：测试完成横幅 + 加到主屏幕。
 *
 * 两张卡都**只在引导刚走完那一次**出现。放在这里而不是配对页，是因为
 * 「加到主屏幕」问的是「以后怎么再打开它」——人得先经历过一次真正的审批、
 * 知道这东西有什么用，那个问题才成立。配对页上问，等于向一个还不知道
 * 自己在装什么的人推销。
 */
/**
 * 引导卡片的行为。必须在每次 render 之后重新接——innerHTML 一换，
 * 上一批 DOM 连同它们的监听器就都没了。
 */
/**
 * 「加到主屏幕」的底部弹层。
 *
 * ## 为什么是弹层，不是首页里的一张卡
 *
 * 它是**一次性的建议**，不属于首页的常驻内容。做成内联卡片的话，它会把主控台
 * 和待审批往下挤，而这个建议任何时候都没有它们重要；弹层浮在上面，关掉之后
 * 首页一个像素都没变过。
 *
 * ## 为什么在 render 之外
 *
 * 首页每来一条 SSE 事件就整块重画。跟着 render 走的话，弹层会**每次重新挂载**、
 * 升起动画一遍遍重放，看着像在抽搐。所以它只挂一次，直接挂在 body 上，
 * `$('view').innerHTML = h` 碰不到它。
 */
/* iOS 的分享键：一个开口向上的托盘，加一支往外的箭头。
   用内联 SVG 而不是 emoji——emoji 的字形随系统版本变，而这里要的是
   「跟你屏幕上那个键长得一样」 */
const SHARE_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 3.5v11"/><path d="M8.2 7.3 12 3.5l3.8 3.8"/>
  <path d="M7 11H5.6A1.6 1.6 0 0 0 4 12.6v6.8A1.6 1.6 0 0 0 5.6 21h12.8a1.6 1.6 0 0 0 1.6-1.6v-6.8A1.6 1.6 0 0 0 18.4 11H17"/>
</svg>`;

/* 加号：第二步「添加到主屏幕」那一项 */
const PLUS_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;

/* Android/桌面 Chrome 是右上角的三点菜单 */
const MENU_SVG = `<svg viewBox="0 0 24 24" fill="currentColor">
  <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>
</svg>`;

function maybeShowA2HS() {
  if (document.getElementById('a2hs')) return; // 已经挂过了

  /**
   * 有待审批时**不弹**，等它处理完再说。
   *
   * 这是一个会盖住半屏、带遮罩的模态层，而屏幕上可能正躺着一条要你决定的
   * 高危操作。「以后怎么再打开这个页面」在任何时候都没有它重要。
   *
   * 必须在**消费 ccm-demo 之前**就返回——否则标记被用掉，等审批处理完就
   * 再也不会弹了。maybeShowA2HS 每次 render 都会调，所以推迟不会丢。
   */
  if (pending.length) return;

  let ok = false;
  try {
    // ccm-demo：刚走完引导的演示审批。弹层只在那一次之后出现
    if (localStorage.getItem('ccm-demo') !== '1') return;
    // 已经是从主屏幕图标打开的就永远不提示——它已经装好了
    const standalone = matchMedia('(display-mode: standalone)').matches
      || navigator.standalone === true;
    ok = !standalone && localStorage.getItem('ccm-a2hs-dismissed') !== '1';
    // 无论弹不弹，这个标记都用掉：它标的是「刚做完演示」，那件事已经过去了
    localStorage.removeItem('ccm-demo');
  } catch { return; /* 隐私模式：不弹，不影响主功能 */ }
  if (!ok) return;

  const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // 图标记住的是你当时打开的那个地址，用 IP 加的话路由器重新分配之后就打不开了
  const warn = location.hostname.endsWith('.local') ? ''
    : `<div class="sub" style="margin-top:8px">你现在用的是 IP 地址。图标会记住它，
       而路由器重新分配 IP 之后那个图标就打不开了——换成 <b>.local</b> 那个地址再添加更稳。</div>`;
  // 箭头只在 iOS 出现：那里分享键确实在屏幕最下方，指下去才是对的。
  // Android 的菜单在右上角，一个向下的箭头会把人指到错的地方
  // 步骤里的图标和上面那个大图标必须是**同一个字形**：同一个键画成两种样子
  // （一个蓝底 emoji、一个描边 SVG）会让人以为是两个不同的按钮
  const how = iOS
    ? `<div class="step"><span class="num">1</span><span class="ic">${SHARE_SVG}</span>点底部的分享按钮</div>
       <div class="step"><span class="num">2</span><span class="ic">${PLUS_SVG}</span>选「添加到主屏幕」</div>`
    : `<div class="step"><span class="num">1</span><span class="ic">${MENU_SVG}</span>打开浏览器菜单</div>
       <div class="step"><span class="num">2</span><span class="ic">${PLUS_SVG}</span>选「添加到主屏幕」或「安装应用」</div>`;

  const scrim = document.createElement('div');
  scrim.className = 'a2hs-scrim';
  const sheet = document.createElement('div');
  sheet.className = 'a2hs';
  sheet.id = 'a2hs';
  sheet.setAttribute('role', 'dialog');
  sheet.setAttribute('aria-label', '加到主屏幕');
  sheet.innerHTML = `
    <div class="grip"></div>
    <button class="close" id="a2hsX" aria-label="关闭">✕</button>
    <div class="icon-row">
      <div class="appicon" aria-hidden="true">${iOS ? SHARE_SVG : MENU_SVG}</div>
      <div><h2>加到主屏幕</h2>
        <div class="sub">像打开一个 App 一样打开它，不用每次找网址</div></div>
    </div>
    ${warn}
    <div class="steps">${how}</div>
    ${iOS ? `<div class="point"><div class="arrow">↓</div>
      <div class="pt">就是屏幕最下面那个按钮</div></div>` : ''}
    <button class="install hidden" id="a2hsGo">添加到主屏幕</button>`;

  const close = () => {
    try { localStorage.setItem('ccm-a2hs-dismissed', '1'); } catch {}
    scrim.remove();
    sheet.remove();
  };
  // 三条路都能关掉：✕、点遮罩、Esc。少给一条就会有人被困在弹层里
  sheet.querySelector('#a2hsX').onclick = close;
  scrim.onclick = close;
  document.addEventListener('keydown', function esc(e) {
    if (e.key !== 'Escape') return;
    document.removeEventListener('keydown', esc);
    close();
  });

  // Android/Chrome 能直接弹系统安装框；iOS 没有这个事件，只能给操作说明。
  // 事件可能在弹层挂上来之前就发过了，所以在 window 上存一份
  const go = sheet.querySelector('#a2hsGo');
  if (window.__ccmInstallPrompt) go.classList.remove('hidden');
  go.onclick = async () => {
    const p = window.__ccmInstallPrompt;
    if (!p) return;
    go.classList.add('hidden');
    p.prompt();
    await p.userChoice;
    window.__ccmInstallPrompt = null;
    close();
  };

  document.body.append(scrim, sheet);
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  window.__ccmInstallPrompt = e;
  const go = document.getElementById('a2hsGo');
  if (go) go.classList.remove('hidden');
});

function renderHome() {
  const busy = sessions.filter((s) => s.state === 'Running' || s.state === 'Waiting Approval');
  const off = offlineSince !== null && Date.now() - offlineSince > 5000;
  const mixed = agentKinds().size > 1;

  let h = '';

  /**
   * 主数据拉不到时，这条排在最前面，而且**先于**下面那条 SSE 断线提示。
   *
   * 两者是不同的故障：SSE 断了说明推送不通，轮询可能还活着；这条说明
   * 连轮询都拿不到东西，页面上一个数字都不可信。
   *
   * 一定要有这块，不能靠「反正列表会是空的」——空列表和「拿不到数据」
   * 在屏幕上长得一模一样，而它们该做的事完全不同。
   */
  /**
   * 断线**不在这里出卡片**。
   *
   * 这里原来有两张（「拉取状态失败」和「与服务失去连接」），加上主控台
   * 自己的「连接已断开」，一屏三张卡说同一件事，三次都让你去 Mac 上扫码。
   * 重复不会让信息更清楚，只会让人觉得这页面没做完；而真正该做的动作
   * （再连一次）一次都没出现。
   *
   * 现在统一由 statusConsole 的断线态承载，那里带重连按钮和自动重试。
   */

  // Mac 本地通知是**唯一**的提醒通道，关掉就是彻底静默——而这件事你是
  // 看不出来的：界面一切正常，只是再也不会有东西叫你，高风险操作全都
  // 静静等到超时被拒。必须在首页明说。
  // 可以手动关掉这条横幅——故意关的人每次进来被念一遍就是纯噪音；
  // 但状态一变（关了又开又关）就重新出现，因为那可能是一次新的失手。
  if (cfg && !cfg.macNotify) {
    const sig = 'notify-off';
    if (localStorage.getItem('ccm-dismissed') !== sig) {
      h += `<div class="card alert notice" data-sig="${sig}">
        <button class="x" aria-label="关闭">×</button>
        <a href="/ui/settings" style="display:block;color:inherit;text-decoration:none">
          <div class="top"><span class="name">🔕 提醒已全部关闭</span></div>
          <div class="path" style="white-space:normal">现在没有任何东西会通知你。高风险操作会一直等到超时被自动拒绝。点此开启</div>
        </a>
      </div>`;
    }
  }

  h += autoDenyBanner();

  // 主控台先于列表：它是「现在什么情况」的答案，列表是「都有哪些」的明细。
  // 明细排在结论前面，人得先读完才知道该不该关心
  /**
   * 多后端时**按模型分区**：每个模型一个标题，下面是它自己的状态卡。
   *
   * ## 为什么比原来的「一张主控台 + 一条状态条」好
   *
   * 原来信息被劈成两半：主控台只显示**最忙的那一个**会话（跨后端挑出来的），
   * 状态条只显示每个后端的**计数**。想知道「DSH 现在在干什么」得在两处拼，
   * 而且主控台那张卡到底属于谁，脸上并不写。
   *
   * 分区之后每个模型的状态是自足的：名字下面就是它的进度、履历、用量。
   *
   * 待审批为什么不进分区，见 statusConsole 里的注释。
   *
   * 单后端时不分区——那时标题只会把顶栏已经说过的话再说一遍。
   */
  const kinds = [...agentKinds()];
  if (kinds.length > 1) {
    for (const k of kinds) {
      const cap = cfg?.agents?.[k] ?? {};
      const mine = sessions.filter((s) => (s.agent || 'claude-code') === k);
      const use = agentUsage(k, cap, mine);
      h += `<div class="agroup">
        <div class="ahead">
          <span class="an">${agentLogo(k)}${esc(cap.label || k)}</span>
          ${use ? `<span class="au${use.stale ? ' stale' : ''}">${use.html}</span>` : ''}
        </div>
        ${statusConsole(k)}
      </div>`;
    }
  } else {
    h += statusConsole();
  }

  /**
   * 列表必须列全。
   *
   * 上一版为了去重把主控台展示的那条从列表里摘掉了——结果**只有一条待审批
   * 时列表整个空掉**，而主控台既不能滑也没有链接、`.dl` 元素为 0 所以
   * tickDeadlines 无事可做，倒计时看起来是冻住的。一条待审批恰恰是最常见
   * 的情况，于是最常见的情况成了死路。
   *
   * 去重要去掉的是**重复的读数**，不是能操作的那一份。所以改成主控台那边
   * 收敛（见 is-wait 分支：只报「有几条在等」，不复述标题和倒计时），
   * 操作和明细都留在列表里。
   */
  /**
   * 主控台展示的那条不在列表里再画一遍——**前提是它现在真的能操作**：
   * 带 swipecard 接了手势、带 .dl 每秒在走、带「详情 →」。上一版摘掉它时
   * 这三件都没有，于是一条待审批时整屏没有任何可操作的东西。
   * 判据和 statusConsole 的分支同源：离线时主控台让位给离线提示，那条
   * 并没有被展示，列表就得列全。
   */
  const inConsole = !off && pending.length ? pending[0].id : null;
  const rest = pending.filter((a) => a.id !== inConsole);

  if (rest.length) {
    h += `<h2>${inConsole ? `还有 ${rest.length} 条待审批` : '待审批'}</h2>` + rest.map((a) => undoing.has(a.id) ? `
      <div class="undoline">
        <span>已批准 · <b id="undo-${a.id}">3</b> 秒后执行</span>
        <button onclick="cancelUndo('${a.id}')">撤销</button>
      </div>` : `
      <!-- 选择题不接手势：这里滑一下就是「允许」，而允许 AskUserQuestion
           等于把问题弹回 Mac 终端，手机白看一场。只能点进去回答。 -->
      <div class="card alert${a.choices && a.choices.length ? '' : ' swipecard'}" data-ap="${a.id}" data-risk="${esc(a.risk.level)}">
        <div class="top">
          <span class="name">${a.choices && a.choices.length ? '💬 ' : a.risk.level === 'high' ? '⚠️ ' : '🔐 '}${esc(a.session_name || (a.cwd||'').split('/').filter(Boolean).pop() || '')}</span>
          <span class="state" style="color:var(--warn)">${a.choices && a.choices.length ? '待回答' : esc(a.tool_name)}</span>
        </div>
        <div class="head">${esc(a.headline || a.summary)}</div>
        ${a.mismatch ? `<div class="mismatch">⚠️ 这句描述与命令不符，点进去看原文</div>` : ''}
        <div class="chips">${mixed && a.agent_label ? `<span class="chip agent">${agentLogo(a.agent)}${esc(a.agent_label)}</span>` : ''}${(a.impact||[]).map((i) => `<span class="chip ${i.tone==='danger'?'danger':i.tone==='calm'?'':'warn'}">${esc(i.label)}</span>`).join('')}
          <a class="chip" href="/ui/a/${a.id}" style="color:var(--run)">${a.choices && a.choices.length ? '去回答 ›' : a.risk.level === 'high' ? '需详情页批准 ›' : '详情 ›'}</a>
        </div>
        <div class="dl" data-exp="${a.expires_at}" data-born="${a.created_at}" data-auto="${a.auto_decision}">
          <span class="dlbar"><i></i></span><span class="dltext">—</span>
        </div>
      </div>`).join('');
  }

  renderTopUsage();

  $('view').innerHTML = h;

  // （履历原来是横向跑马灯，这里负责「放不下才滚」的判定。改成竖排后
  //   不需要测量了——卡片自己长高，见 activityTicker。）

  // 关掉的是**这一批**（按最新一条的时间戳记），再有新的还会出现。
  // 一关永久静音就又变成了「悄悄替你决定」。
  const ad = $('view').querySelector('.autodeny');
  if (ad) ad.querySelector('.ax').onclick = () => {
    localStorage.setItem('ccm-ad-seen', ad.dataset.seen);
    ad.remove();
  };
}

/**
 * 某个会话所属后端的能力。
 *
 * 能力表由服务端下发（/api/config 的 agents），网页不硬编码后端名——
 * 网页是缓存得最久的一层，硬编码会导致「服务端已经支持了，手机上还是灰的」。
 *
 * cfg 还没到、或者后端不认识时落回 claude-code：这是升级期唯一安全的假设，
 * 老会话不带 agent 字段，落回空能力会让暂停按钮凭空消失一次。
 */
function capOf(s) {
  const table = cfg?.agents;
  if (!table) return { label: null, approve: true, pause: true, cancel: true, inbox: true, quota: 'window' };
  return table[s?.agent] ?? table['claude-code'];
}

/** token 数写全了太长（1234567），手机上一眼读不出量级。折成 k/M */
function fmtTokens(n) {
  if (!Number.isFinite(n) || n <= 0) return '';
  if (n < 1000) return String(n);
  if (n < 1_000_000) return (n / 1000).toFixed(n < 10_000 ? 1 : 0) + 'k';
  return (n / 1_000_000).toFixed(1) + 'M';
}

/** 现在有几种后端在跑。只有一种时不显示后端标签——没有对比就不需要区分 */
/**
 * 现在有哪些后端，**按「谁先连上」排好序**。
 *
 * 顺序必须稳定。原来是从 sessions 数组推的，而那个数组按 updated_at 倒序
 * ——谁刚有动静谁就窜到第一个，于是首页的模型分区每来一个事件就换一次位置。
 * 你想看的那个模型每次都在不同的地方，得重新找。**位置本身是一种记忆**，
 * 不该被活跃度改写。
 *
 * 排序键取服务端的首次上报时间（agentsFirstSeen）。没有记录的排最后，
 * 同时间的按名字排——保证任何情况下都是确定序，不会出现两次渲染不一样。
 */
function agentKinds() {
  const ks = new Set(sessions.map((s) => s.agent || 'claude-code'));
  // 会话都结束了但后端还在上报，它仍然该出现在列表里
  for (const k of Object.keys(agentsSeen || {})) ks.add(k);
  const first = (k) => agentsFirstSeen?.[k] ?? Number.MAX_SAFE_INTEGER;
  return new Set([...ks].sort((a, b) => first(a) - first(b) || a.localeCompare(b)));
}

/** 后端多久没动静了就算「掉线」。跟额度那条 10 分钟同源，判据只能有一处 */
const AGENT_STALE_MS = 600_000;

/**
 * 一个后端的用量，放在状态条那一行下面。
 *
 * ## 为什么按后端分开而不是并成一个数
 *
 * 它们根本不是同一种量：Claude Code 是**滚动窗口配额**（5h / 7d，用完就得等
 * 窗口滚过去），DSH 是**累计 token**（按 API key 计费，没有窗口概念）。
 * 硬凑成一个数字要么得编一个汇率，要么得挑一个丢掉另一个——两条都是在骗人。
 *
 * 放进状态条还顺带修了一个位置问题：5h/7d 是 **Claude Code 账户**的属性，
 * 原来摆在通栏的额度块里，看着像是全局的。挂到它自己那一行，归属就清楚了。
 *
 * @returns {{html, stale}|null} null = 这个后端没有可说的用量
 */
function agentUsage(kind, cap, mine) {
  if (cap.quota === 'tokens') {
    // 累计 token。**不换算成金额**——那要一张会悄悄过期的价目表
    const total = mine.reduce((n, s) => n + (Number(s.tokens) || 0), 0);
    if (total) return { html: `${esc(fmtTokens(total))} tok`, stale: false };

    /**
     * 没有数字时，「还没轮完」和「这个适配器压根不报用量」要分开说。
     *
     * 都显示成空白的话，用户会一直等一个永远不会出现的数字——这跟额度那边
     * 「反复新开会话却等不到 statusLine」是同一个坑。usage_reported 是
     * 桥接侧在 turn/end 显式给的布尔：字段缺席有两种读法，布尔只有一种。
     */
    const done = mine.filter((s) => s.usage_reported !== null);
    if (done.length && done.every((s) => s.usage_reported === false)) {
      return { html: '该后端不上报用量', stale: false };
    }
    return null; // 还没跑完一轮，不知道 —— 那就先什么都不说
  }

  if (cap.quota !== 'window') return null;

  /**
   * 窗口配额是**账户级**的，不属于某一个会话，所以取 store 的 accountLimits
   * 而不是从 mine 里凑。
   *
   * 拿不到数字时说清是哪一种「没有」——它们该做的事完全不同：
   *   · statusLine 从没到过 → 这个界面不调它（桌面版/IDE 不画状态栏）
   *   · 到过但没带额度字段 → 上报在跑，只是这次没有
   */
  if (!quota) {
    const why = quotaWhy();
    return {
      html: why === 'hooks-only' ? '额度只有终端里的 claude 会上报' : '暂无额度数据',
      stale: true,
    };
  }
  const five = Math.round(quota.five_hour?.pct ?? 0);
  const seven = Math.round(quota.seven_day?.pct ?? 0);
  return { html: `5h ${five}%　·　7d ${seven}%`, stale: quotaStale() };
}


function renderSessions() {
  if (!sessions.length) {
    // 只提示**本机装了的**后端。把没装的也列出来等于教人去开一个开不了的会话
    const names = (cfg?.detectedAgents ?? []).map((k) => cfg?.agents?.[k]?.label).filter(Boolean);
    const hint = names.length ? `新开一个 ${names.join(' 或 ')} 会话即可` : '新开一个会话即可';
    $('view').innerHTML = `<div class="empty"><b>暂无活跃会话</b>${esc(hint)}</div>`;
    return;
  }
  const kinds = [...agentKinds()];
  const mixed = kinds.length > 1;

  /**
   * 筛选是**视图**，不是模式。
   *
   * 「切到某个后端」和「临时只看某个后端」听起来差不多，实际差别很大：
   * 前者是一个你会忘记自己身处其中的状态——另一边有事发生时你不会知道；
   * 后者始终有个「全部」摆在旁边，而且下面会明说被藏起来了几个。
   *
   * 待审批**永远不受它影响**（见 renderHome：审批列表在筛选之前就画完了）。
   * 审批有倒计时，被筛掉一条等于一次静默的自动决策——这是这个产品
   * 最不能出的错，所以筛选的作用域严格限制在「会话列表」这一块。
   *
   * 不持久化：下次进来一律是「全部」。一个记住了的筛选就退化成了模式。
   */
  const filtered = agentFilter ? sessions.filter((s) => (s.agent || 'claude-code') === agentFilter) : sessions;
  const hiddenCount = sessions.length - filtered.length;

  const chips = mixed
    ? `<div class="afilter">
        <button data-af="" class="${agentFilter ? '' : 'on'}">全部 ${sessions.length}</button>
        ${kinds.map((k) => {
          const n = sessions.filter((s) => (s.agent || 'claude-code') === k).length;
          const label = cfg?.agents?.[k]?.label || k;
          return `<button data-af="${esc(k)}" class="${agentFilter === k ? 'on' : ''}">${agentLogo(k)}${esc(label)} ${n}</button>`;
        }).join('')}
      </div>`
    : '';

  $('view').innerHTML = chips + filtered.map((s) => {
    const cap = capOf(s);
    // ctx 量表只对有上下文窗口读数的后端有意义。没有就整条不画，
    // 而不是画一条 0% —— 0% 是一个读数，「没有读数」不是 0%
    const c = cap.quota === 'window' ? s.context : null;
    return `<a class="card" href="/ui/s/${s.session_id}" style="margin-top:14px">
      <div class="top">
        <span class="name">${esc(s.session_name || dirOf(s))}</span>
        <span class="state ${esc(s.state).replace(/\s/g,'-')}">${esc(s.state)}${s.sub_state ? ' · ' + esc(s.sub_state) : ''}</span>
      </div>
      <div class="path">${esc(s.cwd || '')}</div>
      ${c ? `<div class="meters">${meter('ctx', c.used_pct)}</div>` : ''}
      <div class="chips">
        ${mixed && cap.label ? `<span class="chip agent">${agentLogo(s.agent)}${esc(cap.label)}</span>` : ''}
        ${s.model ? `<span class="chip">${esc(s.model)}</span>` : ''}
        ${s.cost_usd != null ? `<span class="chip">$${s.cost_usd.toFixed(4)}</span>` : ''}
        ${cap.quota === 'tokens' && s.tokens ? `<span class="chip">${fmtTokens(s.tokens)} tok</span>` : ''}
        <span class="chip" style="color:var(--run)">时间线 ›</span>
      </div>
    </a>`;
  }).join('') + (hiddenCount
    // 被藏起来的必须说出来。一个安静收窄的列表和一个「就这么多」的列表
    // 长得一模一样——那正是筛选最容易骗到人的地方
    ? `<div class="ahidden">另有 ${hiddenCount} 个会话被筛选隐藏了</div>`
    : '');

  for (const b of document.querySelectorAll('.afilter button')) {
    b.onclick = () => { agentFilter = b.dataset.af || null; render(); };
  }
}

/* ── 列表内快捷滑动 ──
   与审批页共用 ui/swipe.js。批准同样给 3 秒撤销窗口——手势比按钮容易误触发，
   而这里卡片更小、更密集，误触发概率只高不低。 */
const undoing = new Map();

async function submit(id, decision) {
  try {
    await fetch(`/api/approvals/${id}/decide`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision }),
    });
  } catch { /* 下一次轮询/SSE 会纠正 */ }
  refresh();
}

function cancelUndo(id) {
  const u = undoing.get(id);
  if (!u) return;
  clearInterval(u.tick); clearTimeout(u.timer);
  undoing.delete(id);
  render();
}

function startUndo(id) {
  /**
   * 同一条审批再次进入撤销窗口时，**必须先把上一轮拆干净**。
   *
   * 原来是直接 `undoing.set(id, {tick, timer})` 覆盖，旧的两个句柄就此失联：
   *   · 旧 setTimeout 3 秒后照样触发 → 同一条审批 submit 两次 allow
   *   · 旧 setInterval 永远没人 clear → 每秒空转到页面关闭
   *
   * 覆盖 Map 里的值不等于取消定时器。这类「看起来替换了、其实是多了一份」
   * 的 bug 不会报错，只会在某些时序下多发一次请求——而这里多发的那次
   * 是一个**批准**。
   */
  const prev = undoing.get(id);
  if (prev) { clearInterval(prev.tick); clearTimeout(prev.timer); }

  let n = 3;
  const tick = setInterval(() => {
    n--;
    const el = document.getElementById(`undo-${id}`);
    if (el) el.textContent = Math.max(0, n);
  }, 1000);
  const timer = setTimeout(() => {
    clearInterval(tick);
    undoing.delete(id);
    submit(id, 'allow');
  }, 3000);
  undoing.set(id, { tick, timer });
  render();
}

/** 只刷倒计时。整页重绘会重建 DOM，把滑动手势的绑定一起弄丢。 */
function tickDeadlines() {
  // 「N 秒后自动重试」得每秒走一格。不走的话人会以为它卡住了，
  // 于是去按重连——而那正是我们想让他不必做的事
  const auto = document.getElementById('oauto');
  if (auto) auto.textContent = autoRetryHint();

  for (const el of document.querySelectorAll('.dl')) {
    const exp = +el.dataset.exp, born = +el.dataset.born;
    const auto = el.dataset.auto === 'allow';
    // 钳在 [0, 总时长]：exp 是 **Mac 的**时钟，Date.now() 是**手机的**。
    // 两边差几毫秒，left 就会超过总时长，进度条算出 >100%、读数也会多跳一档。
    // 详见 approval.html 里 tick() 的同一处注释
    const left = Math.max(0, Math.min(exp - born, exp - Date.now()));
    const s = Math.ceil(left / 1000);
    const mmss = s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : `${s}s`;
    el.querySelector('.dlbar i').style.width = (left / (exp - born)) * 100 + '%';
    el.querySelector('.dltext').textContent = `${mmss} 后${auto ? '自动通过' : '自动拒绝'}`;
    el.classList.toggle('auto', auto);
    el.classList.toggle('warn', !auto && left <= 60000);
  }
}

function attachListSwipes() {
  for (const card of document.querySelectorAll('.swipecard')) {
    const id = card.dataset.ap;
    attachSwipe(card, {
      // 列表是「快速分诊」的地方：例行操作放行、可疑的拒掉。
      // 但在密集滚动的列表里滑一下就批准 rm -rf 太容易了——高危只能拒绝，
      // 要批准必须点进详情页看清楚。
      mode: card.dataset.risk === 'high' ? 'denyOnly' : 'normal',
      ignore: 'a, button',
      onCommit: (dir) => (dir === 'deny' ? submit(id, 'deny') : startUndo(id)),
    });
  }
}

let sayTarget = null, draft = '';

function renderSay() {
  /**
   * 只列**能收消息**的会话。
   *
   * 注入靠的是 Stop hook 返回 decision:block，那是 Claude Code 的特有原语
   * （见 src/routes/hooks.mjs）。别的后端没有等价物，列出来只会让人打完字
   * 点了发送、然后永远等不到——发出去的消息比灰掉的按钮更像成功。
   */
  const sendable = sessions.filter((s) => capOf(s).inbox);
  const live = sendable.filter((s) => s.state !== 'Done');
  const pool = live.length ? live : sendable;
  if (!pool.length) {
    // 有会话但都不支持接收，跟一个会话都没有是两回事，得分开说
    const blocked = sessions.length - sendable.length;
    $('view').innerHTML = blocked
      ? `<div class="empty"><b>没有会话可发送</b>当前 ${blocked} 个会话所属的后端不支持从手机注入消息</div>`
      : '<div class="empty"><b>没有会话可发送</b>先在 Mac 上开一个会话</div>';
    return;
  }
  if (!pool.find((s) => s.session_id === sayTarget)) sayTarget = pool[0].session_id;
  const target = pool.find((s) => s.session_id === sayTarget);
  const q = (inbox[sayTarget] || []);

  $('view').innerHTML = `
    <h2>发给哪个会话</h2>
    <div class="pick">${pool.map((s) => `
      <button data-sid="${s.session_id}" class="${s.session_id === sayTarget ? 'on' : ''}">${esc(s.session_name || dirOf(s))}</button>`).join('')}
    </div>
    <textarea id="draft" placeholder="想让它改做什么？&#10;例如：先别动数据库，改成只读一遍现有 schema">${esc(draft)}</textarea>
    <button class="send" id="sendBtn">加入队列</button>
    <!-- 发送失败时说清原因，且草稿不清空。见 sendBtn 的 onclick -->
    <div class="sayerr hidden" id="sayerr"></div>
    <div class="note">
      消息不会立刻送达。hooks 是单向的，唯一的注入点是「这一轮结束时」——
      所以它会在 <b>${esc(target.session_name || dirOf(target))}</b> 跑完当前这一轮后进入对话。
      ${target.state === 'Done' || target.state === 'Idle'
        ? '<br><br>⚠️ 这个会话现在是空闲的，已经停过了。消息要等到你在终端里再发起一轮、那一轮结束时才会送达。'
        : ''}
    </div>
    ${q.length ? `<h2>队列中（${q.length}）</h2>` + q.map((m) => `
      <div class="qitem"><p>${esc(m.text)}</p><button data-del="${m.id}">删除</button></div>`).join('') : ''}
  `;

  for (const b of document.querySelectorAll('.pick button')) {
    b.onclick = () => { sayTarget = b.dataset.sid; render(); };
  }
  $('draft').oninput = (e) => { draft = e.target.value; };
  $('sendBtn').onclick = async () => {
    const text = $('draft').value.trim();
    if (!text) return;
    $('sendBtn').disabled = true;
    /**
     * **只有真的排上队了才清空草稿。**
     *
     * 原来无论成败都 `draft = ''`：网络断了、服务重启了、队列满了——
     * 用户刚打完的一段话直接消失，界面上没有任何痕迹，他只会以为发出去了，
     * 然后等一个永远不来的回应。手机上重打一遍的代价还特别高。
     */
    let ok = false, hint = '';
    try {
      const r = await fetch(`/api/sessions/${sayTarget}/say`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      ok = r.ok;
      if (!ok) hint = (await r.json().catch(() => ({}))).hint || '没能加入队列，再试一次。';
    } catch {
      hint = '发不出去 —— 和 Mac 的连接断了。你打的字还留着。';
    }
    $('sendBtn').disabled = false;
    if (ok) { draft = ''; await refresh(); return; }
    // 草稿原样留着，把原因说清楚
    const note = document.getElementById('sayerr');
    if (note) { note.textContent = hint; note.classList.remove('hidden'); }
  };
  for (const b of document.querySelectorAll('[data-del]')) {
    b.onclick = async () => {
      await fetch(`/api/sessions/${sayTarget}/say/${b.dataset.del}`, { method: 'DELETE' }).catch(() => {});
      await refresh();
    };
  }
}

function render() {
  // 首页标题用产品名而不是「概览」：这是你打开时看到的第一个词，
  // 「概览」描述的是这一屏的功能，而你已经在看这一屏了——它不提供信息。
  $('title').textContent = { home: 'Clamicro', sess: '会话', say: '发消息' }[tab];
  renderPathBar();
  for (const b of document.querySelectorAll('nav button')) b.classList.toggle('on', b.dataset.tab === tab);
  $('badge').textContent = pending.length;
  $('badge').classList.toggle('hidden', !pending.length);
  const qn = Object.values(inbox).reduce((a, v) => a + v.length, 0);
  $('qbadge').textContent = qn;
  $('qbadge').classList.toggle('hidden', !qn);
  try {
    ;({ home: renderHome, sess: renderSessions, say: renderSay }[tab])();
  } catch (err) {
    // 渲染抛异常时，$('view') 会保留上一个 tab 的内容——界面看起来
    // 「首页高亮却显示着发消息的内容」，极难排查。宁可显式报错。
    $('view').innerHTML = `<div class="empty"><b>页面渲染出错</b>${String(err && err.message || err)}</div>`;
    console.error(err);
  }
  if (tab === 'home') { attachListSwipes(); tickDeadlines(); maybeShowA2HS(); }

  // 重连按钮。断线态每次重绘都会重建这个节点，所以必须在这里重新绑
  const rb = document.getElementById('oretry');
  if (rb) rb.onclick = () => {
    // 立刻给反馈：断线时点一个没反应的按钮，人会以为连按钮也坏了
    rb.disabled = true; rb.textContent = '连接中…';
    reconnect(true);
  };
  for (const b of document.querySelectorAll('.cdismiss')) {
    b.onclick = (e) => {
      e.stopPropagation();
      dismissedDone.add(b.dataset.done);
      render();
    };
  }
  for (const b of document.querySelectorAll('.notice .x')) {
    b.onclick = (e) => {
      e.preventDefault();
      localStorage.setItem('ccm-dismissed', b.closest('.notice').dataset.sig);
      render();
    };
  }
}

for (const b of document.querySelectorAll('nav button')) {
  b.onclick = () => {
    tab = b.dataset.tab;
    sessionStorage.setItem('ccm-tab', tab);
    $('view').scrollTop = 0;
    render();
  };
}

/**
 * 拉一条接口。失败**不抛**，返回 null 由调用方决定怎么降级。
 *
 * 单独写出来是因为原来四条挤在一个 Promise.all 里：任何一条失败整个
 * reject，`render()` 那行就永远不执行——页面停在初始的空 HTML 上，
 * 而且因为是未处理的 promise rejection，手机浏览器上**一个字都不会显示**。
 * 表现就是：顶栏、路径条、底部导航都在，中间一片全空，看起来像功能没做完。
 *
 * render() 自己那个 try/catch 挡不住这种情况——异常发生在它被调用之前。
 */
async function fetchJson(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) return null;
    return await r.json();
  } catch {
    return null; // 网络失败、响应不是 JSON（比如换了 IP 打到别的服务上）
  }
}

async function refresh() {
  const [s, a, c, i] = await Promise.all([
    fetchJson('/api/sessions'),
    fetchJson('/api/approvals'),
    fetchJson('/api/config'),
    fetchJson('/api/inbox'),
  ]);

  /**
   * 会话是主数据，它拉不到就等于什么都不知道——这时候**必须显式说出来**，
   * 不能拿上一轮的旧数据接着画（那是在展示一个已经不成立的世界），
   * 也不能留白（那看起来像功能缺失，而不是连接问题）。
   *
   * 另外三条是补充信息，缺了就按空的走，页面照常能用。
   */
  fetchFailed = !s;
  if (s) {
    sessions = s.sessions ?? [];
    quota = s.limits;
    slSeen = s.statusLineSeenAt;
    agentsSeen = s.agentsSeen || {};
    agentsFirstSeen = s.agentsFirstSeen || {};
  }
  if (a) { pending = a.approvals ?? []; recentlyExpired = a.recentlyExpired || []; }
  if (c) {
    cfg = c;
    /**
     * 趁连得上的时候把服务报的所有地址存下来。
     *
     * 断线最常见的原因是 Mac 换了 IP——那种情况**重连按钮救不了**，
     * 地址本身就错了。存一份，断线时就能直接给出「试试另一个地址」，
     * 人拿着手机就能点过去，不用走到电脑前重新扫码。
     * 存不进去（隐私模式）就当没有，altAddressHtml 会自己降级。
     */
    try {
      const urls = [c.baseUrl, c.altUrl, c.localHost, c.lanIp && `http://${c.lanIp}:${location.port || 8765}`]
        .filter((u) => typeof u === 'string' && /^https?:\/\//.test(u));
      if (urls.length) localStorage.setItem('ccm-alt-urls', JSON.stringify([...new Set(urls)]));
    } catch { /* 存不下就算了 */ }
  }
  if (i) inbox = i.inbox || {};

  // 无论如何都要画一次。这是这个函数最重要的一条不变式
  render();
}

// SSE 实时更新；切后台会断，回前台先全量刷新再重连（计划附录 A.4）
//
// 断开必须**显式**告诉用户。原来只把一个小圆点的 live class 去掉，手机上
// 根本看不见——页面就停在最后一帧，倒计时走到 0 还挂着待审批，看起来像
// 服务卡死了，实际上服务好好的，只是 Mac 换了 IP、这个页面连的是旧地址。
// 排查这种「正常状态被显示成故障」最费时间。
let offlineSince = null;

/**
 * 合并同一帧内的多次重绘请求。
 *
 * 事件是成批到的（SSE 重放、一轮里连续几个工具调用），逐条重绘既卡又没意义
 * ——中间那些帧没人看得见。
 */
let renderPending = false;
function scheduleRender() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => {
    renderPending = false;
    if (tab === 'home') render();
  });
}

/**
 * 重连状态。
 *
 * ## 为什么手机上必须有「重连」这个动作
 *
 * 断线时原来给的唯一出路是「去 Mac 上跑 npx clamicro qr」。可断线最常见的
 * 原因是**抖一下**——Wi-Fi 切换、手机息屏回来、服务刚好在重启。这些情况
 * 再连一次就好了，却要求用户走到电脑前重新扫码，代价和收益完全不成比例。
 *
 * 而且这条建议在手机上是**做不到**的：人正拿着手机看这一屏，Mac 可能在
 * 另一个房间。给一个此刻执行不了的指令，等于没给出路。
 *
 * 所以：自动重试兜底（用户什么都不用做），手动按钮兜顶（不想等的人立刻可以试）。
 */
let es = null;
let autoRetryTimer = null, autoRetryAt = 0, autoRetryDelay = 0;
const RETRY_MIN = 3000, RETRY_MAX = 30000;

/**
 * 重新连接。
 *
 * manual=true 是用户按的：立刻试，并且把退避重置——人主动按了，说明他
 * 认为环境变了（刚切回 Wi-Fi、刚重启服务），这时候还按 30 秒的退避等着，
 * 按钮就成了摆设。
 */
function reconnect(manual) {
  if (manual) autoRetryDelay = 0;
  clearTimeout(autoRetryTimer);
  autoRetryTimer = null;
  autoRetryAt = 0;
  try { es?.close(); } catch { /* 已经死了 */ }
  es = null;
  refresh();   // 轮询和 SSE 是两条独立的路，先用轮询探一次
  connect();
  render();
}

/** 断线期间按指数退避自动重试。用户什么都不用做是默认路径。 */
function scheduleAutoRetry() {
  if (autoRetryTimer) return;
  autoRetryDelay = Math.min(RETRY_MAX, autoRetryDelay ? autoRetryDelay * 2 : RETRY_MIN);
  autoRetryAt = Date.now() + autoRetryDelay;
  autoRetryTimer = setTimeout(() => {
    autoRetryTimer = null;
    if (isDisconnected()) reconnect(false);
  }, autoRetryDelay);
}

function connect() {
  es = new EventSource('/api/stream');
  es.onopen = () => {
    if (offlineSince !== null) { offlineSince = null; refresh(); }
    // 连上了就把退避清零：下一次断线该从 3 秒重新数，而不是接着上一次的 30 秒
    clearTimeout(autoRetryTimer); autoRetryTimer = null; autoRetryAt = 0; autoRetryDelay = 0;
    // 连接状态只由路径行那个光标表示。标题前面原来还有一个小圆点，
    // 说的是同一件事——两个指示灯说同一句话，人要多看一处才能确认，
    // 而且它们的更新时机不同步时反而制造疑问
    renderPathBar();
  };
  es.onerror = () => {
    // EventSource 会自己重连，短暂抖动不该报警——超过几秒才算真断
    if (offlineSince === null) { offlineSince = Date.now(); setTimeout(render, 5000); }
    else if (Date.now() - offlineSince > 5000) { scheduleAutoRetry(); render(); }
    // 光标要**立刻**转成「重连中」，不等那 5 秒。它是这一屏活着的证据；
    // 断线最初那几秒里它要是还在若无其事地绿着闪，恰恰是最该说实话的时候
    renderPathBar();
  };
  es.addEventListener('session', refresh);
  es.addEventListener('approval', refresh);
  /**
   * 工具调用事件 —— 履历的数据源。
   *
   * 这条流本来就在推（连上时会把历史事件一起送过来），首页以前只是没监听。
   * 所以刷新页面立刻就有履历，不用等新事件发生。
   */
  es.addEventListener('event', (m) => {
    try {
      const e = JSON.parse(m.data);
      if (e.type !== 'tool' && e.type !== 'tool-error') return;
      // 命令常常是多行的（heredoc、带换行的脚本），压成一行再截断——
      // 否则单行的履历轨道会被撑破
      const text = String(e.detail || '').replace(/\s+/g, ' ').trim().slice(0, 52);
      if (!text) return;
      recentTools.push({ sid: e.session_id, text });
      if (recentTools.length > 40) recentTools.splice(0, recentTools.length - 40);
      /**
       * **必须节流。** 服务端在连上时会把历史事件一次性重放（上限 3000 条），
       * 每条都直接 render() 就是几千次整页重绘——页面一加载就卡死。
       * 攒到下一帧再画一次，重放和实时都走同一条路。
       */
      scheduleRender();
    } catch { /* 单条坏消息不该影响流 */ }
  });
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh();
});

setInterval(() => { if (tab === 'home') render(); }, 30000); // 让「N 分后重置」自己走
setInterval(() => { if (tab === 'home') tickDeadlines(); }, 1000);

render();
refresh().then(connect).catch(() => {
  $('view').innerHTML = '<div class="empty"><b>连不上服务</b>确认 clamicro 还在 Mac 上运行</div>';
});
</script>
</body>
</html>
