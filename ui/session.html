<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>会话 · Clamicro</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --fg:#12151a; --dim:#6b7280; --line:#e4e7ec; --monobg:#f0f2f5;
    --ok:#0a7d34; --no:#b42318; --warn:#b54708; --run:#1570ef; --calm:#475467;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d10; --card:#14181d; --fg:#e8eaed; --dim:#8b93a1; --line:#242a32; --monobg:#0f1318;
      --ok:#4ade80; --no:#f87171; --warn:#fbbf24; --run:#60a5fa; --calm:#9aa3b0;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* iOS Safari 从 10 起就忽略 user-scalable=no，双击放大只能靠 touch-action 挡。
     manipulation = 保留滚动和捏合，去掉双击缩放那 300ms 的等待。 */
  html{touch-action:manipulation; -webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%;overflow-x:hidden;overscroll-behavior:none}
  body{
    background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    padding:env(safe-area-inset-top) 0 0;
  }
  header{padding:14px 16px 10px; flex:0 0 auto; border-bottom:1px solid var(--line)}
  /* 桌面上限宽居中，否则时间线一行横跨整个屏幕没法读。
     限宽加在容器上，不要加在子元素上。 */
  header, main{width:100%; max-width:592px; margin-left:auto; margin-right:auto}
  .nav{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  /* 返回是图标，跟设置页一致。44×44 触摸目标，负 margin 吃掉多出来的部分
     让它视觉上仍贴着左边缘与标题对齐 */
  .nav a.back{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; margin:-13px -12px -13px -13px;
    color:var(--run); text-decoration:none; flex:0 0 auto;
  }
  .nav a.back svg{width:22px; height:22px; display:block}
  /* 后端身份行。描边而不是填色——它是出身，不是状态，
     不该跟右上角那个状态胶囊抢注意力 */
  .agent{display:flex; align-items:center; gap:8px; margin-top:7px}
  .agent .abadge{font-size:11.5px; padding:3px 9px; border-radius:20px;
    box-shadow:inset 0 0 0 1px var(--line); color:var(--dim)}
  .agent .amodel{font-size:11.5px; color:var(--dim)}
  .nav h1{font-size:18px; margin:0; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .state{font-size:12px; padding:3px 9px; border-radius:20px; background:var(--monobg); color:var(--dim); flex:0 0 auto}
  .state.Running{color:var(--run)} .state.Done{color:var(--ok)}
  .state.Error{color:var(--no)} .state.Paused{color:var(--warn)}
  .state[class*="Waiting"]{color:var(--warn)}
  .path{font:12px/1.4 ui-monospace,Menlo,monospace; color:var(--dim); overflow-wrap:anywhere}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
  .chip{font-size:11.5px; padding:3px 8px; border-radius:20px; background:var(--monobg); color:var(--dim)}

  main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; padding:14px 16px var(--barh,150px)}

  /* 时间线：左侧一条轴，每个事件一个节点 */
  .tl{position:relative; padding-left:24px}
  .tl::before{content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line)}
  .ev{position:relative; padding:0 0 18px}
  .ev::before{
    content:''; position:absolute; left:-22px; top:5px; width:10px; height:10px;
    border-radius:50%; background:var(--line); border:2px solid var(--bg);
  }
  .ev[data-t="prompt"]::before{background:var(--run)}
  .ev[data-t="stop"]::before{background:var(--ok)}
  .ev[data-t="error"]::before,.ev[data-t="tool-error"]::before{background:var(--no)}
  .ev[data-t="approval-requested"]::before,.ev[data-t="control"]::before,.ev[data-t="quota-warn"]::before{background:var(--warn)}
  /* skill 自成一色：它不是一次普通工具调用，是往这一轮里装了一段别人写的指令 */
  .ev[data-t="skill"]::before{background:var(--calm)}
  /* 用过哪些 skill。**只在真用过时才画**——一条写着「无」的空行等于告诉你
     这里有个功能坏了，而事实是这一轮压根没用 skill */
  .skills{display:flex; gap:6px; flex-wrap:wrap; align-items:baseline; margin-top:9px}
  .skills .lbl{font-size:11.5px; color:var(--dim); flex:0 0 auto}
  .skills .sk{
    font:11.5px ui-monospace,Menlo,monospace; padding:3px 8px; border-radius:20px;
    background:var(--monobg); color:var(--calm);
  }
  .ev .h{display:flex; align-items:baseline; gap:8px}
  .ev .k{font-size:12px; color:var(--dim); flex:0 0 auto}
  .ev .t{font-size:11.5px; color:var(--dim); margin-left:auto; flex:0 0 auto; font-variant-numeric:tabular-nums}
  .ev .d{
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    margin-top:3px; overflow-wrap:anywhere; white-space:pre-wrap;
    max-height:8em; overflow:hidden;
  }
  .empty{color:var(--dim); font-size:14px; text-align:center; padding:44px 20px}

  /* ── 发消息。整块从「发消息」tab 搬过来的 ──
     搬的理由不是更顺手：那个 tab 干的第一件事是「先挑一个会话」，
     而你多半刚从某个会话页过来，那里有完整上下文（它在干什么、时间线、
     暂停/取消）。挑选这一步是把你刚有的上下文丢掉再让你重建。 */
  /* ── 底部那条 = 输入框 + 两个图标 ─────────────────────────────
     原来这里是「暂停 / 取消下一步」两个通栏按钮，而发消息在时间线**下面**，
     十几屏之外。结果是：这一页最显眼的两个东西都是「让它停」，而「跟它说
     一句话」得先翻到底才知道存在。

     改成常驻输入框之后，三件事一次到位：能说话这件事不用被发现；
     刚读到的那条日志就在正上方；两个控制退成图标，不再和输入框抢地方。

     **但它不是聊天框，这一点不能靠版式遮过去。** 注入的唯一时机是
     Stop hook（这一轮结束时），会话空着时更是要等你在终端再发起一轮。
     所以输入框底下钉着一行小字说什么时候到——聊天的形状会让人默认
     「发了就到」，那一行是把这个默认拆掉的唯一东西，任何时候都不能省。 */
  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:3;
    background:var(--card); border-top:1px solid var(--line);
    padding:9px 16px calc(9px + env(safe-area-inset-bottom));
  }
  .bar .inner{width:100%; max-width:592px; margin:0 auto}
  .brow{display:flex; align-items:flex-end; gap:8px}
  /* 图标按钮：44×44 触摸目标，图形本身只有 22px。
     图标没有名字，读屏软件全靠 aria-label——省了它这两个键就是无名的 */
  .ico{
    flex:0 0 auto; width:44px; height:44px; padding:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    border:none; background:none; color:var(--calm);
  }
  .ico svg{width:22px; height:22px; display:block}
  .ico.on{color:var(--ok)}          /* 暂停中 → 恢复，变成可以「放行」的绿 */
  .ico.danger{color:var(--no)}
  .ico:disabled{opacity:.35}
  /* 输入框那一格。边框画在外壳上而不是 textarea 上，
     这样光标进去时整格一起亮，跟里面的发送键是同一个控件 */
  .field{
    flex:1 1 auto; display:flex; align-items:flex-end; gap:4px;
    border:1px solid var(--line); border-radius:22px; background:var(--bg);
    padding:4px 4px 4px 15px; min-width:0;
  }
  .field:focus-within{border-color:color-mix(in srgb,var(--run) 55%,transparent)}
  .field textarea{
    flex:1 1 auto; min-width:0; border:none; background:none; outline:none;
    resize:none; color:var(--fg); padding:9px 0; max-height:120px;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  }
  .field textarea::placeholder{color:var(--dim)}
  /* 发送键。圆形实心 —— 这一条底栏上唯一一个实心控件，
     因为它是唯一一个「往前推进」的动作，另外两个都是「让它停」 */
  .send{
    flex:0 0 auto; width:34px; height:34px; margin-bottom:1px; padding:0;
    border:none; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:var(--run); color:var(--card);
  }
  .send svg{width:18px; height:18px; display:block}
  /* 空着的时候压灰而不是藏起来：位置一直在那儿，你才知道打完字往哪按 */
  .send:disabled{opacity:.3; cursor:default}
  /* 送达时机。**永远显示**，理由见 .bar 开头那段 */
  .hint{font-size:11.5px; line-height:1.5; color:var(--dim); margin:7px 2px 0}
  .hint.warn{color:var(--warn)}
  .barerr{font-size:12.5px; line-height:1.5; color:var(--warn); margin:7px 2px 0}
  /* 断线横幅。比 note 更响一档（红而不是黄）：note 说的是某个操作的状态，
     这条说的是**整屏都不再可信**——上面每一个字都是断开之前的样子。 */
  .offline{
    font-size:12px; line-height:1.5; color:var(--no);
    padding:7px 11px; margin-bottom:8px; border-radius:9px;
    background:color-mix(in srgb,var(--no) 12%,var(--card));
    border:1px solid color-mix(in srgb,var(--no) 32%,transparent);
  }
  /* 排队中的消息。收在一行里，点开才铺展——它们是**已经处理完的事**，
     不该常年占着输入框上方那块地方 */
  .qstrip{
    display:flex; align-items:center; gap:6px; cursor:pointer;
    font-size:12px; color:var(--dim); padding:6px 2px; margin-bottom:2px;
    background:none; border:none; width:100%; text-align:left;
  }
  .qstrip svg{width:12px; height:12px; transition:transform .15s}
  .qstrip[aria-expanded="true"] svg{transform:rotate(90deg)}
  .qlist{max-height:168px; overflow-y:auto; margin-bottom:6px}
  .qitem{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:9px 11px; margin-bottom:6px;
  }
  .qitem p{margin:0; flex:1; font-size:13px; line-height:1.45; overflow-wrap:anywhere; white-space:pre-wrap}
  .qitem button{
    flex:0 0 auto; border:none; background:none; color:var(--no);
    font-size:12.5px; cursor:pointer; padding:2px 4px;
  }
  /* 回到最新。时间线是新的在上，长会话里翻下去之后没有别的路回顶 */
  .jump{
    position:fixed; right:16px; z-index:2; cursor:pointer;
    display:flex; align-items:center; gap:6px;
    padding:9px 14px; border-radius:20px;
    border:1.5px solid color-mix(in srgb,var(--run) 40%,transparent);
    background:var(--card); color:var(--run);
    font:600 13px -apple-system,"PingFang SC",sans-serif;
    box-shadow:0 4px 14px rgba(0,0,0,.16);
  }
  .jump svg{width:14px; height:14px; display:block}
  /* 暂停 / 取消的状态说明。图标没有名字，这一行就是它们此刻在说什么 —— 
     从「贴在底栏上方的浮层」改成底栏里的一行，跟着那两个图标一起走 */
  .note{
    font-size:12px; line-height:1.5; color:var(--warn);
    padding:7px 11px; margin-bottom:8px; border-radius:9px;
    background:color-mix(in srgb,var(--warn) 12%,var(--card));
    border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  }
  .hidden{display:none !important}
</style>
<link rel="manifest" href="/ui/manifest.webmanifest">
<link rel="apple-touch-icon" href="/ui/icons/icon-180.png">
<!-- 加到主屏幕后全屏打开，不显示 Safari 的地址栏——这是「像个 App」和
     「像个网页快捷方式」之间唯一肉眼可见的差别 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clamicro">
</head>
<body>
<header>
  <div class="nav">
    <!-- aria-label 不能省：图标按钮对读屏软件来说本来是无名的 -->
    <a class="back" href="/ui" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 id="name">—</h1>
    <span class="state" id="state">—</span>
  </div>
  <div class="path" id="path"></div>
  <!-- 后端身份单独一行：它决定这一页哪些操作有效，不该混在状态数字里 -->
  <div class="agent hidden" id="agent"></div>
  <div class="chips" id="chips"></div>
  <div class="skills hidden" id="skills"></div>
</header>

<main><div class="tl" id="tl"></div></main>

<!-- 回到最新。放在 main 外面：它是**固定**的，跟着时间线滚就没意义了 -->
<button class="jump hidden" id="jump"></button>

<!--
  底栏。三样东西按「此刻要不要」显示，整条从不消失：
    note   暂停 / 取消此刻在说什么（图标没有名字，全靠这一行）
    队列   已排队但还没送达的消息，收成一行
    brow   暂停图标 · 取消图标 · 输入框 · 发送
-->
<div class="bar" id="bar"><div class="inner">
  <div class="offline hidden" id="offline"></div>
  <div class="note hidden" id="note"></div>
  <button class="qstrip hidden" id="qstrip" aria-expanded="false"></button>
  <div class="qlist hidden" id="qlist"></div>
  <div class="barerr hidden" id="barerr"></div>
  <div class="brow">
    <button class="ico" id="btnPause" aria-label="暂停"></button>
    <button class="ico danger" id="btnCancel" aria-label="取消下一步"></button>
    <div class="field hidden" id="field">
      <textarea id="draft" rows="1" placeholder="跟它说一句…"></textarea>
      <button class="send" id="sendBtn" aria-label="发送" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
  <div class="hint hidden" id="hint"></div>
</div></div>

<script src="/ui/agents.js"></script>
<script src="/ui/sched.js"></script>
<script>
const SID = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* KIND_LABEL / kindLabel / clock 现在住在 /ui/agents.js —— 历史 tab 也要用。
   抄两份的下场见那个文件开头：同一条事件在两个页面上叫不同的名字。 */

let session = null, cap = null, draft = '', queued = [];

function render(data) {
  session = data.session;
  // 后端能力随会话一起下发（见 /api/sessions/:id）。拿不到就按全能力走：
  // 老服务端不带这个字段，按无能力走会让暂停按钮凭空消失一次
  cap = data.cap ?? { approve: true, pause: true, cancel: true, quota: 'window', label: null, cancelNote: null };
  const s = session;
  if (!s) {
    $('name').textContent = '会话已结束';
    $('tl').innerHTML = '<div class="empty">这个会话已经不在了<br>历史事件仍保留在下方</div>';
  } else {
    const dir = (s.cwd || '').split('/').filter(Boolean).pop() || s.session_id.slice(0, 8);
    $('name').textContent = s.session_name || dir;
    $('path').textContent = s.cwd || '';
    $('state').textContent = stateLabel(s.state, s) + (s.sub_state ? ' · ' + subStateLabel(s.sub_state) : '');
    $('state').className = 'state ' + String(s.state).replace(/\s/g, '-');
    /**
     * 后端**不混在 chip 堆里**，单独占一行放在路径下方。
     *
     * 原来它是 chips 里的第一个 chip，和 model、ctx、花费排在一起——
     * 可这几样回答的是完全不同的问题：后端是「这个会话归谁管」，
     * 决定了这一页上哪些按钮有效、时间线里的工具名是哪一套词汇；
     * 而 model/ctx/花费是「它跑得怎么样」。
     *
     * 前者是**身份**，混在一排状态数字里就看不见了，而恰恰是它决定了
     * 你在这一页能做什么。
     */
    /*
     * 徽标要带 logo。首页的卡片和审批页都带（`agentLogo` 在那两处共 7 次调用），
     * **只有这一页没有**——而 ui/agents.js 存在的全部理由就是让三个页面对同一个
     * 后端长得一样。git 里查过：这一页历史上一次都没加过，不是被谁删的。
     *
     * 后端是**身份**，而这一页正是「这个会话归谁管」最要紧的地方——它决定了
     * 下面哪些按钮有效。一个只有文字的胶囊在扫视时和别的 chip 分不开，
     * 而彩色 logo 是唯一不用读字就能认出来的东西。
     */
    $('agent').innerHTML = cap.label
      ? `<span class="abadge">${agentLogo(s.agent)}${esc(cap.label)}</span>` +
        (s.model ? `<span class="amodel">${esc(s.model)}</span>` : '')
      : '';
    $('agent').classList.toggle('hidden', !cap.label);

    $('chips').innerHTML = [
      // model 已经跟着后端徽标一起显示了，这里不再重复
      cap.quota !== 'window' && s.model && `<span class="chip">${esc(s.model)}</span>`,
      // 没有上下文窗口读数的后端整条不画，而不是画一个 0%
      cap.quota === 'window' && s.context && `<span class="chip">ctx ${Math.round(s.context.used_pct)}%</span>`,
      s.cost_usd != null && `<span class="chip">$${s.cost_usd.toFixed(4)}</span>`,
      // 按 API key 计费的后端没有窗口配额，累计 token 是唯一说得出口的用量。
      // 不换算成金额——那要一张会悄悄过期的价目表
      cap.quota === 'tokens' && s.tokens > 0 && `<span class="chip">${
        s.tokens < 1000 ? s.tokens
          : s.tokens < 1e6 ? (s.tokens / 1000).toFixed(s.tokens < 1e4 ? 1 : 0) + 'k'
          : (s.tokens / 1e6).toFixed(1) + 'M'} tok</span>`,
    ].filter(Boolean).join('');

    /**
     * 暂停/取消按能力显示。
     *
     * 这两件事建立在「下一个工具调用前把它挂住」这个拦截点上（src/control.mjs），
     * 是 Claude Code 的特有原语。别的后端没有等价物时按钮直接不给——
     * 留一个点了没反应的按钮，用户会以为暂停成功然后走开，那比没有按钮危险。
     */
    $('btnPause').classList.toggle('hidden', !cap.pause);
    $('btnCancel').classList.toggle('hidden', !cap.cancel);

    /*
     * 暂停键**同时是恢复键**：图形换成播放三角、颜色转绿，aria-label 一起改。
     * 图标没有文字，一个不换形状的按钮在两种状态下长得一模一样——
     * 而这两种状态下按它的后果正好相反。
     */
    const paused = s.state === 'Paused';
    $('btnPause').innerHTML = paused ? IC.play : IC.pause;
    $('btnPause').setAttribute('aria-label', paused ? '恢复' : '暂停');
    $('btnPause').title = paused ? '恢复' : '暂停';
    $('btnPause').className = 'ico' + (paused ? ' on' : '') + (cap.pause ? '' : ' hidden');
    $('btnCancel').innerHTML = IC.stop;
    $('btnCancel').title = '取消下一步';
    // Claude Code 没有运行时暂停原语，说清楚才不会以为点了没反应
    let note = '';
    // 取消排在最前：暂停中再点取消是常见操作，这时该说的是取消那句
    if (s.control === 'cancelled' && (s.state === 'Running' || s.state === 'Paused')) {
      /*
       * 说清楚它承诺什么、不承诺什么。「已取消」是假话：这一步照跑，
       * 而且如果这一轮不再调工具，它根本不会触发。
       */
      note = '已就绪：将阻止本轮下一次工具操作。当前这一步仍会跑完；'
        + '若这一轮不再调用工具，则不会触发（45 秒后自动作废）';
    } else if (paused && cap.pause) note = s.held
      ? '已停住 — 正卡在一个工具调用前，点恢复继续'
      : '已请求暂停 — 会在下一个工具调用前停住，当前这一步仍会跑完';
    /* 「只能审批」这句话是有前提的：得先真的能审批。Codex 现在连审批都没开，
       照说会向用户承诺一个不存在的能力——而这一页的全部作用就是把「能做什么」
       说准。所以先看 cap.approve。 */
    else if (!cap.pause && !cap.cancel) note = cap.approve
      ? `${cap.label || '这个后端'}不支持从手机暂停或取消，只能审批。`
      : `${cap.label || '这个后端'}目前只把状态镜像到手机，暂停、取消、审批都还不支持。`;
    /*
     * 这一行是那两个图标此刻**在说什么**。原来它只在暂停/取消进行中出现；
     * 现在按钮上没有字了，「这个后端不支持暂停」那一档就更要留着——
     * 否则一个灰掉的无名图标是解释不了自己的。
     */
    $('note').textContent = note;
    $('note').classList.toggle('hidden', !note);
  }

  /**
   * 这个会话用过哪些 skill。
   *
   * ## 数据来自事件流，不是磁盘
   *
   * 「盘上装了哪些 skill」和「这一轮真的用了哪些」是两个问题，而只有后者
   * 是**观测到的事实**——它不会因为插件启停、marketplace 更新、项目级
   * skill 目录而悄悄变得不对。前者要诚实地算出来得分三档来源（用户级 /
   * 已启用插件带的 / 项目级），少算一档就是在骗人。
   *
   * 而且这一页要回答的是「它是不是在按我期望的路子走」，那正是这一条。
   *
   * ## 去重但保留首次出现的顺序
   *
   * 同一个 skill 一轮里被调好几次很常见（每次带不同参数）。列成一排重复的
   * 名字既占地方又没多说什么。按先后排，因为那是它实际发生的顺序。
   *
   * ## 一条都没有就整块不画
   *
   * 不画一个写着「无」的空行——这一页别处已经反复守这条规矩（没有窗口读数
   * 的后端整条 ctx 不画，而不是画一个 0%）。空着和「没用过」在屏幕上长得
   * 一样，但前者会让人以为这里坏了。
   */
  const skills = [...new Set(
    (data.events || []).filter((e) => e.type === 'skill' && e.detail).map((e) => e.detail),
  )];
  $('skills').innerHTML = skills.length
    ? `<span class="lbl">用过的 skill</span>` +
      skills.map((k) => `<span class="sk">${esc(k)}</span>`).join('')
    : '';
  $('skills').classList.toggle('hidden', !skills.length);

  queued = data.queued || [];
  renderComposer();

  const evs = (data.events || []).slice().reverse();
  if (evs.length) {
    $('tl').innerHTML = evs.map((e) => `
      <div class="ev" data-t="${esc(e.type)}">
        <div class="h">
          <span class="k">${esc(kindLabel(e.type))}</span>
          <span class="t">${clock(e.ts)}</span>
        </div>
        ${e.detail ? `<div class="d">${esc(e.detail)}</div>` : ''}
      </div>`).join('');
  } else if (session) {
    $('tl').innerHTML = '<div class="empty">还没有事件</div>';
  }

  // 底栏的高度这一刻可能刚变（note 出现、队列多了一条、空闲那句折成两行），
  // 而 main 的底部留白全靠它 —— 量早了，时间线最后几行会被盖住
  sizeBar();
}

/* ── 图标 ──
   暂停/取消从通栏文字按钮变成了图标。图标没有名字，所以每一个都带
   aria-label，状态说明还在底栏第一行用文字说它此刻在做什么。 */
const IC = {
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.2v13.6L19 12z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.8 5.8l12.4 12.4"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  caret: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
};

/**
 * 底栏：输入框 + 两个图标。
 *
 * ## 为什么在这一页，而不是一个独立的 tab
 *
 * 原来它是导航里的「发消息」tab，而那个 tab 干的第一件事是
 * **「发给哪个会话」——先让你挑一个**。可你多半刚从某个会话页过来，
 * 那里有完整上下文（它在干什么、时间线、暂停/取消按钮都在）。
 * 挑选那一步是把你刚有的上下文丢掉，再让你在一排项目名里重建它。
 *
 * ## 为什么从时间线底下搬到常驻底栏
 *
 * 搬进这一页之后它仍在时间线**下面**——先看完发生了什么再回话，顺序是对的。
 * 但代价是长会话里它在十几屏之外，而屏幕上常驻可见的只有「暂停」「取消」
 * 两个通栏按钮。于是这一页最显眼的两件事都是**让它停**，而「跟它说一句」
 * 得先翻到底才知道存在。
 *
 * 常驻输入框把「能说话」这件事从「需要被发现」变成「一直在那儿」，
 * 而你刚读到的那条日志就在它正上方——原本要靠滚动维持的上下文，现在是版式
 * 给的。两个控制退成图标，不再和它抢地方。
 *
 * ## 它长得像聊天框，但**不是**聊天框
 *
 * 注入的唯一时机是 Stop hook（这一轮结束时，见 src/routes/hooks.mjs）。
 * 会话空着的时候更远：得等你在终端里再发起一轮。
 *
 * 聊天的形状自带一个承诺——**打完字按下去，对面就收到了**。这里不成立，
 * 而版式越像，那个承诺越结实。所以输入框底下钉着一行小字说什么时候到，
 * 空闲时换成更响的一句。**那一行任何时候都不能省**：它是这个形状唯一
 * 拆得掉自带承诺的东西。
 *
 * ## 不支持的后端**整格不画**
 *
 * 注入靠 Stop hook 回 `{decision:'block'}`，那是 Claude Code 的特有原语。
 * 别的后端没有等价物，画出来只会让人打完字点发送、然后永远等不到——
 * **发出去的消息比灰掉的按钮更像成功**。服务端那一侧也会 409
 * （src/routes/api.mjs 的 say），两处同一判据。
 */
function renderComposer() {
  const on = !!cap?.inbox;
  $('field').classList.toggle('hidden', !on);
  $('hint').classList.toggle('hidden', !on);
  if (!on) {
    $('qstrip').classList.add('hidden');
    $('qlist').classList.add('hidden');
    $('barerr').classList.add('hidden');
    return;
  }

  /**
   * **输入框只建一次，之后永不重建。**
   *
   * 这一整块原来每次 render() 都 `innerHTML = ...` 重刷，而 render() 是由
   * SSE 驱动的——`session` 和 `event` 两个事件都直接调 refresh()。也就是说
   * **对面每调用一次工具，你正在打字的那个 textarea 就被删掉重建一次**。
   *
   * 实测（一条 PreToolUse 打进来的前后）：
   *
   *     activeElement  draft → BODY
   *     selectionStart 5 → 0
   *
   * 文字本身没丢（`draft` 那个全局兜住了），但**光标跳回开头**，接着敲的字
   * 插在句首；手机上还会顺带收起键盘。而这一页的用法恰恰是「一边看它在干
   * 什么一边打字」——事件越密，被打断得越狠，正好是最需要说话的时候。
   *
   * 现在 textarea 是写死在 HTML 里的，render 只改会变的那几样文字，
   * 一个都不含焦点。
   */
  const idle = session && ['Done', 'Idle', 'Waiting Input'].includes(session.state);
  const hint = $('hint');
  hint.textContent = idle
    ? '会话已经停了 · 要等你在终端再发起一轮，这条才会进入对话'
    : '不会立刻送达 · 跑完当前这一轮后进入对话';
  hint.classList.toggle('warn', !!idle);

  // 队列收成一行，展开状态由用户说了算——刷新不该把他展开的东西合回去
  const q = $('qstrip'), list = $('qlist');
  q.classList.toggle('hidden', !queued.length);
  if (!queued.length) { list.classList.add('hidden'); list.innerHTML = ''; return; }
  q.innerHTML = `${IC.caret}排队中 ${queued.length} 条`;
  const open = q.getAttribute('aria-expanded') === 'true';
  list.classList.toggle('hidden', !open);
  list.innerHTML = queued.map((m) => `
    <div class="qitem"><p>${esc(m.text)}</p><button data-del="${esc(m.id)}">删除</button></div>`).join('');
  for (const b of list.querySelectorAll('[data-del]')) {
    b.onclick = async () => {
      await fetch(`/api/sessions/${SID}/say/${b.dataset.del}`, { method: 'DELETE' }).catch(() => {});
      await refresh.now();
    };
  }
}

$('qstrip').onclick = () => {
  const q = $('qstrip');
  q.setAttribute('aria-expanded', q.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
  renderComposer();
  sizeBar();
};

/**
 * 输入框跟着内容长高，到 120px 封顶。
 *
 * 先 `height=auto` 再读 scrollHeight：不清零的话它只会越长越高，删字不回缩
 * ——scrollHeight 永远不小于当前高度。
 */
function autoGrow() {
  const t = $('draft');
  t.style.height = 'auto';
  t.style.height = `${Math.min(t.scrollHeight, 120)}px`;
  sizeBar();
}

/**
 * 底栏是 fixed 的，会盖住时间线的最后几行 —— 所以把它的**实测高度**交给
 * main 当底部留白。
 *
 * 不写死常数：这条栏的高度会变（输入框长高、队列展开、note 出现、
 * 空闲那句话折成两行）。写死的那一刻它就只在某一种状态下是对的，
 * 而其余状态下你永远读不到时间线最后那一条。
 */
function sizeBar() {
  const h = $('bar').offsetHeight;
  document.documentElement.style.setProperty('--barh', `${h + 14}px`);
  paintJump();
}

async function send() {
  const text = $('draft').value.trim();
  if (!text) return;
  $('sendBtn').disabled = true;
  /**
   * **只有真的排上队了才清空草稿。**
   *
   * 原来无论成败都清：网络断了、服务重启了、队列满了——用户刚打完的一段话
   * 直接消失，界面上没有任何痕迹，他只会以为发出去了，然后等一个永远不来的
   * 回应。手机上重打一遍的代价还特别高。
   */
  let ok = false, hint = '', reached = true;
  try {
    const r = await fetch(`/api/sessions/${SID}/say`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    ok = r.ok;
    if (!ok) hint = (await r.json().catch(() => ({}))).hint || '没能发出去，再试一次。';
  } catch {
    // 请求压根没到 Mac。这和「到了、但服务端说不行」是两件事，
    // 靠 catch / !r.ok 两条分支分开——别去嗅错误文案里有没有某个词
    reached = false;
    hint = '发不出去 —— 和 Mac 的连接断了。你打的字还留着。';
  }
  if (ok) {
    draft = '';
    $('draft').value = '';
    clearBarError();
    markOnline();   // 发得出去就是通的，不管 SSE 那条怎么样
    autoGrow();
    await refresh.now();
    return;
  }
  $('sendBtn').disabled = false;
  if (!reached) markOffline();
  barError(hint);
}

$('draft').oninput = (e) => {
  draft = e.target.value;
  $('sendBtn').disabled = !draft.trim();
  autoGrow();
};
$('sendBtn').onclick = send;

/**
 * 回车怎么算，**看你在什么设备上**。
 *
 * 桌面上回车发送是聊天框的通行做法，换行走 Shift+Enter。手机上反过来：
 * 那颗键就是软键盘的换行键，把它抢走意味着**多行消息几乎打不出来**，
 * 而这一页要打的恰恰是「先别动数据库，改成……」这种成段的话。
 *
 * 按指针粗细分，不按屏幕宽度——外接键盘的平板、窄窗口的桌面，
 * 宽度都会判错，而「有没有精确指针」正是「有没有实体键盘」的近似。
 */
const coarse = window.matchMedia?.('(pointer: coarse)').matches;
$('draft').onkeydown = (e) => {
  if (e.key !== 'Enter') return;
  const metaSend = e.metaKey || e.ctrlKey;   // 两种设备上都发送
  if (metaSend || (!coarse && !e.shiftKey)) { e.preventDefault(); send(); }
};

/**
 * 「回到最新」。
 *
 * 只剩一个方向了：输入框现在常驻在底栏里，没有「跳到发消息」这回事。
 * 时间线是新的在上，翻下去之后回顶只能靠它。
 *
 * 短会话（一屏装得下）不画——一个点了屏幕纹丝不动的按钮，比没有更让人
 * 犯嘀咕。
 */
function paintJump() {
  const btn = $('jump'), main = document.querySelector('main');
  const show = main.scrollTop > 60;
  btn.classList.toggle('hidden', !show);
  if (!show) return;
  btn.innerHTML = `${IC.up}最新`;
  btn.setAttribute('aria-label', '回到最新的事件');
  // 底栏高度是变的（输入框长高、队列展开、note 出现），量出来再让
  btn.style.bottom = `calc(${$('bar').offsetHeight + 12}px + env(safe-area-inset-bottom))`;
  /*
   * **直接跳，不做平滑滚动。** `behavior:'smooth'` 不是到处都灵——
   * iOS Safari 15.4 之前整个调用被忽略，点了原地不动；本机这个浏览器也
   * 复现了（smooth 版 scrollTop 一动不动，赋值版立刻到 0）。这一页主要
   * 跑在手机上，赌不起。何况这是「跳」不是「滚」，按它的人已经决定
   * 不看中间那段了。
   */
  btn.onclick = () => { main.scrollTop = 0; paintJump(); };
}

/**
 * 拉一次会话详情画一次。
 *
 * 外面包了 `coalesced`（ui/sched.js）：SSE 一连上会把历史事件全量重放，
 * 而这里原来是**一条事件一个请求**——85 条事件的会话开一次页面实测 105 个
 * `/api/sessions/:id`，每个拉完整负载、每个重画整条时间线。
 *
 * `isStale()` 那一下是另一半：并发的响应会乱序回来（实测第 14 个比第 4 个
 * 先到），不拦的话最后落地的可能是**比已经收到过的还旧**的一份，而屏幕上
 * 看不出任何异样。
 *
 * 拉不到**保留上一帧，但要说出来**。清空页面会让人以为会话没了（它多半
 * 好好的，只是这台手机连不上）；一声不响地留着旧内容更糟——那是拿断开前
 * 的样子冒充现在。所以两样都不做，画面留着，上面压一条横幅。
 */
const refresh = coalesced(async (isStale) => {
  let d;
  try {
    d = await fetch(`/api/sessions/${SID}`).then((r) => r.json());
  } catch {
    markOffline();
    return;
  }
  if (isStale()) return;
  // 取到了就是通的，不管 SSE 那条怎么样
  markOnline();
  render(d);
});

/**
 * 「和 Mac 断了」——**说出来，但不禁用任何东西。**
 *
 * 禁用是下一步的诱惑，这里不走。判据本身可能是错的：SSE 那条长连接会被
 * 代理、移动网络、系统休眠单独掐掉，而普通 HTTP 请求照样通。按一个可能
 * 错的信号去关掉暂停和发送，等于在服务其实好着的时候把人锁在外面。
 *
 * 所以只陈述观察到的事实，动作照旧让人试——`act()` 和 `send()` 各自会如实
 * 报告失败，草稿也留着。**认不出来就说认不出来，不替人做决定。**
 *
 * 抖一下不报警：EventSource 自己会重连，几秒内恢复是常态。超过 5 秒才算
 * 真断——这个门槛和首页那个光标同源，两处不能各判各的。
 */
let offlineSince = null, offlineTimer = null;

function markOffline() {
  if (offlineSince === null) offlineSince = Date.now();
  clearTimeout(offlineTimer);
  const shout = () => {
    const el = $('offline');
    // EventSource 每隔几秒重试一次，onerror 就跟着来一次。已经在喊了就别再
    // 喊——每喊一次都要量一遍底栏高度、重排一次页面
    if (!el.classList.contains('hidden')) return;
    el.textContent = '和 Mac 断开了 —— 上面是断开之前的样子，现在的情况不知道';
    el.classList.remove('hidden');
    sizeBar();
  };
  const waited = Date.now() - offlineSince;
  if (waited >= 5000) shout();
  else offlineTimer = setTimeout(shout, 5000 - waited);
}

function markOnline() {
  clearTimeout(offlineTimer);
  offlineTimer = null;
  if (offlineSince === null) return;
  offlineSince = null;
  $('offline').classList.add('hidden');
  sizeBar();
}

/** 底栏那行「上一个动作没成功」。发送和暂停/取消共用——都是同一件事。 */
function barError(msg) {
  const el = $('barerr');
  el.textContent = msg;
  el.classList.remove('hidden');
  sizeBar();
}
function clearBarError() {
  const el = $('barerr');
  if (el.classList.contains('hidden')) return;
  el.classList.add('hidden');
  sizeBar();
}

/**
 * 暂停 / 恢复 / 取消。
 *
 * **失败要说出来。** 原来这里是 `.catch(() => {})`——一个压根没到 Mac 的
 * 暂停，和一个真的生效了的暂停，在屏幕上长得一模一样：按钮弹回来，别的
 * 什么都不变。而这两件事的后果差得很远，人会以为已经停了然后走开。
 *
 * 服务端拒绝（409，能力表说这个后端不支持）也一样要说：那时候请求是通的，
 * 只是这件事做不了，而沉默会让人以为做成了。
 */
async function act(action) {
  $('btnPause').disabled = $('btnCancel').disabled = true;
  clearBarError();
  let err = '';
  try {
    const r = await fetch(`/api/sessions/${SID}/${action}`, { method: 'POST' });
    if (!r.ok) {
      err = (await r.json().catch(() => ({}))).hint
        || `没能${action === 'cancel' ? '取消' : action === 'resume' ? '恢复' : '暂停'} —— 服务端拒绝了（${r.status}）`;
    } else {
      markOnline();
    }
  } catch {
    err = '没发出去 —— 和 Mac 的连接断了，这一步没有生效';
    markOffline();
  }
  await refresh.now();
  $('btnPause').disabled = $('btnCancel').disabled = false;
  if (err) barError(err);
}

$('btnPause').onclick = () => act(session?.state === 'Paused' ? 'resume' : 'pause');
$('btnCancel').onclick = () => {
  // 「取消」的实际效果各后端不一样，文案跟着能力表走，别写死成 Claude Code 的
  const note = cap?.cancelNote ? `\n\n${cap.cancelNote}` : '';
  if (confirm(`取消当前这一轮？${note}`)) act('cancel');
};

/**
 * 滚动时重算胶囊的方向。
 *
 * rAF 合并：滚动事件一帧能来好几条，而 paintJump 里有 getBoundingClientRect
 * ——那是会触发重排的读操作，逐条跑等于在滚动最忙的时候给自己加戏。
 */
let jumpTick = false;
const onJumpScroll = () => {
  if (jumpTick) return;
  jumpTick = true;
  requestAnimationFrame(() => { jumpTick = false; paintJump(); });
};
document.querySelector('main').addEventListener('scroll', onJumpScroll, { passive: true });
// 转屏、手机键盘弹起收起——都会改变「输入框在不在视野里」的答案
window.addEventListener('resize', onJumpScroll, { passive: true });

const es = new EventSource('/api/stream');
es.addEventListener('session', refresh);
es.addEventListener('event', refresh);
/*
 * 这条长连接是主检测路径：不接它的话，只有「正好有人触发了一次拉取」才发现
 * 断了——而断线时最典型的情形恰恰是什么都不发生，页面就那么静静地停着。
 *
 * onerror 不立刻喊：EventSource 自己会重连，几秒内恢复是常态。
 * markOffline 里那 5 秒门槛管这件事。
 */
es.onerror = () => markOffline();
es.onopen = () => markOnline();
document.addEventListener('visibilitychange', () => {
  /*
   * 回前台补一次**走 now()**。
   *
   * 合并版排的是 rAF，而 rAF 在后台标签页是挂起的——「补上错过的那些」这件事
   * 本身就发生在刚从挂起里出来的那一刻，让它去等一帧等于把补课托付给刚醒的
   * 那个机制。这一次也没什么好合并的：一次可见性变化只有一次。
   */
  if (document.visibilityState === 'visible') refresh.now();
});

// 首屏走 now()：合并省的是重复，不该省掉唯一的那一次
refresh.now();
</script>
</body>
</html>
