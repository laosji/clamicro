<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>会话 · Clamicro</title>
<style>
  :root{
    --bg:#f7f8fa; --card:#fff; --fg:#12151a; --dim:#6b7280; --line:#e4e7ec; --monobg:#f0f2f5;
    --ok:#0a7d34; --no:#b42318; --warn:#b54708; --run:#1570ef;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0b0d10; --card:#14181d; --fg:#e8eaed; --dim:#8b93a1; --line:#242a32; --monobg:#0f1318;
      --ok:#4ade80; --no:#f87171; --warn:#fbbf24; --run:#60a5fa;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* iOS Safari 从 10 起就忽略 user-scalable=no，双击放大只能靠 touch-action 挡。
     manipulation = 保留滚动和捏合，去掉双击缩放那 300ms 的等待。 */
  html{touch-action:manipulation; -webkit-text-size-adjust:100%}
  html,body{margin:0;height:100%;overflow-x:hidden;overscroll-behavior:none}
  body{
    background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    padding:env(safe-area-inset-top) 0 0;
  }
  header{padding:14px 16px 10px; flex:0 0 auto; border-bottom:1px solid var(--line)}
  /* 桌面上限宽居中，否则时间线一行横跨整个屏幕没法读。
     限宽加在容器上，不要加在子元素上。 */
  header, main{width:100%; max-width:592px; margin-left:auto; margin-right:auto}
  footer{justify-content:center}
  footer button{max-width:290px}
  .nav{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  /* 返回是图标，跟设置页一致。44×44 触摸目标，负 margin 吃掉多出来的部分
     让它视觉上仍贴着左边缘与标题对齐 */
  .nav a.back{
    display:flex; align-items:center; justify-content:center;
    width:44px; height:44px; margin:-13px -12px -13px -13px;
    color:var(--run); text-decoration:none; flex:0 0 auto;
  }
  .nav a.back svg{width:22px; height:22px; display:block}
  /* 后端身份行。描边而不是填色——它是出身，不是状态，
     不该跟右上角那个状态胶囊抢注意力 */
  .agent{display:flex; align-items:center; gap:8px; margin-top:7px}
  .agent .abadge{font-size:11.5px; padding:3px 9px; border-radius:20px;
    box-shadow:inset 0 0 0 1px var(--line); color:var(--dim)}
  .agent .amodel{font-size:11.5px; color:var(--dim)}
  .nav h1{font-size:18px; margin:0; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .state{font-size:12px; padding:3px 9px; border-radius:20px; background:var(--monobg); color:var(--dim); flex:0 0 auto}
  .state.Running{color:var(--run)} .state.Done{color:var(--ok)}
  .state.Error{color:var(--no)} .state.Paused{color:var(--warn)}
  .state[class*="Waiting"]{color:var(--warn)}
  .path{font:12px/1.4 ui-monospace,Menlo,monospace; color:var(--dim); overflow-wrap:anywhere}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
  .chip{font-size:11.5px; padding:3px 8px; border-radius:20px; background:var(--monobg); color:var(--dim)}

  main{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; padding:14px 16px calc(90px + env(safe-area-inset-bottom))}

  /* 时间线：左侧一条轴，每个事件一个节点 */
  .tl{position:relative; padding-left:24px}
  .tl::before{content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:var(--line)}
  .ev{position:relative; padding:0 0 18px}
  .ev::before{
    content:''; position:absolute; left:-22px; top:5px; width:10px; height:10px;
    border-radius:50%; background:var(--line); border:2px solid var(--bg);
  }
  .ev[data-t="prompt"]::before{background:var(--run)}
  .ev[data-t="stop"]::before{background:var(--ok)}
  .ev[data-t="error"]::before,.ev[data-t="tool-error"]::before{background:var(--no)}
  .ev[data-t="approval-requested"]::before,.ev[data-t="control"]::before,.ev[data-t="quota-warn"]::before{background:var(--warn)}
  .ev .h{display:flex; align-items:baseline; gap:8px}
  .ev .k{font-size:12px; color:var(--dim); flex:0 0 auto}
  .ev .t{font-size:11.5px; color:var(--dim); margin-left:auto; flex:0 0 auto; font-variant-numeric:tabular-nums}
  .ev .d{
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    margin-top:3px; overflow-wrap:anywhere; white-space:pre-wrap;
    max-height:8em; overflow:hidden;
  }
  .empty{color:var(--dim); font-size:14px; text-align:center; padding:44px 20px}

  footer{
    position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); background:var(--card);
  }
  footer button{
    flex:1; padding:14px 0; border-radius:12px; cursor:pointer;
    font:600 15px -apple-system,"PingFang SC",sans-serif;
    background:var(--card); border:1.5px solid var(--line); color:var(--fg);
  }
  footer .danger{color:var(--no); border-color:color-mix(in srgb,var(--no) 32%,transparent)}
  footer .go{color:var(--ok); border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
  footer button:disabled{opacity:.4}
  /* 底栏是 fixed 的，提示必须一起脱离普通流，否则会被挡在后面看不见 */
  .note{
    position:fixed; left:0; right:0; z-index:1;
    bottom:calc(70px + env(safe-area-inset-bottom));
    font-size:12px; line-height:1.5; color:var(--warn); text-align:center;
    padding:9px 16px; margin:0 16px; border-radius:10px;
    background:var(--warnbg,color-mix(in srgb,var(--warn) 12%,var(--card)));
    border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  }
  .hidden{display:none !important}
</style>
<link rel="manifest" href="/ui/manifest.webmanifest">
<link rel="apple-touch-icon" href="/ui/icons/icon-180.png">
<!-- 加到主屏幕后全屏打开，不显示 Safari 的地址栏——这是「像个 App」和
     「像个网页快捷方式」之间唯一肉眼可见的差别 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clamicro">
</head>
<body>
<header>
  <div class="nav">
    <!-- aria-label 不能省：图标按钮对读屏软件来说本来是无名的 -->
    <a class="back" href="/ui" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 id="name">—</h1>
    <span class="state" id="state">—</span>
  </div>
  <div class="path" id="path"></div>
  <!-- 后端身份单独一行：它决定这一页哪些操作有效，不该混在状态数字里 -->
  <div class="agent hidden" id="agent"></div>
  <div class="chips" id="chips"></div>
</header>

<main><div class="tl" id="tl"></div></main>

<div class="note hidden" id="note"></div>
<footer>
  <button id="btnPause">暂停</button>
  <button class="danger" id="btnCancel">取消本轮</button>
</footer>

<script>
const SID = location.pathname.split('/').pop();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 状态/子状态的中文显示。CSS 类仍用原文，只有显示文本走这张表。和 home.html 各一份，改时同步。 */
const STATE_LABEL = { Idle: '空闲', Running: '运行中', 'Waiting Approval': '等待批准', Paused: '已暂停', Done: '已完成', Error: '出错' };
const SUBSTATE_LABEL = { Thinking: '思考中', Working: '工作中', Searching: '搜索中', Editing: '编辑中', Delegating: '委派中', 'Running Test': '跑测试', 'Running Command': '执行命令', 'Calling MCP': '调用 MCP' };
const stateLabel = (s) => STATE_LABEL[s] ?? s;
const subStateLabel = (ss) => SUBSTATE_LABEL[ss] ?? ss;

const KIND = {
  'session-start': '会话开始', prompt: '提问', tool: '工具', 'tool-error': '工具失败',
  'approval-requested': '请求审批', 'permission-prompt': '权限提示', control: '控制',
  'quota-warn': '额度预警', stop: '完成', error: '出错', idle: '空闲',
  notification: '通知', 'session-end': '会话结束',
};

function clock(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

let session = null, cap = null;

function render(data) {
  session = data.session;
  // 后端能力随会话一起下发（见 /api/sessions/:id）。拿不到就按全能力走：
  // 老服务端不带这个字段，按无能力走会让暂停按钮凭空消失一次
  cap = data.cap ?? { pause: true, cancel: true, quota: 'window', label: null, cancelNote: null };
  const s = session;
  if (!s) {
    $('name').textContent = '会话已结束';
    $('tl').innerHTML = '<div class="empty">这个会话已经不在了<br>历史事件仍保留在下方</div>';
  } else {
    const dir = (s.cwd || '').split('/').filter(Boolean).pop() || s.session_id.slice(0, 8);
    $('name').textContent = s.session_name || dir;
    $('path').textContent = s.cwd || '';
    $('state').textContent = stateLabel(s.state) + (s.sub_state ? ' · ' + subStateLabel(s.sub_state) : '');
    $('state').className = 'state ' + String(s.state).replace(/\s/g, '-');
    /**
     * 后端**不混在 chip 堆里**，单独占一行放在路径下方。
     *
     * 原来它是 chips 里的第一个 chip，和 model、ctx、花费排在一起——
     * 可这几样回答的是完全不同的问题：后端是「这个会话归谁管」，
     * 决定了这一页上哪些按钮有效、时间线里的工具名是哪一套词汇；
     * 而 model/ctx/花费是「它跑得怎么样」。
     *
     * 前者是**身份**，混在一排状态数字里就看不见了，而恰恰是它决定了
     * 你在这一页能做什么。
     */
    $('agent').innerHTML = cap.label
      ? `<span class="abadge">${esc(cap.label)}</span>` +
        (s.model ? `<span class="amodel">${esc(s.model)}</span>` : '')
      : '';
    $('agent').classList.toggle('hidden', !cap.label);

    $('chips').innerHTML = [
      // model 已经跟着后端徽标一起显示了，这里不再重复
      cap.quota !== 'window' && s.model && `<span class="chip">${esc(s.model)}</span>`,
      // 没有上下文窗口读数的后端整条不画，而不是画一个 0%
      cap.quota === 'window' && s.context && `<span class="chip">ctx ${Math.round(s.context.used_pct)}%</span>`,
      s.cost_usd != null && `<span class="chip">$${s.cost_usd.toFixed(4)}</span>`,
      // 按 API key 计费的后端没有窗口配额，累计 token 是唯一说得出口的用量。
      // 不换算成金额——那要一张会悄悄过期的价目表
      cap.quota === 'tokens' && s.tokens > 0 && `<span class="chip">${
        s.tokens < 1000 ? s.tokens
          : s.tokens < 1e6 ? (s.tokens / 1000).toFixed(s.tokens < 1e4 ? 1 : 0) + 'k'
          : (s.tokens / 1e6).toFixed(1) + 'M'} tok</span>`,
    ].filter(Boolean).join('');

    /**
     * 暂停/取消按能力显示。
     *
     * 这两件事建立在「下一个工具调用前把它挂住」这个拦截点上（src/control.mjs），
     * 是 Claude Code 的特有原语。别的后端没有等价物时按钮直接不给——
     * 留一个点了没反应的按钮，用户会以为暂停成功然后走开，那比没有按钮危险。
     */
    $('btnPause').classList.toggle('hidden', !cap.pause);
    $('btnCancel').classList.toggle('hidden', !cap.cancel);

    const paused = s.state === 'Paused';
    $('btnPause').textContent = paused ? '恢复' : '暂停';
    $('btnPause').className = (paused ? 'go' : '') + (cap.pause ? '' : ' hidden');
    // Claude Code 没有运行时暂停原语，说清楚才不会以为点了没反应
    let note = '';
    if (paused && cap.pause) note = '已请求暂停 — 会在下一个工具调用前停住，当前这一步仍会跑完';
    else if (!cap.pause && !cap.cancel) note = `${cap.label || '这个后端'}不支持从手机暂停或取消，只能审批。`;
    $('note').textContent = note;
    $('note').classList.toggle('hidden', !note);
  }

  const evs = (data.events || []).slice().reverse();
  if (evs.length) {
    $('tl').innerHTML = evs.map((e) => `
      <div class="ev" data-t="${esc(e.type)}">
        <div class="h">
          <span class="k">${esc(KIND[e.type] || e.type)}</span>
          <span class="t">${clock(e.ts)}</span>
        </div>
        ${e.detail ? `<div class="d">${esc(e.detail)}</div>` : ''}
      </div>`).join('');
  } else if (session) {
    $('tl').innerHTML = '<div class="empty">还没有事件</div>';
  }
}

async function refresh() {
  const d = await fetch(`/api/sessions/${SID}`).then((r) => r.json());
  render(d);
}

async function act(action) {
  $('btnPause').disabled = $('btnCancel').disabled = true;
  await fetch(`/api/sessions/${SID}/${action}`, { method: 'POST' }).catch(() => {});
  await refresh();
  $('btnPause').disabled = $('btnCancel').disabled = false;
}

$('btnPause').onclick = () => act(session?.state === 'Paused' ? 'resume' : 'pause');
$('btnCancel').onclick = () => {
  // 「取消」的实际效果各后端不一样，文案跟着能力表走，别写死成 Claude Code 的
  const note = cap?.cancelNote ? `\n\n${cap.cancelNote}` : '';
  if (confirm(`取消当前这一轮？${note}`)) act('cancel');
};

const es = new EventSource('/api/stream');
es.addEventListener('session', refresh);
es.addEventListener('event', refresh);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh();
});

refresh();
</script>
</body>
</html>
